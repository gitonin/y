# Vérification de construction de la version 2.
#
# La publication de l'aperçu est faite depuis la branche v1, qui met en ligne
# les deux versions en une seule fois :
#   https://<utilisateur>.github.io/<dépôt>/     -> version 1
#   https://<utilisateur>.github.io/<dépôt>/v2/  -> version 2
# Après une poussée ici, relancez « Aperçu GitHub Pages » depuis la branche v1
# (onglet Actions > Run workflow) pour republier.
name: Vérification v2

on:
  push:
    branches:
      - claude/yunma-site-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        env:
          SITE_URL: https://yunma.fr
        run: npm run build
