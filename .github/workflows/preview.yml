# Publication de l'aperçu sur GitHub Pages.
#
# Une seule publication contient les trois versions du site :
#   https://<utilisateur>.github.io/<dépôt>/       -> version 1
#   https://<utilisateur>.github.io/<dépôt>/v2/    -> version 2
#   https://<utilisateur>.github.io/<dépôt>/v3/    -> version 3
#   https://<utilisateur>.github.io/<dépôt>/v4/    -> version 4
#
# Le déploiement part toujours de cette branche : c'est elle qui publie.
# Une poussée sur une branche de version déclenche, de son côté, une simple
# vérification de build (voir le workflow de la branche concernée).
#
# La version 3 est le chantier en cours : elle a sa propre adresse pour que
# la version 2 reste consultable, inchangée, pendant les travaux.
#
# À faire une seule fois si rien ne se publie :
#   Settings > Pages > Build and deployment > Source : « GitHub Actions »
#   Settings > Environments > github-pages > Deployment branches : autoriser claude/*
name: Aperçu GitHub Pages

on:
  push:
    branches:
      - main
      - claude/yunma-coffee-ecommerce-l4qy1c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  V2_BRANCH: claude/yunma-site-v2
  V3_BRANCH: claude/yunma-site-v3
  V4_BRANCH: claude/yunma-site-v4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la version 1
        uses: actions/checkout@v4
        with:
          path: v1

      - name: Récupérer la version 2
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_BRANCH }}
          path: v2

      - name: Récupérer la version 3
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V3_BRANCH }}
          path: v3

      - name: Récupérer la version 4
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V4_BRANCH }}
          path: v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub renvoie le chemin de base tantôt avec, tantôt sans barre oblique
      # finale : on le normalise avant d'en dériver ceux des autres versions.
      - name: Calculer les chemins de publication
        id: paths
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          base="${base%/}"
          echo "v1=${base}/" >> "$GITHUB_OUTPUT"
          echo "v2=${base}/v2/" >> "$GITHUB_OUTPUT"
          echo "v3=${base}/v3/" >> "$GITHUB_OUTPUT"
          echo "v4=${base}/v4/" >> "$GITHUB_OUTPUT"
          echo "version 1 -> ${base}/"
          echo "version 2 -> ${base}/v2/"
          echo "version 3 -> ${base}/v3/"
          echo "version 4 -> ${base}/v4/"

      - name: Construire la version 1
        working-directory: v1
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v1 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      - name: Construire la version 2
        working-directory: v2
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v2 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      - name: Construire la version 3
        working-directory: v3
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v3 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      - name: Construire la version 4
        working-directory: v4
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v4 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      - name: Assembler les quatre versions
        run: |
          mkdir -p site
          cp -r v1/dist/. site/
          mkdir -p site/v2
          cp -r v2/dist/. site/v2/
          mkdir -p site/v3
          cp -r v3/dist/. site/v3/
          mkdir -p site/v4
          cp -r v4/dist/. site/v4/
          echo "Publié : / (v1), /v2/, /v3/ et /v4/"
          ls site site/v2 site/v3 site/v4 | head -50

      # Filet de sécurité : si une version pointait vers un mauvais dossier,
      # la publication s'arrête ici plutôt que de mettre en ligne un site cassé.
      - name: Vérifier les chemins des quatre versions
        run: |
          check() {
            local page="$1" expected="$2" nom="$3"
            # Les fichiers construits par Astro sont le repère le plus sûr :
            # ils existent sur toutes les pages, quels que soient les visuels.
            if ! grep -q "\"${expected}_astro/" "$page"; then
              echo "::error::$nom : les liens ne pointent pas vers $expected"
              grep -o 'src="/[^"]*"' "$page" | sort -u | head -5
              exit 1
            fi
            echo "$nom : liens vers $expected — conforme"
          }
          check site/fr/index.html    '${{ steps.paths.outputs.v1 }}' 'version 1'
          check site/v2/fr/index.html '${{ steps.paths.outputs.v2 }}' 'version 2'
          check site/v3/fr/index.html '${{ steps.paths.outputs.v3 }}' 'version 3'
          check site/v4/fr/index.html '${{ steps.paths.outputs.v4 }}' 'version 4'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
