# Vérification de construction de la version 2.
#
# La publication de l'aperçu est faite depuis la branche v1, qui met en ligne
# les deux versions en une seule fois :
#   https://<utilisateur>.github.io/<dépôt>/     -> version 1
#   https://<utilisateur>.github.io/<dépôt>/v2/  -> version 2
#   https://<utilisateur>.github.io/<dépôt>/v4/  -> version 4, ce chantier
# Après une poussée ici, relancez « Aperçu GitHub Pages » depuis la branche v1
# (onglet Actions > Run workflow) pour republier.
name: Vérification v4

on:
  push:
    branches:
      - claude/yunma-site-v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Construire le site
        env:
          SITE_URL: https://yunma.fr
        run: npm run build

      # Le site est aussi publié sous un sous-dossier (l'aperçu vit sous /y/v4/).
      # Certains défauts ne se voient que là : un code qui cherche la langue en
      # tête du chemin ne la trouve plus, et changer de langue ramène à
      # l'accueil. On construit donc une seconde fois, avec un préfixe, et l'on
      # vérifie qu'un changement de langue garde la page où l'on est.
      - name: Vérifier le changement de langue sous un sous-dossier
        env:
          SITE_URL: https://yunma.fr
          BASE_PATH: /y/v4/
        run: |
          npm run build
          npm run verifier-langues
