# Vérification de construction de la version 5.
#
# La publication de l'aperçu est faite depuis la branche de publication
# (claude/yunma-coffee-ecommerce-l4qy1c), qui met en ligne toutes les versions
# en une seule fois :
#   https://<utilisateur>.github.io/<dépôt>/     -> version 1
#   https://<utilisateur>.github.io/<dépôt>/v2/  -> version 2
#   https://<utilisateur>.github.io/<dépôt>/v3/  -> version 3
#   https://<utilisateur>.github.io/<dépôt>/v4/  -> version 4
#   https://<utilisateur>.github.io/<dépôt>/v5/  -> version 5, ce chantier
# Après une poussée ici, relancez « Aperçu GitHub Pages » depuis la branche de
# publication (onglet Actions > Run workflow) pour republier.
name: Vérification v5

on:
  push:
    branches:
      - claude/yunma-site-v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Construire le site
        env:
          SITE_URL: https://yunma.fr
        run: npm run build
