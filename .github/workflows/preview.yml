# Publication de l'aperçu sur GitHub Pages.
#
# Deux versions seulement sont en ligne :
#   https://<utilisateur>.github.io/<dépôt>/v4/   -> version 4, la référence
#   https://<utilisateur>.github.io/<dépôt>/v2/   -> essai en cours, à juger
#
# La racine n'est plus un site : c'est un simple sommaire qui mène aux deux.
# Les versions 1, 3 et 5 ont été retirées — la v4 est celle que l'on garde.
#
# Le déploiement part toujours de cette branche : c'est elle qui publie.
# Une poussée sur une branche de version déclenche, de son côté, une simple
# vérification de build (voir le workflow de la branche concernée).
#
# À faire une seule fois si rien ne se publie :
#   Settings > Pages > Build and deployment > Source : « GitHub Actions »
#   Settings > Environments > github-pages > Deployment branches : autoriser claude/*
name: Aperçu GitHub Pages

on:
  push:
    branches:
      - main
      - claude/yunma-coffee-ecommerce-l4qy1c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # L'emplacement /v2/ sert désormais d'atelier : il porte la branche d'essai
  # du moment, et non plus l'ancienne version 2 — dont la branche reste
  # intacte sur le dépôt, prête à revenir ici si besoin.
  V2_BRANCH: claude/yunma-gyro
  V4_BRANCH: claude/yunma-site-v4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche d'essai
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V2_BRANCH }}
          path: v2

      - name: Récupérer la version 4
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V4_BRANCH }}
          path: v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub renvoie le chemin de base tantôt avec, tantôt sans barre oblique
      # finale : on le normalise avant d'en dériver ceux des deux versions.
      - name: Calculer les chemins de publication
        id: paths
        run: |
          base='${{ steps.pages.outputs.base_path }}'
          base="${base%/}"
          echo "v2=${base}/v2/" >> "$GITHUB_OUTPUT"
          echo "v4=${base}/v4/" >> "$GITHUB_OUTPUT"
          echo "essai -> ${base}/v2/"
          echo "version 4 -> ${base}/v4/"

      - name: Construire l'essai
        working-directory: v2
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v2 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      - name: Construire la version 4
        working-directory: v4
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.paths.outputs.v4 }}
          PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.PUBLIC_SHOPIFY_DOMAIN }}
          PUBLIC_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.PUBLIC_SHOPIFY_STOREFRONT_TOKEN }}
          PUBLIC_SHOPIFY_ACCOUNT_URL: ${{ secrets.PUBLIC_SHOPIFY_ACCOUNT_URL }}
        run: |
          npm ci
          npm run build

      # La racine ne porte plus de site : un sommaire y mène aux deux versions.
      # Les liens sont relatifs, il n'a donc rien à savoir du chemin de base.
      - name: Assembler les deux versions
        run: |
          mkdir -p site/v2 site/v4
          cp -r v2/dist/. site/v2/
          cp -r v4/dist/. site/v4/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta name="robots" content="noindex" />
              <title>Yunma — aperçus</title>
              <link rel="icon" href="v4/brand/favicon-96.png" />
              <style>
                :root { color-scheme: light; }
                body {
                  margin: 0; min-height: 100svh;
                  display: grid; place-content: center; gap: 2rem;
                  padding: 2rem;
                  background: #efebe2; color: #212121;
                  font: 400 1rem/1.5 'Helvetica Neue', Helvetica, Arial, sans-serif;
                }
                h1 { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
                p { margin: 0; color: rgba(33, 33, 33, 0.7); max-width: 34ch; }
                ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.75rem; }
                a {
                  display: block; padding: 1rem 1.25rem;
                  border: 1px solid rgba(33, 33, 33, 0.14);
                  color: inherit; text-decoration: none;
                  transition: border-color 0.3s, background-color 0.3s;
                }
                a:hover { border-color: #994d22; background: #e3dfd7; }
                strong { font-weight: 600; }
                span { display: block; font-size: 0.8125rem; color: rgba(33, 33, 33, 0.52); }
              </style>
            </head>
            <body>
              <h1>Yunma — aperçus</h1>
              <p>La version 4 est le site de référence. L’essai reprend le même site, avec un effet en cours d’évaluation.</p>
              <ul>
                <li><a href="v4/"><strong>Version 4</strong><span>la version de référence</span></a></li>
                <li><a href="v2/"><strong>Essai — relief au gyroscope</strong><span>à ouvrir sur mobile</span></a></li>
              </ul>
            </body>
          </html>
          HTML
          echo "Publié : /v2/ (essai), /v4/ et un sommaire à la racine"
          ls site site/v2 site/v4 | head -40

      # Filet de sécurité : si une version pointait vers un mauvais dossier,
      # la publication s'arrête ici plutôt que de mettre en ligne un site cassé.
      - name: Vérifier les chemins des deux versions
        run: |
          check() {
            local page="$1" expected="$2" nom="$3"
            # Les fichiers construits par Astro sont le repère le plus sûr :
            # ils existent sur toutes les pages, quels que soient les visuels.
            if ! grep -q "\"${expected}_astro/" "$page"; then
              echo "::error::$nom : les liens ne pointent pas vers $expected"
              grep -o 'src="/[^"]*"' "$page" | sort -u | head -5
              exit 1
            fi
            echo "$nom : liens vers $expected — conforme"
          }
          check site/v2/fr/index.html '${{ steps.paths.outputs.v2 }}' 'essai'
          check site/v4/fr/index.html '${{ steps.paths.outputs.v4 }}' 'version 4'
          # Le sommaire doit mener quelque part : ses deux liens sont vérifiés.
          for cible in v2 v4; do
            grep -q "href=\"${cible}/\"" site/index.html || { echo "::error::sommaire : lien vers ${cible}/ absent"; exit 1; }
            test -f "site/${cible}/index.html" || { echo "::error::sommaire : site/${cible}/index.html absent"; exit 1; }
          done
          echo "sommaire : les deux liens mènent à une page existante"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
