<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>L'arbre à souhaits — Yunma</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
/* Le jour et la nuit. Les cinq couleurs de la charte sont reposées par le
   script à chaque bascule — voir « thème » plus bas —, et les deux
   variantes en composantes servent aux transparences : une seule encre,
   déclinée, plutôt que trente règles à retrouver une à une. */
:root{--beige:#efebe2;--paper:#fbfaf7;--ink:#212121;--rust:#b95f2c;--green:#565a41;
  --ink-rgb:33,33,33;--beige-rgb:239,235,226}
html{transition:none}
/* Rien ne se sélectionne, sauf ce qui est fait pour. Sur un téléphone, un
   appui un peu long sur un titre ou un bouton ouvrait une sélection bleue
   avec ses poignées, et la loupe du système par-dessus la scène — on venait
   tourner un arbre, pas copier un mot. On rend donc la sélection à ce qui
   la mérite : les champs de saisie, le lien qu'on copie, et l'image de la
   carte, qu'un appui long doit pouvoir enregistrer. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input,textarea,.selectable{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
html,body{margin:0;height:100%;overflow:hidden;background:var(--beige);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.zhf{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","Songti SC",serif}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 16px;pointer-events:none;z-index:5;transition:opacity .6s}
#top>*{pointer-events:auto}
#brandt{line-height:1.05;flex:0 1 auto;padding-right:12px}#tools{flex:0 0 auto}
#brandt .zhf{font-size:26px;color:var(--rust);letter-spacing:2px}
#brandt small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin-top:8px;line-height:1.3}
#tools{display:flex;gap:8px;align-items:center}
.pill{height:34px;min-width:34px;padding:0 10px;border-radius:4px;background:rgba(var(--beige-rgb),.78);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(var(--ink-rgb),.2);
  font-size:12px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill b{font-weight:500;opacity:.38}.pill b.on{opacity:1}
.pill[hidden]{display:none}
/* Le menu. Six boutons alignés dans la barre écrasaient le logo — un
   dessin à hauteur fixe dans une boîte qui rétrécit finit déformé. Il n'en
   reste que deux : couper le son, qu'on cherche vite, et ouvrir le reste. */
/* La langue, en haut à droite, à côté du son. Il y avait là un menu, qui
   n'a plus rien à porter : la visite guidée se lance seule, la musique part
   seule, les guirlandes n'existent plus, et le vent souffle dans la visite.
   Un panneau pour une seule ligne était un panneau de trop. */
#langs{padding:0 3px;gap:0}
#langs button{padding:0 7px;height:32px;font-size:12px;letter-spacing:.08em;color:var(--ink);opacity:.38}
#langs button.on{opacity:1}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 16px 14px;display:flex;flex-direction:column;align-items:center;
  gap:10px;z-index:5;pointer-events:none;transition:opacity .5s,transform .5s}
#bottom>*{pointer-events:auto}
#cta{display:flex;gap:8px;align-items:center}
.btn{height:50px;padding:0 26px;border-radius:4px;background:var(--rust);color:var(--beige);font-size:12.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;transition:background .2s}
.btn:hover{filter:brightness(.9)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(var(--beige-rgb),.82);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.round{width:50px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.45}
#sign{padding:0;display:block}
/* Hauteur fixe, largeur libre, et rien qui puisse le comprimer : c'est ce
   qui manquait quand la barre était pleine. */
#sign img{height:56px;width:auto;max-width:none;display:block;flex:none}
/* Le logo est un dessin noir sur fond transparent : sur le bleu de minuit,
   il disparaît. On ne le recompose pas — on l'inverse, ce qui en donne la
   version claire, et par fractions, pour qu'il suive le fondu du thème au
   lieu de basculer d'un coup. */
img.lg{filter:invert(var(--logo-inv,0))}
#introLogo{height:116px;width:auto;margin-bottom:26px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
/* Le vœu qu'on regarde de près porte son propre bouton : s'en approcher
   donne envie de l'envoyer, et il n'y a rien d'autre à proposer là. Une
   pilule discrète au-dessus de l'appel, et non une fiche par-dessus la
   scène. */
#voeuShare{display:none;align-items:center;gap:9px;height:38px;padding:0 16px;border-radius:999px;
  background:rgba(var(--beige-rgb),.9);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.4);
  font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);transition:opacity .25s}
#voeuShare.on{display:inline-flex}
#voeuShare svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hint{font-size:11px;color:rgba(var(--ink-rgb),.6);letter-spacing:.04em;transition:opacity 1s;text-align:center}

/* intro */
#intro{position:fixed;inset:0;z-index:20;background:var(--beige);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:24px 28px 18px;
  overflow-y:auto;transition:opacity 1.6s ease,visibility 1.6s}
#intro>:first-child{margin-top:auto}#intro>:last-child{margin-bottom:auto}#intro>*{flex:0 0 auto}
@media (max-height:640px){#introLogo{height:76px;margin-bottom:14px}#intro p{margin-bottom:18px}#intro .by img{height:56px}#intro .langs{margin-top:12px}}
#intro.gone{opacity:0;visibility:hidden}
#intro .seal{width:70px;height:70px;border-radius:4px;background:var(--rust);color:var(--beige);display:flex;align-items:center;
  justify-content:center;font-size:44px;margin-bottom:26px}
#intro h1{font-weight:500;font-size:26px;letter-spacing:.01em;margin:0 0 10px}
#intro .zh{font-size:22px;color:var(--rust);letter-spacing:.3em;margin-bottom:16px;padding-left:.3em}
#intro p{max-width:310px;font-size:14px;line-height:1.6;color:var(--ink);margin:0 0 28px}
#intro .langs{margin-top:22px;font-size:12px;letter-spacing:.14em}
#intro .langs button{padding:8px 10px;opacity:.4}#intro .langs button.on{opacity:1;text-decoration:underline;text-underline-offset:4px}
#intro .by{margin-top:28px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--green)}
#intro .by img{display:block;height:78px;width:auto;margin:10px auto 0}

/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(var(--beige-rgb),.96);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-radius:8px 8px 0 0;box-shadow:0 -20px 60px -24px rgba(var(--ink-rgb),.35);
  max-height:78vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  max-width:560px;margin:0 auto}
#sheet.open{transform:none}
#sheet header{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px 10px}
#sheet header h2{margin:0;font-size:18px;font-weight:500;line-height:1.25}
#stepN{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:500;margin-bottom:5px}
#steps{display:flex;gap:6px;padding:0 18px 12px}#steps i{flex:1;height:3px;background:rgba(var(--ink-rgb),.14);transition:background .3s}#steps i.on{background:var(--rust)}
.st{display:none}.st.on{display:block;animation:stin .35s ease}
@keyframes stin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
#tabs button{padding:8px 11px;border-radius:4px;font-size:12px;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.3);color:var(--ink)}
#tabs button.on{background:var(--ink);color:var(--beige);box-shadow:none}
.note{font-size:12px;line-height:1.5;color:rgba(var(--ink-rgb),.65);margin:8px 0 0}
#prevBig{display:block;height:190px;width:auto;max-width:60%;margin:6px auto 18px;filter:drop-shadow(0 8px 10px rgba(90,20,10,.32))}
#sheet .x{width:34px;height:34px;border-radius:4px;font-size:20px;line-height:1;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.3)}
#sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 12px}
#sheet h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:500;margin:14px 0 8px}
#shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:2px 0 6px}
#shapes button{height:104px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  background:var(--paper);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.14);transition:box-shadow .2s,background .2s}
#shapes button.on{background:#f8f6f0;box-shadow:inset 0 0 0 2px var(--rust)}
#shapes canvas{max-width:58px;max-height:82px;filter:drop-shadow(0 3px 4px rgba(90,20,10,.3))}
#presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#presets .m{font-size:14px;line-height:1.3;color:var(--ink);display:block}#presets .m.zhf{font-size:19px;color:var(--rust)}
#presets button{text-align:left;padding:10px 12px;border-radius:4px;background:var(--paper);
  box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.14)}
#presets button.on{background:#f8f6f0;box-shadow:inset 0 0 0 2px var(--rust)}
#presets .z{font-size:22px;color:var(--rust);display:block;line-height:1.15}
#presets .p{font-size:10px;color:rgba(var(--ink-rgb),.45);display:block;margin:2px 0 3px;letter-spacing:.02em}
#presets .t{font-size:12px;color:rgba(var(--ink-rgb),.78);display:block;line-height:1.3}
.field{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:4px;border:0;outline:0;color:var(--ink);
  background:var(--paper);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.3);resize:none}
.field:focus{box-shadow:inset 0 0 0 2px var(--rust);background:#f8f6f0}
#sheet footer{display:flex;gap:14px;align-items:center;padding:10px 18px 16px;border-top:1px solid rgba(var(--ink-rgb),.08)}
#prev{height:58px;width:auto;max-width:54px;filter:drop-shadow(0 4px 6px rgba(90,20,10,.35))}
#sheet footer .btn{flex:1;padding:0 10px}#sheet footer .btn.ghost{flex:0 0 auto;padding:0 16px}

/* card */
#card{position:fixed;left:12px;right:12px;bottom:14px;z-index:11;max-width:440px;margin:0 auto;padding:18px 18px 14px;
  background:rgba(var(--beige-rgb),.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:8px;
  box-shadow:0 20px 60px -28px rgba(var(--ink-rgb),.45),inset 0 0 0 1px rgba(var(--ink-rgb),.12);
  transform:translateY(130%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#card.open{transform:none}
#card .zh{font-size:34px;color:var(--rust);line-height:1.15;word-break:break-word}
#card .zh.lat{font-family:"Caveat","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:28px;color:var(--ink)}
#card .py{font-size:12px;color:rgba(var(--ink-rgb),.5);margin-top:2px;letter-spacing:.04em}
#card .tr{font-size:15px;margin-top:8px;line-height:1.4}
#card .by{font-size:12px;color:var(--green);margin-top:8px;letter-spacing:.04em}
#card .row{display:flex;gap:8px;margin-top:14px}
#card .row .btn{height:44px;font-size:11.5px;padding:0 6px;flex:1}
#cimg{display:block;max-height:50vh;max-width:100%;margin:4px auto 12px;border-radius:3px;box-shadow:0 12px 30px -14px rgba(60,40,20,.55);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
#cmodal .row .btn,#lmodal .row .btn{padding:0 6px;font-size:11.5px;letter-spacing:.1em}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:30;background:rgba(var(--ink-rgb),.45);display:none;align-items:center;justify-content:center;padding:22px}
.modal.open{display:flex}
.modal .box{background:var(--beige);border-radius:8px;padding:22px;max-width:380px;width:100%}
.modal h2{margin:0 0 8px;font-size:18px;font-weight:500}
.modal p{margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--ink)}
.modal .row{display:flex;gap:8px;margin-top:12px}.modal .row .btn{flex:1;height:46px;font-size:12px}
#toast{position:fixed;left:50%;top:88px;transform:translate(-50%,-20px);z-index:40;background:var(--ink);color:var(--beige);
  font-size:13px;line-height:1.4;padding:10px 16px;border-radius:4px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;
  max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.hide{opacity:0!important;pointer-events:none!important}
#bottom.down{transform:translateY(30px);opacity:0;pointer-events:none}#bottom.down>*{pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;z-index:50;background:var(--paper);font-size:14px;line-height:1.5}
</style>
</head>

   des fichiers compressés.

   Ils sont maintenant deux fichiers à côté. Le logo part tout de suite,

   sa carte, ce que presque personne ne fait avant d'avoir accroché un vœu.

window.YW_PHOTO="assets/carte-photo-1050x1480.jpg";

   deux circonférences l'une sur l'autre — et le bouquet de perches au
   lieu d'un arbre.

   rameaux horizontaux par paires opposées, de plus en plus courts vers le
   haut. C'est ce qui lui donne sa silhouette en cône, et c'est ce qu'on
   fait ici. Le tronc va d'un seul tenant du sol à la cime, sans marche,

var AC=null, master=null, muted=false, bus=null, sfxBus=null, SCALE=[], mIdx=7;
(function(){ var r=[1,1.2,4/3,1.5,1.8]; for(var i=0;i<14;i++) SCALE.push(123.47*r[i%5]*Math.pow(2,Math.floor(i/5))); })();
function startAudio(){
  try{
    var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return; AC=new Ctx();
    var comp=AC.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.connect(AC.destination);
    master=AC.createGain(); master.gain.value=0; master.connect(comp);
    var len=Math.floor(AC.sampleRate*7.5), buf=AC.createBuffer(2,len,AC.sampleRate), c,i;
    for(c=0;c<2;c++){ var ch=buf.getChannelData(c); for(i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2); }
    var conv=AC.createConvolver(); conv.buffer=buf; var wet=AC.createGain(); wet.gain.value=.85; conv.connect(wet); wet.connect(master);
    bus=AC.createGain(); bus.gain.value=.7; bus.connect(master); bus.connect(conv);
    sfxBus=AC.createGain(); sfxBus.gain.value=.8; sfxBus.connect(master); var sfxSend=AC.createGain(); sfxSend.gain.value=1.1; sfxBus.connect(sfxSend); sfxSend.connect(conv);
    var lp=AC.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1500; lp.connect(bus);
    // a very low gong : soft mallet, slow beating partials, long tail
    var gong=function(){ if(!AC||AC.state!=="running"||NOEL.on) return; var t=AC.currentTime+.05, FS=[98,110,123.47,146.83,164.81,196,220,246.94], f=FS[Math.floor(Math.random()*FS.length)], v=(.7+Math.random()*.25)*(f>170?.75:1), dk=f>170?.6:.8;
      [[1,.5,17],[2,.26,13],[2.76,.13,9],[3.42,.06,6],[4.3,.03,4]].forEach(function(p){ [0,.45].forEach(function(b){
        var o=AC.createOscillator(), g=AC.createGain(); o.type="sine"; o.frequency.value=f*p[0]+b;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(p[1]*v,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+p[2]*dk);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t+p[2]*dk+.1); }); });
      var th=AC.createOscillator(), tg=AC.createGain(); th.type="sine"; th.frequency.setValueAtTime(f*2.2,t); th.frequency.exponentialRampToValueAtTime(f,t+.3);
      tg.gain.setValueAtTime(0,t); tg.gain.linearRampToValueAtTime(.35*v,t+.01); tg.gain.exponentialRampToValueAtTime(.0001,t+.5); th.connect(tg); tg.connect(lp); th.start(t); th.stop(t+.6); };
    setTimeout(gong,1200); (function loop(){ setTimeout(function(){ gong(); loop(); },7000+Math.random()*6000); })();
    master.gain.linearRampToValueAtTime(.75,AC.currentTime+2.5);
    if(AC.state==="suspended") AC.resume();
  }catch(e){ AC=null; }
}
function pluck(f,t,vol,dest){ if(!AC) return; t=t||AC.currentTime;
  var o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), g2=AC.createGain(), lp=AC.createBiquadFilter();
  o.type="triangle"; o.frequency.setValueAtTime(f*.985,t); o.frequency.exponentialRampToValueAtTime(f,t+.12); o2.type="sine"; o2.frequency.value=f*2.003; g2.gain.value=.18;
  lp.type="lowpass"; lp.frequency.value=1700; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+4.2);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(dest||sfxBus); o.start(t); o2.start(t); o.stop(t+4.4); o2.stop(t+4.4); }
function blip(f,type,peak,dec,t,f2){ var o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dec);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dec); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+dec+.05); }
// interaction sounds : wooden fish for buttons, a pentatonic pluck per choice, a small bell on a tag, a bowl when a wish is hung
function sfx(kind,n){ if(!AC||muted||!sfxBus||AC.state!=="running") return; var t=AC.currentTime+.005;
  try{
    if(kind==="tap"){ blip(760,"sine",.13,.07,t,520); blip(1520,"triangle",.035,.035,t); }
    else if(kind==="open"){ blip(392,"sine",.09,.22,t,330); blip(588,"sine",.04,.3,t+.05); }
    else if(kind==="select"){ pluck(SCALE[5+((n||0)%8)],t,.075,sfxBus); }
    else if(kind==="tag"){ blip(1318.5,"sine",.07,1.2,t); blip(1975.5,"sine",.03,.9,t); blip(2637,"sine",.014,.6,t); }
    else if(kind==="hang"){ blip(98,"sine",.3,7,t); blip(98.5,"sine",.22,7,t); blip(196,"sine",.1,5,t); blip(270.5,"sine",.04,3,t); [5,7,8,10].forEach(function(i,k){ pluck(SCALE[i],t+.25+k*.16,.06,sfxBus); }); }
  }catch(e){} }
document.addEventListener("click",function(e){ var b=e.target&&e.target.closest?e.target.closest("button"):null; if(!b) return;
  var par=b.parentNode, id=b.id; if(id==="hang"||id==="enter"||id==="snd") return;
  if(par&&(par.id==="shapes"||par.id==="presets"||par.id==="tabs")){ sfx("select",Array.prototype.indexOf.call(par.children,b)); return; }
  sfx(id==="add"?"open":"tap"); },true);
function setMuted(m){ muted=m; $("sndw").style.display=m?"none":""; $("snd").style.opacity=m?.55:1;
  if(AC&&master){ var t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value,t); master.gain.linearRampToValueAtTime(m?0:.75,t+1.2); } }

$("enter").onclick=function(){
  entered=true; startAudio(); $("intro").classList.add("gone"); $("top").classList.remove("hide"); $("bottom").classList.remove("down");
  /* Le conseil du bas ne s'efface plus au bout de neuf secondes. Il
     disparaissait juste au moment où l'on commençait à vouloir toucher
     quelque chose, et plus rien ne disait comment. */
  /* La musique part d'elle-même, et ne se choisit plus : on entre dans une
     veillée de Noël, et la pilule du son suffit à la faire taire. Elle ne
     peut partir qu'ici : un navigateur ne donne le son qu'après un geste,
     et « Entrer » est ce geste. */
  noelPartir();
  if(window.__enter) window.__enter();
};

/* ------------------------------------------------------------------ ciel : l'heure qu'il est
   Repris de l'atlas des variétés, à la virgule près : c'est la même
   journée du Yunnan, et deux expériences du même site n'ont pas à avoir
   deux couchants différents.

   Le tour d'horloge dure deux heures pour vingt-quatre : on reste dans la
   demi-journée où l'on est arrivé, la lumière bouge assez pour se voir sur
   une longue visite, et celui qui vient le soir a toujours son couchant.
   « ?heure=20 » fige l'horloge — c'est pour les épreuves. */
var CIEL=(function(){
  var TOUR=7200, fixe=null, depart=10;
  try{ var h=new URLSearchParams(location.search).get("heure"); if(h!==null&&isFinite(+h)) fixe=((+h)%24+24)%24; }catch(e){}
  try{ var d=new Date(); depart=d.getHours()+d.getMinutes()/60; }catch(e){}
  var t0=performance.now();
  function heure(){ return fixe!==null?fixe:(depart+(performance.now()-t0)/1000/TOUR*24)%24; }
  /* Pour chaque moment : l'heure, le bas du ciel (c'est aussi la brume et
     le fond de la page), le haut du ciel, la couleur de la lumière, et la
     part de nuit — 0 en plein jour, 1 au plus noir. */
  var MOMENTS=[
    [ 0.0,[ 10, 16, 32],[  4,  7, 15],[ 46, 60, 96],1   ],
    [ 4.2,[ 24, 31, 54],[  8, 12, 25],[ 58, 70,105],.94 ],
    [ 5.6,[ 92, 78,104],[ 30, 36, 66],[122, 92,118],.74 ],
    [ 6.4,[232,172,158],[122,134,176],[244,170,140],.40 ],
    [ 7.6,[243,226,212],[196,210,228],[255,236,214],.14 ],
    [ 9.5,[239,235,226],[246,244,238],[255,250,242],.02 ],
    [13.0,[239,235,226],[248,246,240],[255,253,248],0   ],
    [16.5,[241,230,216],[236,236,234],[255,240,218],.05 ],
    [18.1,[232,176,150],[170,150,178],[250,180,132],.30 ],
    [19.0,[160, 96,122],[ 86, 66,116],[180,104,128],.62 ],
    [19.9,[ 62, 40, 78],[ 26, 26, 58],[ 86, 58, 96],.86 ],
    [21.2,[ 10, 16, 32],[  4,  7, 15],[ 46, 60, 96],1   ],
    [24.0,[ 10, 16, 32],[  4,  7, 15],[ 46, 60, 96],1   ]
  ];
  function lisse(x){ return x*x*(3-2*x); }
  function mel(a,b,k){ return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]; }
  function etat(h){
    var i=0; while(i<MOMENTS.length-2&&MOMENTS[i+1][0]<=h) i++;
    var A=MOMENTS[i], B=MOMENTS[i+1], k=lisse(Math.max(0,Math.min(1,(h-A[0])/(B[0]-A[0]))));
    return {h:h,bas:mel(A[1],B[1],k),haut:mel(A[2],B[2],k),lum:mel(A[3],B[3],k),nuit:A[4]+(B[4]-A[4])*k};
  }
  /* Le soleil : zéro à six heures dix, zéro à dix-huit heures quarante, au
     plus haut un peu après midi. Sous l'horizon, il continue sa course —
     c'est ce qui fait que l'ombre tourne encore au crépuscule. */
  function elevation(h){ return 1.16*Math.sin(Math.PI*(h-6.17)/12.5); }
  function azimut(h){ return Math.PI*(h-6.17)/12.5+2.0; }
  /* Se placer à une heure donnée sans arrêter le temps : « ?heure= » fige
     l'horloge, ce qui ne permet justement pas de vérifier qu'elle avance. */
  function poser(h){ fixe=null; depart=(((h%24)+24)%24)-(performance.now()-t0)/1000/TOUR*24; }
  return {TOUR:TOUR,heure:heure,etat:etat,elevation:elevation,azimut:azimut,poser:poser,mel:mel};
})();

var SUN={dir:[-.55,.72,.42],col:[1,.99,.965],nuit:0,jour:1,el:.5,ciel:CIEL.etat(CIEL.heure())};
function sunMaj(){
  var h=CIEL.heure(), c=CIEL.etat(h), el=CIEL.elevation(h), az=CIEL.azimut(h), ce=Math.cos(el);
  SUN.dir=[ce*Math.cos(az),Math.sin(el),ce*Math.sin(az)];
  SUN.col=[c.lum[0]/255,c.lum[1]/255,c.lum[2]/255];
  SUN.el=el; SUN.nuit=c.nuit; SUN.ciel=c;
  /* Au-dessus de l'horizon ou non : c'est ce qui éteint le halo, allume les
     étoiles, et fait passer la lumière du soleil à la lune. */
  SUN.jour=Math.max(0,Math.min(1,(el+.06)/.16));
}

   Le beige du jour est aussi, au nombre près, le bas du ciel à midi : la
   page et l'horizon sont de la même couleur, et ce n'est pas un hasard —
   c'est le même papier. Les teintes de nuit sont celles de l'atlas, qui a
   déjà fait l'épreuve du contraste au plus noir. */
var JOUR={beige:[239,235,226],paper:[251,250,247],ink:[ 33, 33, 33],rust:[185, 95, 44],green:[ 86, 90, 65]};
var NUIT={beige:[ 16, 22, 38],paper:[ 26, 33, 52],ink:[236,234,228],rust:[223,140, 87],green:[150,156,120]};
function themeMaj(){
  var c=SUN.ciel, clarte=(.2126*c.bas[0]+.7152*c.bas[1]+.0722*c.bas[2])/255;
  if(clarte<.46) themeCible=1; else if(clarte>.52) themeCible=0;
  var m=performance.now()/1000, dt=themeT===null?0:Math.min(.25,Math.max(0,m-themeT)); themeT=m;
  theme+=Math.sign(themeCible-theme)*Math.min(Math.abs(themeCible-theme),dt*.95);
  if(Math.abs(theme-themePose)<=.004) return;
  themePose=theme;
  ["beige","paper","ink","rust","green"].forEach(function(k){
    CSSV.setProperty("--"+k,"rgb("+CIEL.mel(JOUR[k],NUIT[k],theme).map(Math.round).join(",")+")"); });
  /* Les boutons et les traits sont posés en « rgba(33,33,33,…) » un peu
     partout : une seule variable d'encre, déclinée, évite d'aller les
     chercher un à un. */
  CSSV.setProperty("--ink-rgb",CIEL.mel(JOUR.ink,NUIT.ink,theme).map(Math.round).join(","));
  CSSV.setProperty("--beige-rgb",CIEL.mel(JOUR.beige,NUIT.beige,theme).map(Math.round).join(","));
  CSSV.setProperty("--logo-inv",theme.toFixed(3));
}
themeMaj();

/* ---- le ciel ----
   Un dôme, et un seul shader qui porte toute l'heure : le dégradé du bas
   vers le haut, les étoiles, et le halo du soleil. Il est écrit en valeurs
   d'écran et non en lumière : une matière brute ne passe pas par la
   conversion de sortie de three.js, donc ce qu'on écrit ici est ce qui
   s'affiche — comme dans l'atlas, et avec les mêmes nombres. */
var skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uBas:{value:new THREE.Vector3(.94,.92,.89)}, uHaut:{value:new THREE.Vector3(.97,.96,.94)},
    uLum:{value:new THREE.Vector3(1,.99,.96)}, uSoleil:{value:new THREE.Vector3(0,1,0)},
    uNuit:{value:0}, uJour:{value:1}, uT:{value:0} },
  vertexShader:"varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader:[
  "precision highp float;",
  "varying vec3 vD;",
  "uniform vec3 uBas,uHaut,uLum,uSoleil; uniform float uNuit,uJour,uT;",
  "float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }",
  "void main(){",
  "  vec3 d=normalize(vD); float y=d.y*0.5+0.5;",
  "  vec3 c=mix(uBas,uHaut,smoothstep(0.50,0.94,y));",
  /* Les étoiles : une grille fine posée sur la direction du regard, une
     case sur une vingtaine allumée, et un battement très lent. Elles
     tiennent au ciel et non à l'écran — on tourne, elles restent. */
  "  if(uNuit>0.02){",
  "    vec2 su=vec2(atan(d.z,d.x)*22.0, asin(clamp(d.y,-1.0,1.0))*26.0);",
  "    vec2 ci=floor(su), cf=fract(su); float r1=h21(ci);",
  "    if(r1>0.955){ vec2 o=vec2(h21(ci+1.7),h21(ci+4.3)); float dd=length(cf-o);",
  "      float br=(r1-0.955)/0.045;",
  "      float sc=smoothstep(0.26,0.0,dd)*(0.35+0.65*br*br);",
  "      sc*=0.6+0.4*sin(uT*(0.6+br*1.7)+r1*40.0);",
  "      c+=vec3(0.82,0.88,1.0)*sc*1.9*uNuit*smoothstep(0.50,0.66,y); } }",
  "  float sd=max(0.0,dot(d,uSoleil));",
  "  float halo=pow(sd,5.0)*0.34+pow(sd,120.0)*0.55;",
  "  c=mix(c,mix(vec3(1.0,0.995,0.985),uLum,0.22+0.5*uNuit),halo*uJour);",
  "  gl_FragColor=vec4(c,1.0);",
  "}"].join("\n")});
var skyDome=new THREE.Mesh(new THREE.SphereGeometry(2000,40,24),skyMat);
skyDome.renderOrder=-10; skyDome.frustumCulled=false; scene.add(skyDome);

/* ---- les montagnes du Yunnan ----
   Le même relevé que l'atlas, à la même place du monde : de 97,8° à 102,6°
   est et de 21° à 26,2° nord, soit environ 490 km sur 578. Ici elles ne
   sont qu'un horizon — on ne s'en approche jamais —, d'où une maille plus
   large et une finesse de relevé moitié moindre.

   L'altitude est exagérée, comme dans l'atlas : 3 100 m de dénivelé réel
   sur 490 km de large ne feraient, à l'échelle, qu'un pli imperceptible.

   Le relief est surtout très bas, et c'est tout le réglage. Posé à hauteur
   d'île, il mangeait le ciel : des crêtes à dix unités de l'arbre, hautes
   comme lui, et plus d'horizon du tout. Neuf cents unités plus bas, il
   disparaissait dans les coins. Cinq cent vingt : les crêtes passent au
   tiers bas de l'image, derrière l'île, l'arbre se détache sur le ciel, et
   c'est là que vient le vertige — il est au-dessus du Yunnan, pas posé
   dessus. */
var EXT=900, EXTZ=EXT*1.18, Y0=-395, AMPL=430, terrain=null, terMat=null;
(function(){
  var b, m=RELIEF.m, a=new Uint8Array(m*m), i, j;

  /* Le relevé est stocké en écart à la moyenne du voisin de gauche et de
     celui du dessus : un relief est lisse, les écarts sont petits, et la
     page y gagne un bon tiers une fois compressée. */
  if(RELIEF.c==="moyenne") for(j=0;j<m;j++) for(i=0;i<m;i++){ var k=j*m+i, g=i?a[k-1]:0, dd=j?a[k-m]:0; a[k]=(a[k]+((g+dd)>>1))&255; }
  var ech=function(i,j){ return a[Math.max(0,Math.min(m-1,j))*m+Math.max(0,Math.min(m-1,i))]; };
  /* On ne montre pas toute la province, mais un tiers : quatre cent
     quatre-vingt-dix kilomètres étalés sur un horizon, ce sont des crêtes
     tous les dix pixels, et le relief se chiffonne comme du papier. Un tiers
     de la zone sur la même largeur, ce sont des croupes trois fois plus
     larges — celles de l'atlas, qu'on regarde d'un peu plus loin. La fenêtre
     est prise au centre de la ceinture caféière. */
  var ZOOM=.34, Z0=(1-ZOOM)/2;
  /* Interpolation bicubique de Catmull-Rom : le relevé est quantifié sur un
     octet, soit douze mètres par pas, et une bilinéaire laisserait voir la
     grille en coussins sur les versants doux. */

     que les versants ne soient pas d'un seul ton. */
  function h2(i,j){ var n=Math.sin(i*127.1+j*311.7)*43758.5453; return n-Math.floor(n); }
  function vb(x,z){ var i=Math.floor(x), j=Math.floor(z), fx=x-i, fz=z-j;
    fx=fx*fx*(3-2*fx); fz=fz*fz*(3-2*fz);
    var a0=h2(i,j), b0=h2(i+1,j), c0=h2(i,j+1), d0=h2(i+1,j+1);

    var i0=Math.floor(u), j0=Math.floor(v), fx=u-i0, fz=v-j0, q;
    for(q=0;q<4;q++) rang[q]=cmr(ech(i0-1,j0-1+q),ech(i0,j0-1+q),ech(i0+1,j0-1+q),ech(i0+2,j0-1+q),fx);
    var h=Math.max(0,Math.min(255,cmr(rang[0],rang[1],rang[2],rang[3],fz)));

  var N=petit()?190:260, step=EXT*2/N, stepZ=EXTZ*2/N;
  var pos=new Float32Array((N+1)*(N+1)*3), nor=new Float32Array(pos.length), col=new Float32Array(pos.length);
  for(j=0;j<=N;j++) for(i=0;i<=N;i++){
    var x=-EXT+i*step, z=-EXTZ+j*stepZ, y=hgt(x,z), k=(j*(N+1)+i)*3;
    pos[k]=x; pos[k+1]=y; pos[k+2]=z;
    /* La normale se mesure sur la moitié d'une maille de rendu : plus large,
       elle moyennerait le modelé qu'elle est censée révéler, et les versants
       s'éteindraient en aplats. */

    nor[k]=nx; nor[k+1]=ny; nor[k+2]=nz;

       avec l'altitude, et des versants à peine assombris. Le grain, lui,
       empêche les grandes pentes douces de tourner à l'aplat. */

  }

  for(j=0;j<N;j++) for(i=0;i<N;i++){ var p0=j*(N+1)+i, p1=p0+1, p2=p0+N+1, p3=p2+1;
    idx[q2++]=p0; idx[q2++]=p2; idx[q2++]=p1; idx[q2++]=p1; idx[q2++]=p2; idx[q2++]=p3; }

  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("aC",new THREE.Float32BufferAttribute(col,3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  /* Matière brute, comme le ciel : la brume du lointain y est écrite à la
     main, et elle va vers le bas du ciel. C'est l'air, et c'est ce qui donne
     sa profondeur à la vallée. La brume de la scène, elle, s'arrête à
     quelques dizaines d'unités autour de l'arbre : elle avalerait tout. */

    uniforms:{ uBas:{value:new THREE.Vector3(.94,.92,.89)}, uHaut:{value:new THREE.Vector3(.97,.96,.94)},
      uL:{value:new THREE.Vector3(0,1,0)}, uLC:{value:new THREE.Vector3(1,.99,.96)}, uNuit:{value:0} },
    vertexShader:[
    "attribute vec3 aC; varying vec3 vN; varying vec3 vC; varying float vD;",
    "void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vD=-mv.z; vN=normal; vC=aC;",
    "  gl_Position=projectionMatrix*mv; }"].join("\n"),
    fragmentShader:[
    "precision highp float;",
    "varying vec3 vN; varying vec3 vC; varying float vD;",
    "uniform vec3 uBas,uHaut,uL,uLC; uniform float uNuit;",
    "void main(){",
    "  vec3 n=normalize(vN), L=normalize(uL);",
    "  float nl=dot(n,L), dif=max(nl,0.0), wrap=clamp(nl*0.5+0.5,0.0,1.0), hemi=n.y*0.5+0.5;",
    "  vec3 sky=uHaut*1.02, gnd=mix(uBas,vec3(0.9,0.855,0.79),0.55);",
    "  vec3 col=vC*(mix(gnd,sky,hemi)*0.6+uLC*(dif*0.52+wrap*wrap*0.12));",
    "  col=min(col,vec3(1.0));",
    "  float m=clamp(1.0-exp(-pow(vD/1400.0,2.0)*1.25),0.0,0.94);",
    "  gl_FragColor=vec4(mix(col,uBas,m),1.0);",
    "}"].join("\n")});

})();

/* ---- les lumières ----
   Le soleil suit l'heure et se couche pour de bon. Quand il passe sous
   l'horizon, une lune froide prend le relais : sans elle, la nuit serait
   un aplat noir, et l'arbre y disparaîtrait avec les vœux. */
var hemi=new THREE.HemisphereLight(C(0xfff6e4),C(0xb9a58a),0.62); scene.add(hemi);
var sun=new THREE.DirectionalLight(C(0xffeed2),1.0); sun.position.set(6.5,12,5.5); sun.target.position.set(0,2.5,0);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-9; sun.shadow.camera.right=9; sun.shadow.camera.top=9; sun.shadow.camera.bottom=-9;
sun.shadow.camera.near=1; sun.shadow.camera.far=32; sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03; sun.shadow.radius=3;
scene.add(sun); scene.add(sun.target);
var rim=new THREE.DirectionalLight(C(0xf0c979),0.32); rim.position.set(-7,4,-6); scene.add(rim);
var lune=new THREE.DirectionalLight(C(0xa8b8dc),0.0); lune.position.set(-8,10,-6); scene.add(lune);
/* L'arbre et l'île sont dans `world`, qui monte et descend doucement ; le
   soleil, lui, tourne autour du monde. On le repose à chaque image. */
function lumMaj(){
  var d=SUN.dir, j=SUN.jour, n=SUN.nuit;
  sun.position.set(d[0]*22,Math.max(.6,d[1])*22,d[2]*22);
  sun.color.setRGB(SUN.col[0],SUN.col[1],SUN.col[2]).convertSRGBToLinear();
  sun.intensity=1.0*j;
  /* L'ombre portée s'efface avec le soleil : une ombre dure sous une lune
     se voit tout de suite, et ne ressemble à rien. */
  sun.castShadow=j>.08;
  lune.intensity=.27*n;
  rim.intensity=.32*j+.10*n;
  var c=SUN.ciel;
  /* Le ciel au-dessus et le sol en dessous : la lumière d'ambiance vient
     des deux, et c'est elle qui tient la nuit sans l'écraser. */
  hemi.color.setRGB(c.haut[0]/255,c.haut[1]/255,c.haut[2]/255).convertSRGBToLinear();
  hemi.groundColor.setRGB(c.bas[0]/255*.72,c.bas[1]/255*.68,c.bas[2]/255*.62).convertSRGBToLinear();
  hemi.intensity=.62*j+.30*n;
}
/* Le ciel, la brume de la scène et le fond de la page prennent la couleur
   du bas du ciel : à midi le papier du site, à minuit le bleu presque noir.
   Tout se tient alors sans qu'on ait à accorder deux valeurs à la main. */
var fondTmp=new THREE.Color();
function cielMaj(t){
  var c=SUN.ciel, bas=[c.bas[0]/255,c.bas[1]/255,c.bas[2]/255], haut=[c.haut[0]/255,c.haut[1]/255,c.haut[2]/255];
  skyMat.uniforms.uBas.value.set(bas[0],bas[1],bas[2]);
  skyMat.uniforms.uHaut.value.set(haut[0],haut[1],haut[2]);
  skyMat.uniforms.uLum.value.set(SUN.col[0],SUN.col[1],SUN.col[2]);
  skyMat.uniforms.uSoleil.value.set(SUN.dir[0],SUN.dir[1],SUN.dir[2]);
  skyMat.uniforms.uNuit.value=SUN.nuit; skyMat.uniforms.uJour.value=SUN.jour; skyMat.uniforms.uT.value=t;
  if(terMat){
    terMat.uniforms.uBas.value.set(bas[0],bas[1],bas[2]);
    terMat.uniforms.uHaut.value.set(haut[0],haut[1],haut[2]);
    terMat.uniforms.uL.value.set(SUN.dir[0],SUN.dir[1],SUN.dir[2]);
    terMat.uniforms.uLC.value.set(SUN.col[0],SUN.col[1],SUN.col[2]);
    terMat.uniforms.uNuit.value=SUN.nuit;
  }
  /* La brume de la scène va vers le bas du ciel, elle aussi : sans quoi
     l'arbre se détacherait sur un halo beige en pleine nuit. */
  fondTmp.setRGB(bas[0],bas[1],bas[2]).convertSRGBToLinear();
  scene.fog.color.copy(fondTmp);
  renderer.setClearColor(fondTmp,1);
}

// bark
var barkTex=canvasTex(512,512,function(g,w,h){
  g.fillStyle="#7b6654"; g.fillRect(0,0,w,h); var r=mulberry(11), i;
  for(i=0;i<900;i++){ var x=r()*w, y=r()*h, l=30+r()*150, d=r(); g.strokeStyle=d<.55?"rgba(38,26,18,"+(.08+r()*.22)+")":"rgba(214,190,160,"+(.05+r()*.14)+")";
    g.lineWidth=.6+r()*2.6; g.beginPath(); g.moveTo(x,y); g.bezierCurveTo(x+r()*10-5,y+l*.3,x+r()*10-5,y+l*.7,x+r()*12-6,y+l); g.stroke(); }
  for(i=0;i<60;i++){ g.fillStyle="rgba(98,110,70,"+(.05+r()*.1)+")"; g.beginPath(); g.ellipse(r()*w,r()*h,6+r()*22,10+r()*40,r(),0,6.283); g.fill(); }
});
barkTex.wrapS=barkTex.wrapT=THREE.RepeatWrapping; barkTex.anisotropy=4;
var barkMat=new THREE.MeshStandardMaterial({map:barkTex,bumpMap:barkTex,bumpScale:0.035,roughness:.95,metalness:0});

function tubes(list){
  var pos=[],nor=[],uv=[],idx=[];
  list.forEach(function(b){
    var rad=b.depth===0?16:(b.depth===1?10:(b.depth===2?7:5)), n=b.pts.length, base=pos.length/3, i,j, nrm=null, vl=0;
    for(i=0;i<n;i++){
      var t=vnorm(vsub(b.pts[Math.min(i+1,n-1)],b.pts[Math.max(i-1,0)]));
      nrm = nrm? vnorm(vsub(nrm,vscale(t,vdot(nrm,t)))) : perp(t);
      var bn=vcross(t,nrm); if(i>0) vl+=vlen(vsub(b.pts[i],b.pts[i-1]));
      for(j=0;j<=rad;j++){ var a=j/rad*6.2832, cs=Math.cos(a), sn=Math.sin(a);
        var gn=b.depth<=1?1+.10*Math.sin(a*3+i*.9)+.05*Math.sin(a*7+i*2.1):1, r=b.radii[i]*gn;
        var d=[nrm[0]*cs+bn[0]*sn,nrm[1]*cs+bn[1]*sn,nrm[2]*cs+bn[2]*sn];
        pos.push(b.pts[i][0]+d[0]*r,b.pts[i][1]+d[1]*r,b.pts[i][2]+d[2]*r); nor.push(d[0],d[1],d[2]);
        uv.push(j/rad*(b.depth===0?3:(b.depth===1?2:1)), vl*.55); }
    }
    for(i=0;i<n-1;i++) for(j=0;j<rad;j++){ var p0=base+i*(rad+1)+j, p1=p0+rad+1; idx.push(p0,p0+1,p1, p0+1,p1+1,p1); }
  });
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); g.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); return g;
}
var treeMesh=new THREE.Mesh(tubes(branches.concat(extras)),barkMat); treeMesh.castShadow=true; treeMesh.receiveShadow=true; world.add(treeMesh);

// floating island
(function(){
  var prof=[[.001,-2.7],[.45,-2.1],[1.05,-1.45],[1.75,-.85],[2.45,-.4],[2.85,-.12],[2.95,.0],[2.7,.07],[1.9,.14],[1,.2],[.001,.22]]

     saute des images par poignées, et la mélodie hoquetait ; un battement
     de quart de seconde, lui, continue de programmer les notes quoi qu'il
     arrive à l'affichage. Onglet caché, le son est suspendu de toute
     façon : rien ne s'accumule. */
  if(!NOEL.tic) NOEL.tic=setInterval(noelMaj,220);
}
function noelArreter(){ NOEL.on=false; if(NOEL.tic){ clearInterval(NOEL.tic); NOEL.tic=0; } }
function noelMaj(){
  if(!NOEL.on||!AC||muted||AC.state!=="running") return;
  var t=AC.currentTime;
  /* Si l'horloge a pris de l'avance sur nous — le son coupé, un onglet
     laissé de côté —, on repart d'ici : sans cela, la boucle programmerait
     d'un coup toutes les notes du temps perdu, et elles sonneraient
     ensemble. */
  if(!NOEL.quand||NOEL.quand<t) NOEL.quand=t+.3;
  /* On programme tout ce qui tombe dans la seconde et demie qui vient. */
  while(NOEL.quand<t+1.4){
    var air=AIRS[NOEL.air], n=air.notes[NOEL.i];
    if(!n){
      /* L'air est fini : un silence, puis l'autre air. On ne répète pas
         deux fois le même — une veilleuse qui boucle se remarque. */
      NOEL.i=0; NOEL.air=(NOEL.air+1)%AIRS.length;
      NOEL.quand+=pauseZen(NOEL.quand); continue;
    }
    var d=n[1]*air.croche;
    if(n[0]>-90){
      cloche(doMi(n[0]+12),NOEL.quand,.19);
      if(n[1]>=4) cloche(doMi(n[0]+24),NOEL.quand,.055);
      NOEL.fin=NOEL.quand; NOEL.battement=NOEL.quand;
      if(NOEL.i===0) coussin(NOEL.quand,air.notes.length*air.croche*2.2);
    }
    NOEL.quand+=d; NOEL.i++;
  }
}

/* Les guirlandes de fête ont été retirées. Deux cents ampoules le long des
   rameaux, un voile de couleur sur l'image : joli la nuit, bavard le jour,
   et une option de plus dans un menu qui doit rester court. L'arbre est un
   arbre ; ce qui brille la nuit, ce sont les vœux. */
/* ------------------------------------------------------------------ les surprises
   Une veilleuse qui ne surprend jamais finit par ne plus rien montrer. Le
   ciel a donc deux habitants, chacun à son heure : des oiseaux le jour,
   des étoiles filantes la nuit. Ils passent loin, derrière l'île, au-delà
   de la brume — leurs matières ignorent donc le brouillard, comme les
   montagnes et le ciel, sans quoi ils disparaîtraient avant d'être vus.

   Ils vont et viennent d'eux-mêmes, mais rarement ; la visite guidée, elle,
   les appelle. */

/* Des volutes d'air. Un vol d'oiseaux passait ici : joli de près, mais à
   trente unités ce ne sont plus que des triangles sombres, et l'on ne
   savait pas ce qu'on voyait. Un courant d'air ne demande pas qu'on le
   reconnaisse — il passe, il ondule, il s'en va.

   Trois rubans, chacun un ruban plat de soixante-quatre segments dont on
   recalcule la courbe à chaque image : deux ondulations qui ne tombent pas
   juste, l'une en hauteur, l'autre en profondeur, et une largeur qui
   s'éteint aux deux bouts. Ils traversent le fond de l'image, derrière
   l'île, et reviennent de loin en loin.

   Ils ne sont pas additifs : sur un ciel crème à peine moins blanc qu'eux,
   l'addition ne se voit pas. Ils sont dorés le jour — un souffle de
   lumière —, bleu pâle la nuit. */
var RUB=(function(){
  var N=64;
  var tex=canvasTex(256,16,function(g,w,h){
    var gr=g.createLinearGradient(0,0,w,0);
    gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(.18,"rgba(255,255,255,.55)");
    gr.addColorStop(.5,"rgba(255,255,255,1)"); gr.addColorStop(.82,"rgba(255,255,255,.55)");
    gr.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    /* Un creux au milieu dans la hauteur : le ruban se lit comme deux
       filets jumeaux plutôt que comme une barre. */
    var v=g.createLinearGradient(0,0,0,h);
    v.addColorStop(0,"rgba(255,255,255,0)"); v.addColorStop(.3,"rgba(255,255,255,1)");
    v.addColorStop(.5,"rgba(255,255,255,.45)"); v.addColorStop(.7,"rgba(255,255,255,1)");
    v.addColorStop(1,"rgba(255,255,255,0)");
    g.globalCompositeOperation="destination-in"; g.fillStyle=v; g.fillRect(0,0,w,h);
  });
  var grp=new THREE.Group(); grp.visible=false; scene.add(grp);
  var mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,fog:false,
    side:THREE.DoubleSide,opacity:0});
  var rub=[], i, k;
  for(k=0;k<3;k++){
    var g2=new THREE.PlaneGeometry(1,1,N,1);
    var m=new THREE.Mesh(g2,mat);
    m.frustumCulled=false;
    m.userData={ph:R()*6.283,L:26+R()*14,A:.22+R()*.3,B:.5+R()*.7,W:.2+R()*.14,
      v1:.8+R()*.7,v2:.55+R()*.5,dy:(k-1)*1.25+(R()-.5)*.5,sp:.45+R()*.4};
    grp.add(m); rub.push(m);
  }
  return {grp:grp,rub:rub,mat:mat,N:N,t:-99,duree:13,a:0,b:0,h:0};
})();
function volutePasser(){
  if(clock-RUB.t<RUB.duree) return;
  /* Comme les oiseaux avant elles : derrière l'île, en travers de ce qu'on
     regarde, et non à un azimut tiré au sort qui tombe hors champ. */
  var sens=R()<.5?-1:1, base=cam.th+Math.PI+(R()-.5)*.4;
  RUB.t=clock; RUB.a=base-sens*.8; RUB.b=base+sens*.8; RUB.h=4+R()*5;
  RUB.grp.visible=true;
}
function voluteMaj(t){
  if(!RUB.grp.visible) return;
  var u=(t-RUB.t)/RUB.duree;
  if(u>1||u<0){ RUB.grp.visible=false; RUB.mat.opacity=0; return; }
  var D=30, a=RUB.a+(RUB.b-RUB.a)*u;
  /* Et il monte d'un rien en passant, comme l'air chaud. */
  RUB.grp.position.set(Math.sin(a)*D,RUB.h+u*1.6,Math.cos(a)*D);
  RUB.grp.rotation.y=a+(RUB.b<RUB.a?Math.PI:0)+Math.PI/2;
  /* Un trait d'encre le jour, une lueur pâle la nuit. Doré sur le crème du
     ciel, le ruban ne se voyait pas : il n'y a pas trente pour cent
     d'écart entre un or clair et ce fond-là. L'encre, si — et c'est la
     matière du site, dont le logo est fait de traits. */
  var n=SUN.nuit;
  RUB.mat.color.setRGB(.14+.64*n,.15+.71*n,.14+.86*n).convertSRGBToLinear();
  /* Il paraît vite et s'en va longuement : un souffle de vent ne s'éteint
     pas comme il s'allume. */
  RUB.mat.opacity=Math.min(1,u*6)*Math.min(1,(1-u)*2.2)*(.3+.3*n);
  for(var k=0;k<RUB.rub.length;k++){
    var m=RUB.rub[k], d=m.userData, pos=m.geometry.attributes.position, A=pos.array;
    for(var i=0;i<=RUB.N;i++){
      var q=i/RUB.N, x=(q-.5)*d.L;
      /* Presque à plat : le ruban ondule de quelques dixièmes d'unité sur
         vingt-six de long. Ce n'est pas une arabesque, c'est un souffle. */
      var y=d.dy+d.A*Math.sin(q*6.2+d.ph+t*d.v1*d.sp);
      var z=d.B*Math.sin(q*3.4+d.ph*1.7+t*d.v2*d.sp);
      var w=Math.sin(Math.PI*q)*d.W*(.75+.45*Math.sin(q*7.3+t*1.4+d.ph));
      var o=i*3, o2=(i+RUB.N+1)*3;
      A[o]=x; A[o+1]=y+w; A[o+2]=z;
      A[o2]=x; A[o2+1]=y-w; A[o2+2]=z;
    }
    pos.needsUpdate=true;
  }
}

/* Une étoile filante : un trait qui s'allume, file, et s'éteint. Un trait
   et non un point — c'est la traîne qui se voit, l'étoile elle-même est
   trop petite pour exister à l'écran. */
var FIL=(function(){
  var t=canvasTex(128,16,function(g,w,h){
    var gr=g.createLinearGradient(0,0,w,0);
    gr.addColorStop(0,"rgba(255,255,255,0)"); gr.addColorStop(.72,"rgba(255,250,235,.55)");
    gr.addColorStop(.96,"rgba(255,255,255,1)"); gr.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=gr; g.fillRect(0,0,w,h);
    var r=g.createRadialGradient(w*.96,h/2,0,w*.96,h/2,h*.6);
    r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(1,"rgba(255,255,255,0)");
    g.fillStyle=r; g.fillRect(w*.86,0,w*.14,h);
  });
  var m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
    new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,fog:false,
      blending:THREE.AdditiveBlending,opacity:0}));
  m.visible=false; scene.add(m);
  return {m:m,t:-99,duree:1.35,p0:new THREE.Vector3(),p1:new THREE.Vector3(),lg:9};
})();
function filantePasser(){
  if(clock-FIL.t<FIL.duree+.5) return;
  FIL.t=clock;
  /* Elle traverse le fond de l'image, c'est-à-dire l'azimut opposé à la
     caméra ; elle part haut et finit plus bas, comme on en voit : une
     diagonale, et non une chute verticale. */
  var a=cam.th+Math.PI+(R()-.5)*1.1, D=46;
  /* Sa hauteur se mesure depuis l'œil, et non depuis l'île : la caméra
     regarde l'arbre d'un peu au-dessus, et le ciel qu'on voit à l'écran
     n'est qu'une bande de huit degrés au-dessus de l'horizontale. Posée
     à trente unités de haut, l'étoile filait hors du cadre. */
  var cy=camera.position.y;
  FIL.p0.set(Math.sin(a)*D,cy+5+R()*2.5,Math.cos(a)*D);
  var b=a+(R()<.5?-1:1)*(.45+R()*.4);
  FIL.p1.set(Math.sin(b)*D,cy+.6+R()*1.6,Math.cos(b)*D);
  FIL.lg=11+R()*8;
  FIL.m.visible=true;
}
function filanteMaj(t){
  if(!FIL.m.visible) return;
  var u=(t-FIL.t)/FIL.duree;
  if(u>1||u<0){ FIL.m.visible=false; FIL.m.material.opacity=0; return; }
  var e=u*u*(3-2*u);
  FIL.m.position.lerpVectors(FIL.p0,FIL.p1,e);
  FIL.m.lookAt(camera.position);
  /* Le trait se couche sur sa trajectoire : on tourne le plan autour de
     l'axe qui regarde la caméra, de l'angle que fait la course à l'écran. */
  var v0=FIL.p0.clone().project(camera), v1=FIL.p1.clone().project(camera);
  FIL.m.rotateZ(Math.atan2(v1.y-v0.y,(v1.x-v0.x)*camera.aspect));
  FIL.m.scale.set(FIL.lg,FIL.lg*.055,1);
  FIL.m.material.opacity=Math.sin(Math.PI*Math.min(1,u*1.15))*.9*SUN.nuit;
}
/* Le ciel vit de lui-même, mais sans insister : un passage toutes les
   quarante secondes environ, et jamais les deux à la fois. */
var cielProchain=16+R()*18;
function surprisesMaj(t,dt){
  voluteMaj(t); filanteMaj(t);
  if(t<cielProchain) return;
  cielProchain=t+(CINE.on?16+R()*12:26+R()*20);
  /* La nuit appartient d'abord aux étoiles filantes, mais pas tout à fait :
     une volute de temps en temps rappelle qu'il y a de l'air là-haut. */
  if(SUN.nuit>.5&&R()<.65) filantePasser(); else volutePasser();
}

/* ------------------------------------------------------------------ la visite guidée
   Un bouton, et l'arbre se montre tout seul : il tourne, s'approche d'un
   vœu, le laisse lire, repart, en choisit un autre, puis lâche ses feuilles
   au vent et les laisse repousser. Puis il recommence, dans un ordre tiré au
   sort à chaque fois — ce n'est pas une bande-annonce, c'est une veilleuse.

   Le premier geste du visiteur reprend la main : on ne lutte jamais contre
   quelqu'un qui veut tourner l'arbre lui-même. */
var CINE={on:false,prochain:0,etape:0,ronde:true,vit:.115,deriv:0,zoom:0};
function cineStart(){
  if(CINE.on||!entered) return;
  /* L'étape part de moins un : la première qu'on exécute est donc la ronde
     large, et non l'approche d'un vœu. Partie de zéro, la visite se collait
     à une étiquette dès la première image et ne tournait jamais. */
  CINE.on=true; CINE.etape=-1; CINE.prochain=0; CINE.ronde=true; CINE.vit=.115;
  ouvre=0; barreVoeu();
  closeCard(true); window.__home();
}
function cineStop(muet){
  if(!CINE.on) return;
  CINE.on=false; barreVoeu();
  if(!muet) closeCard(true);
}
/* Les plans. Chacun pose la caméra, dit à quelle vitesse l'arbre tourne, et
   combien de temps il tient. Ils s'enchaînent dans un ordre fixe mais se
   tirent au sort à l'intérieur — deux tours ne se ressemblent jamais tout
   à fait.

   Ce qu'on regarde, dans cet arbre, ce sont les mots : six plans sur neuf
   sont donc des vœux, et l'on y dérive lentement au lieu de s'y arrêter —
   la profondeur de champ et les étiquettes qui passent valent mieux qu'un
   plan fixe. Le dézoom revient de loin en loin, pour rappeler où l'on est. */
function cineLarge(){ closeCard(true); window.__home(); CINE.ronde=true;
  goal.ph=PH_HOME+(R()-.5)*.26; goal.r=homeR*(.9+R()*.4); CINE.vit=.08+R()*.05; return 6.2; }
/* Vu de haut : l'île devient un radeau, et l'on voit la couronne entière. */
function cinePlongee(){ closeCard(true); window.__home(); CINE.ronde=true;
  goal.ph=.62+R()*.18; goal.r=homeR*(.6+R()*.2); goal.tg.y=homeY+.9; CINE.vit=.17+R()*.06; return 5.0; }
/* Vu d'en bas : on remonte le tronc, les étiquettes passent au-dessus, et
   le ciel ferme l'image. C'est le plan qui donne sa taille à l'arbre. */
function cineContre(){ closeCard(true); window.__home(); CINE.ronde=true;
  goal.ph=1.78; goal.r=homeR*(.5+R()*.14); goal.tg.y=homeY+1.3; CINE.vit=.13+R()*.05; return 5.0; }
/* Le vent. On recule d'abord : la bourrasque ne se voit pas le nez sur une
   étiquette. Et le ciel s'en mêle — un vol d'oiseaux le jour, une étoile
   filante la nuit. */
function cineVent(){ closeCard(true); window.__home(); CINE.ronde=true;
  goal.ph=PH_HOME-.12; goal.r=homeR*1.1; CINE.vit=.07;
  secouer(); if(SUN.nuit>.5) filantePasser(); else volutePasser();
  /* On ne reste pas seize secondes sur le même plan : le vent souffle, les
     feuilles s'en vont, et la visite repart vers un vœu pendant que
     l'arbre se remplit derrière. */
  return 9.4; }
/* Un vœu. Le premier de la visite est celui de Yunma — c'est la maison qui
   accueille —, puis on va de proche en proche : le suivant est tiré parmi
   les plus proches voisins de celui qu'on quitte, et non au hasard dans
   tout l'arbre. On traverse ainsi la ramure au lieu de sauter d'un bord à
   l'autre, et c'est ce trajet qui fait le charme. */
function cineVoeu(){
  var ids=Object.keys(tags); if(!ids.length) return 0;
  var t=null;
  /* Rien en vue encore : on commence par le vœu de Yunma. Sinon on part de
     celui qu'on regarde — un vœu reçu par un lien, ou celui où le visiteur
     a laissé la caméra. */
  if(!vise&&tags.yunma) t=tags.yunma;
  else if(vise){
    var p=vise.slot.pos, pres=[];
    ids.forEach(function(id){ var g=tags[id]; if(g===vise) return;
      var q=g.slot.pos;
      pres.push({g:g,d:(q[0]-p[0])*(q[0]-p[0])+(q[1]-p[1])*(q[1]-p[1])*1.6+(q[2]-p[2])*(q[2]-p[2])}); });
    pres.sort(function(a,b){ return a.d-b.d; });
    var n=Math.min(6,pres.length); if(n) t=pres[Math.floor(R()*n)].g;
  }
  if(!t) t=tags[ids[Math.floor(R()*ids.length)]];
  if(!t) return 0;
  CINE.ronde=false; focusTag(t,false);
  /* La dérive : la caméra tourne autour du mot et respire un peu, le temps
     qu'on le lise. Immobile, le plan est une photographie ; ici, c'est un
     mouvement d'appareil. */
  CINE.deriv=(R()<.5?-1:1)*(.035+R()*.045); CINE.zoom=(R()<.5?-1:1)*(.04+R()*.05);
  return 6.0;
}
function cineMaj(dt){
  if(!CINE.on) return;
  /* La ronde : lente, et seulement quand on ne regarde pas un vœu de près. */
  if(CINE.ronde){ goal.th+=dt*CINE.vit; idle=0; }
  else if(vise&&focused){ goal.th+=dt*CINE.deriv; goal.r=clamp(goal.r+dt*CINE.zoom,2.1,4.6); idle=0; }
  if(clock<CINE.prochain) return;
  CINE.etape++;
  var e=CINE.etape%9, d=0;
  if(e!==0&&e!==4&&e!==7) d=cineVoeu();
  if(!d){
    if(e===4) d=(CINE.etape%18<9)?cinePlongee():cineContre();
    else if(e===7) d=cineVent();
    else d=cineLarge();
  }
  CINE.prochain=clock+d;
}

/* ------------------------------------------------------------------ la langue
   Trois lettres en haut à droite, et c'est tout ce qui reste à choisir. */
Array.prototype.forEach.call(document.querySelectorAll("#langs button"),function(b){
  b.onclick=function(){ if(!AC) startAudio(); setLang(b.getAttribute("data-l")); }; });

/* Le gyroscope et le souffle ont tous deux été retirés. Incliner le
   téléphone déplaçait un peu le regard : joli sur le papier, invisible à
   l'usage. Souffler dans le micro faisait voler les feuilles : joli aussi,
   mais cela demandait une autorisation que personne n'accorde à un arbre,
   et l'on ne pouvait ni l'essayer ni le régler sans déposer la page. Le
   menu porte « faire voler les feuilles », qui marche partout et sans rien
   demander. */
/* Une poignée pour les épreuves : se placer à une heure, viser un vœu,
   lire l'état du ciel. Rien d'autre ne passe par là. */
window.__essai={
  heure:function(h){ CIEL.poser(h); sunMaj(); themeMaj(); },
  ciel:function(){ return {h:CIEL.heure(),nuit:SUN.nuit,jour:SUN.jour,theme:theme,bas:SUN.ciel.bas.slice()}; },
  voeux:function(){ return Object.keys(tags).length; },
  fentes:function(){ return slots.length; },
  /* La musique : l'air en cours, et la note programmée la plus lointaine. */
  musique:function(v){ if(v!==undefined&&v!==NOEL.on) noelBasculer();
    return {on:NOEL.on,air:NOEL.air,note:NOEL.i,airs:AIRS.length,
      noms:AIRS.map(function(a){return a.nom;}),
      avance:AC?+(NOEL.quand-AC.currentTime).toFixed(2):-1}; },
  /* Pour l'épreuve : vieillir l'inactivité d'un coup. La visite guidée
     revient au bout de dix secondes sans geste, et dix secondes d'horloge
     de scène font deux minutes de mur sous un rendu logiciel. */
  inactif:function(v){ idle=v===undefined?12:v; return idle; },
  /* Les habitants du ciel. */
  ciel2:function(){ return {volutes:RUB.grp.visible,filante:FIL.m.visible,
    opacite:+FIL.m.material.opacity.toFixed(2),voile:+RUB.mat.opacity.toFixed(2),
    y:+RUB.grp.position.y.toFixed(1),prochain:+(cielProchain-clock).toFixed(1)}; },
  /* Le vœu de Yunma, et l'ouverture qui se pose dessus. */
  yunma:function(){ return {texte:wishText(YUNMA), premier:wishes[0].id==="yunma",
    place:Object.keys(tags).indexOf("yunma"), accroche:!!tags.yunma}; },
  accueil:function(){ return {fait:ouvreFait, recul:ouvre>0, vise:focused}; },
  volutes:function(){ volutePasser(); return RUB.grp.visible; },
  ois:function(){ var v=RUB.grp.position.clone().project(camera);
    return {vis:RUB.grp.visible,u:+((clock-RUB.t)/RUB.duree).toFixed(2),
      op:+RUB.mat.opacity.toFixed(2),
      ndc:[+v.x.toFixed(2),+v.y.toFixed(2),+v.z.toFixed(3)],
      d:+RUB.grp.position.distanceTo(camera.position).toFixed(1)}; },
  filante:function(){ filantePasser(); return FIL.m.visible; },
  fil:function(){ var v=FIL.m.position.clone().project(camera);
    return {vis:FIL.m.visible,u:+((clock-FIL.t)/FIL.duree).toFixed(2),op:+FIL.m.material.opacity.toFixed(2),
      ndc:[+v.x.toFixed(2),+v.y.toFixed(2),+v.z.toFixed(3)],lg:+FIL.lg.toFixed(1)}; },
  /* La fiche est-elle ouverte ? Toucher un vœu ne doit plus l'ouvrir. */
  fiche:function(){ return !!cardWish; },
  /* Le cadrage d'accueil, en coordonnées d'écran : −1 en bas, +1 en haut.
     Ce qui compte est que l'île entière tienne au-dessus de l'appel. */
  cadrage:function(){ var h=new THREE.Vector3(0,CHAUT,0).project(camera), b=new THREE.Vector3(0,CBAS,0).project(camera);
    return {haut:Math.round(h.y*1000)/1000, bas:Math.round(b.y*1000)/1000,
      barre:Math.round((bandeBas()/window.innerHeight*2-1)*1000)/1000}; },
  viser:function(i,fiche,garder){ var k=Object.keys(tags); if(k[i]!==undefined) focusTag(tags[k[i]],!!fiche,!!garder); return k.length; },
  langues:function(){ return Array.prototype.map.call(document.querySelectorAll("#langs button"),
    function(b){ return b.getAttribute("data-l")+(b.classList.contains("on")?"*":""); }).join(","); },
  maison:function(){ window.__home(); },
  /* Arriver tout de suite où la caméra se rend : l'amorti demande des
     dizaines d'images, et l'épreuve n'en dessine qu'une poignée. */

  for(i=0;i<mists.length;i++){ var ms=mists[i]; ms.userData.a+=ms.userData.sp*dt; ms.position.x=Math.cos(ms.userData.a)*ms.userData.r; ms.position.z=Math.sin(ms.userData.a)*ms.userData.r; }
  if(post){
    var close=clamp((9-cam.r)/7,0,1), u2=postMat.uniforms;
    /* Pendant la visite, on ouvre le diaphragme : le flou n'est plus un
       détail de confort, c'est ce qui fait regarder au bon endroit. */
    u2.uFocus.value=Math.max(cam.r,1); u2.uAperture.value=5.5+close*9+(CINE.on?4:0); u2.uTime.value=t%10;
    renderer.setRenderTarget(rt); renderer.render(scene,camera); renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  } else renderer.render(scene,camera);
}
mergeWishes();
requestAnimationFrame(frame);
})();
</script>
