  /* couches : lointaine → proche */
  const specs=[
    {top:.30,amp:.30,hk:[[2,1],[3,.6],[7,.25]],base:[239,235,226],lit:[245,242,236],shd:[222,215,202],k:.7,seed:3},
    {top:.40,amp:.34,hk:[[3,1],[5,.5],[9,.2]],base:[232,227,216],lit:[245,241,233],shd:[214,205,189],k:.95,seed:7},
    {top:.52,amp:.30,hk:[[2,1],[4,.7],[11,.18]],base:[229,222,209],lit:[244,240,231],shd:[205,194,176],k:1.15,seed:11},
    {top:.66,amp:.26,hk:[[3,1],[6,.55],[13,.15]],base:[226,218,204],lit:[243,238,228],shd:[198,186,166],k:1.3,seed:17}];
  specs.forEach((sp,li)=>{
    let sd=sp.seed;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;const ph=sp.hk.map(()=>r()*Math.PI*2);
    const prof=new Float32Array(LW);let mn=1e9,mx=-1e9;
    for(let x=0;x<LW;x++){let h=0;sp.hk.forEach(([k,a],j)=>h+=a*Math.sin(2*Math.PI*k*x/LW+ph[j]));prof[x]=h;mn=Math.min(mn,h);mx=Math.max(mx,h)}

    for(let x=0;x<LW;x++){

        const depth=y-top;let al=Math.max(0,Math.min(1,depth+1));if(al<=0)continue;

/* =====================================================================
   LE CIEL — une journée entière, à l’heure du visiteur
   =====================================================================
   Le soleil tournait en rond sans jamais se coucher. Il fait maintenant le
   tour de l’horloge : la nuit bleu presque noir, l’aube rose, le plein jour
   blanc, le couchant pourpre. On arrive à l’heure qu’il est vraiment chez
   soi — si vous ouvrez l’atlas à vingt-trois heures, il fait nuit — et le
   temps passe ensuite vingt-quatre fois plus vite qu’une horloge normale,
   ce qui fait une journée en dix minutes.

   Tout en découle : la couleur du ciel, celle de la lumière, celle des
   ombres, et jusqu’à l’encre de l’interface — un texte anthracite sur un

     douze fois l'horloge : on reste dans la demi-journée où l'on est

    ctx.font=`${fw} ${fs}px ${FONT}`;
    const txt=n.n;const w=ctx.measureText(txt).width;const x=o.sx+o.pr+11,y=o.sy+fs*.35;
    const two=S.sel===n||S.hover===n||S.hl===n;const fs2=Math.round(8.5*Math.min(1.4,k));const three=false;
    const dl=n.yl.length>30?n.yl.slice(0,29)+'…':n.yl;let bw=w;if(two){ctx.font=`400 ${fs2}px ${FONT}`;bw=Math.max(bw,ctx.measureText(dl.toUpperCase()).width+4);if(three)bw=Math.max(bw,fs2*15);ctx.font=`${fw} ${fs}px ${FONT}`}
    /* Le rectangle sert à la fois de garde contre le chevauchement et de
       cartouche : les deux coïncident, donc deux plaques ne se marchent
       jamais dessus. */
    const r=[x-6,y-fs*.98,x+bw+6,y+5+(two?fs2+4:0)];
    /* Un filet coupé par le bord de l'écran ne se voyait pas ; une plaque
       coupée en deux, si. On laisse donc tomber l'étiquette qui ne tient
       pas entière — son point reste visible, et le nom revient dès qu'on
       tourne un peu. */
    if(r[0]<3||r[2]>W-3)return;
    if(rects.some(q=>!(r[2]<q[0]||r[0]>q[2]||r[3]<q[1]||r[1]>q[3])))return;rects.push(r);
    const la=Math.min(1,o.a*1.15);ctx.textAlign='left';
    /* Un petit cartouche plutôt qu'un filet. Le nom était cerné d'un trait
       de papier de quatre pixels : efficace pour se détacher du paysage,
       mais un contour épaissit les lettres et les empâte, et à l'aube il
       prenait la teinte du ciel. Une plaque de papier posée derrière,
       légèrement arrondie et bordée d'un cheveu d'encre, donne au nom la

/* Un rectangle aux coins arrondis, sans dépendre de roundRect : Safari ne

function plaque(x0,y0,x1,y1,r){

  ctx.lineTo(x1,y1-r);ctx.quadraticCurveTo(x1,y1,x1-r,y1);
  ctx.lineTo(x0+r,y1);ctx.quadraticCurveTo(x0,y1,x0,y1-r);
  ctx.lineTo(x0,y0+r);ctx.quadraticCurveTo(x0,y0,x0+r,y0);

  if(e.b.y<=yr){ctx.strokeStyle=rgba(col,(hl?.95:.5)*fa*f);strokePts(e.pts,0,20,e.w)}
  else{ctx.strokeStyle=rgba(col,.05*fa);strokePts(e.pts,0,20,e.w);
    if(e.a.y<=yr){const cw=wy(yr);const fr=Math.max(0,Math.min(1,(cw-e.a.wy)/((e.b.wy-e.a.wy)||1)));const k=Math.floor(fr*20);

/* =====================================================================
   SURVOL DES TERROIRS
   =====================================================================
   La page « Terroirs » montrait un nuage de bulles en latitude et longitude,
   sous une planche empruntée à la page voisine. Les sept terroirs sont
   maintenant posés sur le relief, à leurs vraies coordonnées, et l'on vole
   de l'un à l'autre. Le décor ne change pas : ce sont les mêmes montagnes
   que sous l'arbre, puisque ce sont les vraies.

   L'arbre s'efface pendant le survol — il n'a rien à faire au-dessus d'une
   carte — et le cartouche reprend celui du récit, aux mêmes gestes près. */
const TERR={on:false,i:0,sols:null};
function terrSol(r){return (TERR.sols||(TERR.sols=new Map())).get(r.id)
  ??(TERR.sols.set(r.id,GL3.ok?GL3.sol(r.lon,r.lat):[0,0,0]).get(r.id))}
function terrLots(r){return LOTS.filter(l=>l[4]===r.id)}
function terrTexte(r){
  const ls=terrLots(r);
  const n=ls.length?(ls.length>1?U('tLots').replace('{n}',ls.length):U('tLot')):U('tNoLot');
  if(!ls.length)return n;
  const b=ls.slice().sort((a,c)=>a[0]-c[0])[0];
  const alts=ls.flatMap(l=>[l[8],l[9]]);
  const loc=LANG==='fr'?'fr-FR':'en-US';
  /* L'espace avant « m » est insécable : sans elle, l'unité tombe seule sur
     la ligne suivante dès que le cartouche est étroit. */
  const bande=`${Math.min(...alts).toLocaleString(loc)} – ${Math.max(...alts).toLocaleString(loc)}\u00a0m`;
  /* La ponctuation n'est pas la même d'une langue à l'autre : le français
     met une espace avant les deux-points, le chinois a les siens, et « n° »
     ne se dit pas en anglais. */
  const sep=LANG==='fr'?' : ':LANG==='zh'?'：':': ';
  const vir=LANG==='zh'?'，':', ';
  const rang=LANG==='zh'?`第${b[0]}名`:LANG==='en'?`#${b[0]}`:`n°${b[0]}`;
  const note=b[1].toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${n} · ${bande}<br>${U('tBest')}${sep}${rang} · ${TL(b[6])} · ${b[7]} — ${TL(b[3])}${vir}${note}`;
}
function terrAllerA(i,doux){
  const r=REGIONS[TERR.i=(i+REGIONS.length)%REGIONS.length];
  const [x,y,z]=terrSol(r);
  /* On se place haut : les sommets montent à près de 30 000 unités du décor,
     et une caméra posée à hauteur de vallée traverserait la montagne au lieu
     de la survoler. De là, on embrasse une soixantaine de kilomètres. */
  /* On vise le terroir lui-même — il doit tomber au centre — et c'est
     l'inclinaison qui met la caméra au-dessus des crêtes : les sommets du
     nord montent à près de 30 000 unités du décor, une caméra posée à
     hauteur de vallée traverserait la montagne au lieu de la survoler. */
  tgt.tx=x;tgt.tz=z;tgt.ty=y;
  tgt.dist=mobile()?69000:60000;tgt.pitch=.78;
  /* On arrive toujours par le sud-ouest : la lumière vient de là, et les
     versants se lisent. */
  tgt.yaw=nearestYaw(-.7);
  const el=document.getElementById('terr');
  el.querySelector('#tkick').innerHTML=`<span class="dot" style="background:var(--verm)"></span>${U('tOf').replace('{i}',TERR.i+1).replace('{n}',REGIONS.length)}`;
  el.querySelector('#ttitle').innerHTML=`${r.n} <small style="color:var(--mute);font-size:.72em">${r.zh}</small>`;
  el.querySelector('#ttext').innerHTML=terrTexte(r);
  el.querySelector('.sin').classList.remove('swap');void el.offsetWidth;el.querySelector('.sin').classList.add('swap');
  /* Le son est celui du bouton — suivant ou précédent — et non un pas
     unique : voir la table des voix, plus bas. */
}
function terrStart(i){
  if(!GL3.ok)return openPage('terroirs');
  closePage();deselect();if(ST.on)storyEnd();
  TERR.on=true;TERR.sols=null;document.body.classList.add('terring');
  const el=document.getElementById('terr');el.hidden=false;
  majBoutonsTerr();
  el.querySelector('#tprev').innerHTML=IC.prev;el.querySelector('#tnext').innerHTML=IC.next;
  requestAnimationFrame(()=>el.classList.add('on'));

}
/* Les deux boutons du cartouche : une icône et une étiquette lue par les
   lecteurs d'écran, jamais un mot qui pourrait déborder. */
function majBoutonsTerr(){const el=document.getElementById('terr');
  for(const [id,ic,cle] of [['tcard',IC.fiche,'tCard'],['tquit',IC.close,'tQuit']]){
    const b=el.querySelector('#'+id);b.innerHTML=ic;b.title=U(cle);b.setAttribute('aria-label',U(cle))}}
function terrStop(fromHash,muet){

/* Les sept repères, posés sur le relief et projetés comme le reste. */
function drawTerroirs(){
  const pts=REGIONS.map((r,i)=>({r,i,p:proj(...terrSol(r))})).filter(o=>o.p[3]>40).sort((a,b)=>b.p[3]-a.p[3]);
  for(const {r,i,p} of pts){
    const on=i===TERR.i;
    const lots=terrLots(r).length;
    /* La taille dit le nombre de lots classés ; elle ne suit la distance
       que d'un quart, sinon les terroirs lointains deviennent des poussières
       alors qu'ils sont justement ce qu'on vient voir. */
    const ech=.75+.25*Math.min(2.4,p[2]/NEAR0());
    const base=Math.max(5,(7+lots*1.5)*ech);
    const a=Math.max(.6,Math.min(1,fog(p[3])+.3));
    /* Un rayon négatif ne dessine rien et lève une exception qui arrête la
       trame entière : on borne, plutôt que de faire confiance au calcul. */
    const ray=(v)=>Math.max(.1,v);
    if(on){const ph=(S.t*.55)%1;ctx.strokeStyle=rgba(VRGB,(1-ph)*.5*a);ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(p[0],p[1],ray(base+2+ph*42),0,7);ctx.stroke()}
    ctx.fillStyle=rgba(VRGBF,(on?.92:.42)*a);ctx.beginPath();ctx.arc(p[0],p[1],ray(base),0,7);ctx.fill();
    ctx.strokeStyle=rgba(IRGB,(on?.5:.18)*a);ctx.lineWidth=1;ctx.beginPath();ctx.arc(p[0],p[1],ray(base),0,7);ctx.stroke();
    if(lots){ctx.fillStyle=rgba([251,250,247],.96*a);ctx.font=`500 ${Math.max(9,Math.min(15,base))}px ${getComputedStyle(document.documentElement).getPropertyValue('--font')}`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(lots),p[0],p[1]+.5)}
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.font=`${on?500:400} ${on?17:14}px ${getComputedStyle(document.documentElement).getPropertyValue('--font')}`;
    ctx.lineJoin='round';ctx.lineWidth=on?4:3.4;ctx.strokeStyle=rgba(PRGB,.86*a);ctx.strokeText(r.n,p[0]+base+8,p[1]+5);
    ctx.fillStyle=rgba(IRGB,(on?1:.86)*a);
    ctx.fillText(r.n,p[0]+base+8,p[1]+5);
  }
}

/* =====================================================================
   BOUCLE
   ===================================================================== */
/* La caméra ne passe pas sous les montagnes. En la laissant descendre, on
   finissait par regarder le relief par en dessous : une coque creuse, sans
   épaisseur ni lumière, et l'illusion tombe d'un coup. On calcule donc où
   se trouve l'œil — cible, distance, lacet et tangage le donnent —, on lit
   la hauteur du sol juste sous lui, et l'on relève le regard juste assez
   pour garder une centaine de mètres au-dessus. Le minimum se recalcule à
   chaque image, puisqu'il dépend de l'endroit : le sol monte et descend. */
const GARDE=900;                      /* ≈ 100 m dans les unités du décor */
function resterAuDessus(){
  if(!GL3.ok||!GL3.solXZ)return;
  const cp=Math.cos(cam.pitch);
  const ex=cam.tx+cam.dist*cp*Math.sin(cam.yaw),ez=cam.tz+cam.dist*cp*Math.cos(cam.yaw);
  const ey=cam.ty+cam.dist*Math.sin(cam.pitch);
  let sol;try{sol=GL3.solXZ(ex,ez)}catch(e){return}
  if(ey>=sol+GARDE)return;
  /* Le tangage qu'il faudrait pour que l'œil affleure la garde. S'il en
     faut plus que le maximum, on prend le maximum : c'est que la cible
     elle-même est enterrée, et aucun angle n'y changera rien. */
  const pmin=Math.min(1.25,Math.asin(Math.max(-1,Math.min(1,(sol+GARDE-cam.ty)/Math.max(1,cam.dist)))));
  if(pmin>cam.pitch)cam.pitch=pmin;
  if(pmin>tgt.pitch)tgt.pitch=pmin;
}
let last=performance.now(),dernierReveil=0;
function loop(t){
  /* Le pas était borné à cinquante millisecondes : sur une machine qui
     rend à dix images par seconde, la caméra n'avançait plus qu'à moitié
     de sa vitesse. Cent millisecondes laissent les mouvements à la bonne
     durée sans ouvrir la porte aux sauts. */
  const dt=Math.min(.1,(t-last)/1000);last=t;S.t+=dt;
  if(S.playing){const u=y2u(S.year)+dt/10;S.year=Math.min(2026,u2y(u));if(S.year>=2026){S.playing=false;if(S.intro){S.intro=false;goHome();ctaPulse()}}
    if(S.playing)tgt.ty=Math.max(-2300,Math.min(2400,wy(S.year)-500));syncTime()}
  storyTick(dt);
  if(S.rotate&&!S.sel&&!ST.on&&t-lastInteract>3500&&!drag)tgt.yaw+=dt*.06;
  const k=1-Math.pow(ST.on||TERR.on?.02:.0009,dt);for(const key in cam)cam[key]+=(tgt[key]-cam[key])*k;
  resterAuDessus();
  S.dash=(S.dash+dt*16)%1000;
  /* Le ciel se posait depuis le dessin de l'arbre, et le dessin s'arrête
     dès qu'une page est ouverte. On lisait donc la chronologie sous un
     ciel figé, et en refermant la page le jour sautait d'un coup à la
     nuit — le bug de l'aube qui tournait en nuit « quelques secondes
     après ». L'heure, elle, n'avait jamais cessé d'avancer : c'est le
     ciel qui ne la suivait plus. Il se pose maintenant à chaque image,
     page ouverte ou non, pour que l'encre et le papier d'une page
     suivent eux aussi le jour qui passe. */
  sunUpdate(S.t);
  /* Le second gardien du son, celui qui ne dépend d'aucun minuteur. */
  if(t-dernierReveil>1000){dernierReveil=t;AUD.reveil()}
  if(!pageOpen)draw();requestAnimationFrame(loop)
}

/* =====================================================================

   ===================================================================== */
const ptrs=new Map();let drag=false,moved=0,pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;drag=true;cv.classList.add('drag');touch()});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)){const p=ptrs.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);tgt.yaw-=dx*.0065;tgt.pitch=Math.max(-.15,Math.min(1.25,tgt.pitch+dy*.0045));cam.yaw=tgt.yaw;cam.pitch=tgt.pitch}
    else if(ptrs.size===2){moved+=99;const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){tgt.dist=Math.max(MIND,Math.min(MAXD,tgt.dist*pinch/d))}pinch=d;tgt.ty=Math.max(-4500,Math.min(4500,tgt.ty+dy*.85))}
    hideTip();return}
  if(e.pointerType==='mouse'){const h=hit(e.clientX,e.clientY);const nh=h&&h.n?h.n:null;if(nh&&nh!==S.hover)AUD.fx('hover');S.hover=nh;cv.style.cursor=h?'pointer':'grab';h?showTip(h,e.clientX,e.clientY):hideTip()}
});
function endPtr(e){if(!ptrs.has(e.pointerId))return;const single=ptrs.size===1;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;if(!ptrs.size){drag=false;cv.classList.remove('drag')}
  if(single&&moved<7){const h=hit(e.clientX,e.clientY);if(h&&h.n)select(h.n);else if(h&&h.ev)selectEvent(h.ev);else if(S.sel||S.selEv)deselect()}}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{S.hover=null;hideTip()});
cv.addEventListener('wheel',e=>{e.preventDefault();touch();if(e.shiftKey){tgt.ty=Math.max(-4500,Math.min(4500,tgt.ty-e.deltaY*1.1))}else{tgt.dist=Math.max(MIND,Math.min(MAXD,tgt.dist*Math.exp(e.deltaY*.0012)))}},{passive:false});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){if(menuOpen)closeMenu();else if(pageOpen)closePage();else if(TERR.on)terrStop();else if(ST.on)storyEnd(false);else deselect()}
  if(pageOpen||menuOpen)return;
  if(e.key===' '){e.preventDefault();ST.on?storyPause(!ST.paused):storyStart(0)}
  if(e.key==='ArrowUp')tgt.ty=Math.min(4500,tgt.ty+180);if(e.key==='ArrowDown')tgt.ty=Math.max(-4500,tgt.ty-180);if(e.key==='ArrowLeft')tgt.yaw+=.25;if(e.key==='ArrowRight')tgt.yaw-=.25;
  if(e.key==='+'||e.key==='=')tgt.dist=Math.max(MIND,tgt.dist*.8);if(e.key==='-')tgt.dist=Math.min(MAXD,tgt.dist*1.25)});
function touch(){lastInteract=performance.now();if(S.intro){S.intro=false;S.playing=false;S.year=2026;syncTime()}document.getElementById('hint').style.opacity=0}
function hit(x,y){let best=null,bd=1e9;
  for(const o of SCREEN){if(o.a<.1)continue;const d=Math.hypot(o.sx-x,o.sy-y);if(d<Math.max(16,o.pr+8)&&d<bd){bd=d;best={n:o.n}}}
  if(!best)for(const ev of EVENTS){if(ev.y>S.year||ev._sx==null)continue;const d=Math.hypot(ev._sx-x,ev._sy-y);if(d<13&&d<bd){bd=d;best={ev}}}
  return best}
const tip=document.getElementById('tip');
function showTip(h,x,y){const t=h.n?`${h.n.n}${h.n.alt?' · '+h.n.alt:''}<small>${h.n.yl}</small>`:`${h.ev.t}<small>${h.ev.y} · Yunnan</small>`;tip.innerHTML=t;tip.style.left=Math.min(W-250,x+14)+'px';tip.style.top=(y+14)+'px';tip.classList.add('show')}
function hideTip(){tip.classList.remove('show')}
function nearestYaw(target){let t=target;while(t-tgt.yaw>Math.PI)t-=2*Math.PI;while(t-tgt.yaw<-Math.PI)t+=2*Math.PI;return t}
function goHome(){const h=HOME();tgt.tx=0;tgt.tz=0;tgt.ty=h.ty;tgt.dist=h.dist;tgt.pitch=h.pitch;tgt.ox=0;tgt.oy=0}

/* =====================================================================

const peekEl=document.getElementById('peek');
/* Le cartouche et le récit flottent au-dessus du dock, dont la hauteur change
   selon l'écran et le moment : le bouton de l'histoire prend une ligne entière
   sur téléphone, la barre du temps disparaît pendant le récit, une langue
   allonge un mot. Une valeur en dur finit toujours par se tromper — et quand
   elle se trompe, deux boutons se touchent sans que rien ne le signale. On
   mesure donc le dock, et la feuille s'en sert. */
const dockEl=document.getElementById('dock');
const mesurerDock=()=>{
  const r=dockEl.getBoundingClientRect();
  /* Socle masqué — pendant le survol : sa boîte est nulle, et mesurer le
     vide donnerait la hauteur de l'écran entier. */
  if(!dockEl.getClientRects().length||getComputedStyle(dockEl).display==='none'){
    document.documentElement.style.setProperty('--dockh','0px');return}
  /* La ligne la plus haute du socle qui porte quelque chose. */
  let haut=r.bottom;
  for(const el of dockEl.children){
    if(!el.getClientRects().length)continue;
    const cs=getComputedStyle(el);
    if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity)<.02)continue;
    haut=Math.min(haut,el.getBoundingClientRect().top);
  }
  const h=Math.max(0,Math.round(innerHeight-haut));
  document.documentElement.style.setProperty('--dockh',h+'px');
};
if(window.ResizeObserver)new ResizeObserver(mesurerDock).observe(dockEl);
addEventListener('resize',mesurerDock);addEventListener('orientationchange',()=>setTimeout(mesurerDock,120));mesurerDock();
/* Cartouche ouvert : sur téléphone le bouton du récit s'efface. Il tenait une

const peeking=(v)=>{document.body.classList.toggle('peeking',v);mesurerDock()};

function mapSVG(){
  const L0=97.8,L1=103.2,A0=21.3,A1=26.5,X=l=>20+(l-L0)/(L1-L0)*360,Y=a=>300-(a-A0)/(A1-A0)*280;
  let s=`<svg class="map" font-family='${FONT}' viewBox="0 0 400 320" role="img" aria-label="${U('tTitle')}">`;
  for(let l=98;l<=103;l++)s+=`<line x1="${X(l)}" y1="${Y(A0)}" x2="${X(l)}" y2="${Y(A1)}" stroke="rgba(var(--encre),.10)"/><text x="${X(l)}" y="312" fill="var(--dim)" font-size="8" text-anchor="middle">${l}°E</text>`;
  for(let a=22;a<=26;a++)s+=`<line x1="${X(L0)}" y1="${Y(a)}" x2="${X(L1)}" y2="${Y(a)}" stroke="rgba(var(--encre),.10)"/><text x="6" y="${Y(a)+3}" fill="var(--dim)" font-size="8">${a}°</text>`;
  s+=`<line x1="${X(L0)}" y1="${Y(23.44)}" x2="${X(L1)}" y2="${Y(23.44)}" stroke="var(--verm)" stroke-opacity=".5" stroke-dasharray="3 4"/><text x="${X(L1)-2}" y="${Y(23.44)-5}" fill="var(--verm-txt)" font-size="7.5" letter-spacing="1" font-weight="600" text-anchor="end">${U('tropic')}</text>`;
  s+=`<circle cx="${X(102.71)}" cy="${Y(25.04)}" r="3" fill="none" stroke="var(--mute)"/><text x="${X(102.71)}" y="${Y(25.04)-8}" fill="var(--mute)" font-size="9" text-anchor="middle">${U('kunming')}</text>`;
  REGIONS.forEach(r=>{const n=LOTS.filter(l=>l[4]===r.id).length;const on=selRegion===r.id;const rad=7+n*2.2;const x=X(r.lon),y=Y(r.lat);
    s+=`<g class="reg" data-reg="${r.id}"><circle cx="${x}" cy="${y}" r="${rad+9}" fill="var(--verm)" fill-opacity="${on?.16:.07}"/><circle class="c" cx="${x}" cy="${y}" r="${rad}" fill="${on?'var(--verm-fond)':'var(--verm)'}" fill-opacity="${on?1:.2}" stroke="${on?'var(--ink)':'var(--verm)'}" stroke-opacity="${on?1:.8}" stroke-width="1"/>`+
    (r.id==='dali'?`<path d="M${x-3} ${y} l3 -3 l3 3 l-3 3z" fill="${on?'var(--sur-couleur)':'var(--verm-txt)'}"/>`:n?`<text x="${x}" y="${y+3.5}" fill="${on?'var(--sur-couleur)':'var(--ink)'}" font-size="10" font-weight="600" text-anchor="middle">${n}</text>`:'')+
    `<text x="${x+rad+6}" y="${y-1}" fill="var(--ink)" font-size="12" font-weight="500">${r.n}</text>${LANG==='zh'?'':`<text x="${x+rad+6}" y="${y+11}" fill="var(--mute)" font-size="9.5">${r.zh}</text>`}</g>`});
  return s+'</svg>'}
/* Une synthèse par terroir, composée à partir des lots classés : rien n'y
   est affirmé qui ne soit déjà dans les données — la bande d'altitude, les
   variétés, les procédés et la part des quinze premiers se déduisent du
   tableau. Les variétés renvoient à leur fiche dans l'arbre quand elle
   existe ; « Wangjin Yunka » n'en a pas, et c'est dit dans le texte de
   Nujiang. */
function noeudDe(v){if(/Geisha|瑰夏/i.test(v))return 'gesha';if(/Catimor|卡蒂姆/i.test(v))return 'catimor';return null}
function terrSynth(r,lots){
  if(!lots.length)return `<p class="lead" style="margin-top:14px">${U('tRien')}</p>`;
  const alts=lots.flatMap(l=>[l[8],l[9]]),nb=(x)=>x.toLocaleString(LANG==='fr'?'fr-FR':'en-US');
  const vars=[...new Set(lots.map(l=>l[7]))],procs=[...new Set(lots.map(l=>l[6]))];
  const part=lots.length>1?U('tPart').replace('{n}',lots.length):U('tPart1');
  const haut=lots.slice().sort((a,b)=>b[9]-a[9])[0];
  const lien=(v)=>{const id=noeudDe(v);const t=TL(v);
    return id&&M[id]?`<button class="lk" data-fiche="${id}">${t}</button>`:`<span>${t}</span>`};
  return `<div class="bref">
    <div class="sec">${U('tBref')}</div>
    <dl class="meta">
      <dt>${U('tPartL')}</dt><dd>${r?part:U('tRegions').replace('{n}',new Set(lots.map(l=>l[4])).size)}</dd>
      <dt>${U('tBande')}</dt><dd>${nb(Math.min(...alts))} – ${nb(Math.max(...alts))} m</dd>
      <dt>${U('tVar')}</dt><dd class="vlist">${vars.map(lien).join(' · ')}</dd>
      <dt>${U('tProc')}</dt><dd>${procs.map(x=>TL(x)).join(' · ')}</dd>
      <dt>${U('tHaut')}</dt><dd>n°${haut[0]} · ${TL(haut[3])}, ${nb(haut[9])} m</dd>
    </dl>
  </div>`}

function terrHTML(){

  const vc=v=>/Geisha/.test(v)?GROUPS.eth.c:v==='Catimor'?GROUPS.intro.c:'#8a857a';const xa=a=>((a-1000)/1000*100).toFixed(1);

  <div class="altscale"><span></span><span></span><div><span>1000</span><span>2000 m</span></div><span style="text-align:right">${U('pts')}</span></div>
  <div class="lots">${lots.map(l=>`<div class="lot"><span class="rk">${l[0]}</span><span class="nm"><span class="vc" style="background:${vc(l[7])};color:${surFond(vc(l[7]))}">${TL(l[7])}</span>${TL(l[3])}<small>${TL(l[2])} · ${TL(l[5])} · ${TL(l[6])}</small></span><span class="alt" title="${l[8]}${l[9]!==l[8]?'–'+l[9]:''} m"><i style="left:${xa(l[8])}%;width:${Math.max(7,(l[9]-l[8])/10)}%;background:${vc(l[7])}"></i></span><span class="sc">${l[1].toFixed(2)}</span></div>`).join('')}</div>`:`<div class="sec">${U('noLot')}</div>`}

for(const k in GROUPS)FR.groups[k]=GROUPS[k].l;for(const k in LT)FR.lt[k]=LT[k].l;ERAS.forEach((e,i)=>FR.eras[i]=e[1]);YLINKS.forEach((l,i)=>FR.yl[i]=l[2]);
function setLang(l,init){
  if(!UI[l])l='fr';LANG=l;document.documentElement.lang=l==='zh'?'zh-CN':l;try{localStorage.setItem('yunma-lang',l)}catch(e){}
  if(!FR.story.length)STORY.forEach((s,i)=>FR.story[i]=[s.k,s.t,s.d]);
  NODES.forEach(n=>{const f=FR.nodes[n.id],o=l==='fr'?{}:((NODES_L[l]||{})[n.id]||{});for(const k of['n','alt','yl','pl','d','yun'])n[k]=k in o?o[k]:f[k]});
  EVENTS.forEach((e,i)=>{const o=l!=='fr'&&EVENTS_L[l]?EVENTS_L[l][i]:FR.events[i];e.t=o[0];e.d=o[1]});
  REGIONS.forEach(r=>{const o=l!=='fr'&&REGIONS_L[l]?REGIONS_L[l][r.id]:FR.regions[r.id];r.n=o[0];r.d=o[1];r.d2=o[2]});
  STORY.forEach((s,i)=>{const f=FR.story[i],o=l!=='fr'&&STORY_L[l]?STORY_L[l][i]:null;s.k=o&&o[0]?o[0]:(f[0]&&o?undefined:f[0]);if(o&&!o[0])s.k=undefined;s.t=o?o[1]:f[1];s.d=o?o[2]:f[2]});
  for(const k in GROUPS)GROUPS[k].l=l!=='fr'?GROUPS_L[l][k]:FR.groups[k];
  for(const k in LT)LT[k].l=l!=='fr'?LT_L[l][k]:FR.lt[k];
  ERAS.forEach((e,i)=>e[1]=l!=='fr'?ERAS_L[l][i]:FR.eras[i]);
  YLINKS.forEach((y,i)=>y[2]=l!=='fr'?YL_L[l][i]:FR.yl[i]);
  SIG=`<div class="sig">${LOGO_FULL}<span>${U('sig')}</span></div>`;
  applyStatic();try{document.getElementById('sndBtn').setAttribute('aria-label',U('sound'))}catch(e){}if(init)return;
  syncTime();
  if(pageOpen&&curPage){const sc=page.scrollTop;if(curPage[0]==='f')openFiche(M[curPage[1]],true,true);else{pkick.textContent=PAGES[curPage[1]].k();pin.innerHTML=PAGES[curPage[1]].r();PAGES[curPage[1]].after&&PAGES[curPage[1]].after()}page.scrollTop=sc}
  if(S.sel)select(S.sel,true);else if(S.selEv)selectEvent(S.selEv,true);
  if(ST.on)renderStoryCard();
  if(TERR.on){majBoutonsTerr();terrAllerA(TERR.i,true)}
}
function applyStatic(){
  document.querySelectorAll('[data-i]').forEach(el=>{const v=U(el.dataset.i);if(typeof v==='string')el.innerHTML=v});
  document.getElementById('menuBtn').setAttribute('aria-label',U('openMenu'));
  document.getElementById('mnav').innerHTML=['arbre','histoire','varietes','yunnan','terroirs','sources'].map((k,i)=>`<li><button data-go="${k}"><span>0${i+1}</span>${U('nav')[i][0]}${U('nav')[i][1]?`<small>${U('nav')[i][1]}</small>`:''}</button></li>`).join('');
  document.getElementById('chips').innerHTML=Object.entries(GROUPS).map(([k,g])=>`<button class="chip${S.hidden.has(k)?' off':''}" data-g="${k}"><span class="dot" style="background:${g.c}"></span>${g.l}</button>`).join('');
  document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  document.getElementById('brand').setAttribute('aria-label','Yunma');
}
document.getElementById('langs').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b)setLang(b.dataset.l)});

const slider=document.getElementById('slider'),yrEl=document.getElementById('yr'),eraEl=document.getElementById('era');
function syncTime(){const u=y2u(S.year);slider.value=Math.round(u*1000);slider.style.setProperty('--p',(u*100)+'%');yrEl.innerHTML=fmtYear(S.year);eraEl.textContent=ERAS.find(e=>S.year<e[0])[1]}
slider.addEventListener('input',()=>{touch();AUD.fx('tick');S.playing=false;if(ST.on)storyEnd(false,true);let y=u2y(slider.value/1000);if(y>=1400)y=Math.round(y);S.year=Math.min(2026,y);if(!S.sel)tgt.ty=Math.max(-2300,Math.min(2400,wy(S.year)-500));syncTime()});
const ticks=document.getElementById('ticks');
[[-610000,'−610k'],[1400,'1400',1],[1700,'1700'],[1900,'1900'],[1950,'1950'],[2000,'2000',1],[2026,'2026']].forEach(([y,l,m])=>{const u=y2u(y)*100;ticks.insertAdjacentHTML('beforeend',`<i style="left:${u}%"></i><span class="${m?'m':''}" style="left:${u}%">${l}</span>`)});
EVENTS.forEach(e=>ticks.insertAdjacentHTML('beforeend',`<b style="left:${y2u(e.y)*100}%"></b>`));
const playBtn=document.getElementById('play'),playIc=document.getElementById('playIc');
playBtn.onclick=()=>{lastInteract=performance.now();document.getElementById('hint').style.opacity=0;document.getElementById('dock').classList.remove('cta-on');if(ST.on)storyPause(!ST.paused);else storyStart(0)};

/* =====================================================================

const STORY=[
 {y:-610000,ov:1,ids:['can','eug'],k:'Prologue',t:'Deux espèces sauvages',d:'Dans les forêts d’Afrique, le Robusta (C. canephora) et C. eugenioides évoluent chacun de leur côté depuis des centaines de milliers d’années.'},
 {y:-350000,id:'ara',t:'Naissance de l’Arabica',d:'Il y a 350 000 à 610 000 ans, en Éthiopie, les deux espèces se croisent naturellement. L’Arabica naît avec le double de chromosomes. Le Robusta est donc l’un de ses parents.'},
 {y:-30500,id:'eth',t:'Sauvages et cultivés se séparent',d:'Il y a environ 30 500 ans, les populations sauvages se séparent des ancêtres des futurs caféiers cultivés. L’Éthiopie reste le grand réservoir génétique.'},
 {y:1450,id:'yem',t:'Le Yémen, premier jardin',d:'Au XVe siècle, le café est cultivé au Yémen. Presque toutes les variétés du monde descendent de ce petit groupe d’arbres : c’est un goulet génétique décisif.'},
 {y:1700,id:'typ',t:'Typica, la route hollandaise',d:'De l’Inde à Java, puis Amsterdam et Paris : un plant offert à Louis XIV en 1714 est à l’origine des caféiers des Antilles et d’Amérique latine.'},
 {y:1715,id:'bou',t:'Bourbon, l’île française',d:'Sur l’île Bourbon (La Réunion), les Français cultivent leur propre lignée venue du Yémen, plus productive et plus sucrée.'},
 {y:1870,id:'mar',t:'Une mutation géante',d:'Au Brésil, un Typica mute et donne des grains énormes : le Maragogipe. Les mutations deviennent un moteur de diversité.'},
 {y:1892,ev:0,ids:['typ','bou'],ink:RUST,t:'Le café arrive au Yunnan',d:'Un missionnaire français plante des caféiers autour de son église à Zhukula (la date est débattue : 1892 à 1904). Une vingtaine d’arbres centenaires y vivent encore.'},

 {y:2010,id:'dr132',ink:RUST,t:'Le Yunnan crée ses variétés',d:'À Ruili, l’institut de Dehong repère un caféier aux fruits jaune doré : De-Re 132, première d’une série de variétés nées au Yunnan.'},

 {y:2021,id:'steno',t:'Stenophylla, l’espèce retrouvée',d:'Disparue des radars pendant des décennies, elle est retrouvée en Sierra Leone. Elle supporte bien plus de chaleur que l’Arabica, pour une tasse qui lui ressemble.'},

 {y:2026,ev:13,ids:['gesha','catimor'],ink:RUST,t:'Gems of Yunnan 2026',d:'169 cafés sont en compétition. Le Geisha domine, mais un Catimor de Baoshan atteint 88,53 pts : le Yunnan prouve son potentiel.'},
 {y:2026,ov:1,ink:RUST,k:'Épilogue',t:'La route continue',d:'Début 2027, Yunma repart dans les montagnes du Yunnan à la rencontre de nouveaux producteurs. Cent treize ans après Nongxianshan, la même route, pour une histoire qui n’a pas fini de s’écrire. En attendant, l’atlas est à vous.'}

const ST={on:false,i:0,t:0,paused:false,u0:0,u1:0,from:null,to:null,bump:0};
const TRANS=3.2,HOLD=4.2;
const story=document.getElementById('story'),sprog=document.getElementById('sprog');
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
let storyText=false;
function setStoryText(v){}
function stepTarget(st){const n=st.id?M[st.id]:null,mob=mobile();
  if(st.ov){if(st.y<0)return{tx:0,tz:0,ty:wy(-610000)+1250,dist:mob?8200:9400,pitch:.42};const h=HOME();return{tx:0,tz:0,ty:0,dist:h.dist,pitch:.24}}
  if(n)return{tx:n.x,tz:n.z,ty:n.wy,dist:mob?1350:1550,pitch:.15};
  return{tx:0,tz:0,ty:EVENTS[st.ev].wy,dist:mob?5600:6800,pitch:.2}}
function camSnap(){return{tx:cam.tx,tz:cam.tz,ty:cam.ty,dist:cam.dist,pitch:cam.pitch}}
function storyStart(i=0){story.classList.remove('resume');
  S.intro=false;S.playing=false;terrStop(false,true);deselect();closePage();closeMenu();
  ST.on=true;ST.paused=false;document.body.classList.add('storying');story.classList.add('on');setStoryText(storyText);document.getElementById('hint').style.opacity=0;
  if(i===0){S.year=-610000;syncTime()}storyGo(i);setPlayIcon(true)}
function renderStoryCard(){const st=STORY[ST.i],n=st.id?M[st.id]:null;
  document.getElementById('skick').textContent=(ST.i+1)+' / '+STORY.length+' · '+(st.y<0?fmtPlain(st.y):st.y);
  document.getElementById('stitle').textContent=st.t;document.getElementById('stext').textContent=st.d;
  const so=document.getElementById('sopen');so.style.display=(n||st.ev!=null)?'':'none';
  so.innerHTML=n?IC.fiche:IC.arrow;const lib=n?U('readFiche'):U('yTimeline');so.title=lib;so.setAttribute('aria-label',lib)}
function storyGo(i){AUD.fx('step');
  ST.i=Math.max(0,Math.min(STORY.length-1,i));ST.t=0;const st=STORY[ST.i];ST.u0=y2u(S.year);ST.u1=y2u(st.y);
  ST.from=camSnap();ST.to=stepTarget(st);
  const tr=Math.hypot(ST.to.tx-ST.from.tx,ST.to.ty-ST.from.ty,ST.to.tz-ST.from.tz);ST.bump=Math.min(6400,tr*.55);
  const n=st.id?M[st.id]:null;S.hl=n;S.selEv=st.ev!=null?EVENTS[st.ev]:null;
  const ids=[...(st.ids||[]),...(st.id?[st.id]:[])];
  S.focus=ids.length&&!st.ov?new Set(ids.flatMap(id=>[id,...ancestors(id)])):(st.ov&&ids.length?new Set(ids):null);
  S.yfocus=st.ev!=null?new Set(ids):null;
  renderStoryCard();const card=story.querySelector('.sin');card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap');
}
function storyTick(dt){
  if(!ST.on)return;
  if(!ST.paused){
    ST.t+=dt;const st=STORY[ST.i];const e=ease(Math.min(1,ST.t/TRANS));const f=ST.from,to=ST.to;
    /* trajectoire continue : glissement + léger recul au milieu du trajet, puis lent travelling avant */
    tgt.tx=f.tx+(to.tx-f.tx)*e;tgt.tz=f.tz+(to.tz-f.tz)*e;tgt.ty=f.ty+(to.ty-f.ty)*e;tgt.pitch=f.pitch+(to.pitch-f.pitch)*e;
    const hold=Math.max(0,ST.t-TRANS)/HOLD;
    tgt.dist=f.dist+(to.dist-f.dist)*e+ST.bump*Math.sin(Math.PI*e)-(st.ov?0:to.dist*.12*Math.min(1,hold));
    tgt.yaw+=dt*.085;tgt.oy=mobile()?-110:-60;
    if(ST.t<=TRANS){S.year=e>=.999?st.y:Math.min(2026,u2y(ST.u0+(ST.u1-ST.u0)*e));syncTime()}else if(S.year!==st.y){S.year=st.y;syncTime()}
    if(ST.t>TRANS+HOLD){if(ST.i<STORY.length-1)storyGo(ST.i+1);else storyEnd(true)}}
  sprog.style.width=Math.min(100,(ST.i+Math.min(1,ST.t/(TRANS+HOLD)))/STORY.length*100)+'%';
}
function storyHold(){if(!ST.paused)storyPause(true);story.classList.add('resume')}
function storyPause(p){if(!ST.on)return;if(!p)story.classList.remove('resume');ST.paused=p;setPlayIcon(!p);document.getElementById('splay').innerHTML=p?IC.play:IC.pause;
  if(!p){/* reprise : repartir en douceur de la position actuelle */const st=STORY[ST.i];ST.from=camSnap();ST.to=stepTarget(st);ST.bump=0;ST.u0=y2u(S.year);ST.t=Math.min(ST.t,TRANS*.4)}}
function storyEnd(done,keepYear){ST.on=false;dispatchEvent(new Event('yunma:recit-fini'));if(!keepYear){S.year=2026;syncTime()}S.hl=null;S.yfocus=null;S.focus=null;S.selEv=null;story.classList.remove('on');document.body.classList.remove('storying');tgt.oy=0;setPlayIcon(false);
  if(done)goHome()}
function setPlayIcon(on){playIc.innerHTML=on?IC.pause:IC.play;document.getElementById('splay').innerHTML=on?IC.pause:IC.play}
document.getElementById('sprev').onclick=()=>{storyGo(ST.i-1);if(ST.paused)storyPause(false)};
document.getElementById('snext').onclick=()=>{storyGo(ST.i+1);if(ST.paused)storyPause(false)};
document.getElementById('splay').onclick=()=>storyPause(!ST.paused);
document.getElementById('sclose').onclick=()=>storyEnd(false);
document.getElementById('sopen').onclick=()=>{const st=STORY[ST.i];if(st.id)openFiche(M[st.id]);else openPage('yunnan')};
document.getElementById('sprev').innerHTML=IC.prev;document.getElementById('snext').innerHTML=IC.next;document.getElementById('sclose').innerHTML=IC.close;setPlayIcon(false);
function ctaPulse(){document.getElementById('dock').classList.add('cta-on')}


/* ---------- démarrage ---------- */
/* son : démarre au premier geste (règle des navigateurs) */
document.body.classList.toggle('muted',!AUD.on);
['pointerdown','pointerup','touchstart','touchend','keydown','wheel','click'].forEach(ev=>
  document.addEventListener(ev,()=>{AUD.start(true);AUD.reveil()},{passive:true}));
/* Et sans attendre un geste : là où le navigateur l'accepte, la nappe est
   déjà là quand la page apparaît. Ailleurs, le contexte reste en sommeil et
   le premier geste le réveille — on ne peut pas faire mieux, c'est la règle
   des navigateurs. */
/* Là où le navigateur a déjà vu un geste sur cette page — un lien rouvert,
   un retour en arrière, un ordinateur de bureau —, la nappe est là dès
   l'arrivée. Sur un téléphone, le premier contact l'ouvre : aucune page ne
   peut faire mieux, c'est la règle des navigateurs et non un réglage. */
AUD.start();setTimeout(()=>{AUD.start();AUD.reveil()},120);
addEventListener('pageshow',()=>AUD.start());
document.getElementById('sndBtn').addEventListener('click',e=>{e.stopPropagation();AUD.setOn(!AUD.on);AUD.fx('tap')});
/* Une voix par geste. Le même tic pour tous les boutons faisait un bruit
   de clavier ; chacun a maintenant sa note, et toutes passent par la
   réverbération — c'est l'écho qui fait l'ambiance. Les boutons qui ont
   déjà leur son (ouvrir une page, une fiche, fermer) n'entrent pas dans
   cette table : ils sonneraient deux fois. */
const VOIX=[['#tnext','next'],['#tprev','prev'],['.menubtn','menu'],
  ['.mhead .x','close'],['.langs button','lang'],['.swr','bascule']];
document.addEventListener('click',e=>{
  if(e.target.closest('#sndBtn'))return;
  const el=e.target.closest('button,a,.vrow,[data-fiche],[data-page],[data-ev]');
  if(!el)return;
  for(const [sel,son] of VOIX){if(el.closest(sel))return AUD.fx(son)}
  AUD.fx('tap');
},true);
S.year=-610000;syncTime();cam.ty=tgt.ty=wy(-610000)+950;cam.dist=tgt.dist=mobile()?9000:10000;cam.pitch=tgt.pitch=.32;
if(!reduce){setTimeout(()=>{if(S.intro)S.playing=true},1100)}else{S.intro=false;S.year=2026;syncTime();goHome();ctaPulse()}
setTimeout(()=>{document.getElementById('hint').style.opacity=0},9000);
buildBG();
let L0='fr';try{L0=localStorage.getItem('yunma-lang')||''}catch(e){}if(!L0){const nl=(navigator.language||'fr').toLowerCase();L0=nl.startsWith('zh')?'zh':nl.startsWith('fr')?'fr':'en'}setLang(L0,true);syncTime();
requestAnimationFrame(loop);fromHash();
const sp=document.getElementById('splash');setTimeout(()=>sp.classList.add('out'),reduce?0:1300);setTimeout(()=>sp.remove(),2800);

</script>
