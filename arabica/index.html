 zh:{
  bmount:{n:'蓝山',alt:'Blue Mountain',yl:'1728 年传入牙买加',pl:'牙买加蓝山',d:'咖啡于 1728 年传入牙买加，在那里定居下来的铁皮卡系后来成了蓝山——被描述为铁皮卡的一个突变，对咖啡浆果病有一定抗性。这个名字首先是一个产地名称：只有圣安德鲁、圣托马斯、波特兰和圣玛丽四个教区经认证的咖啡才能使用，产区山势高达 2 256 米，气候凉爽多雾。八成以上出口日本。同一系也种植于肯尼亚、夏威夷、海地、巴布亚新几内亚（称 PNG Gold）和喀麦隆（称 Boyo）。'},
  laurina:{n:'尖身波旁',alt:'Laurina / Bourbon pointu',yl:'约 1810 年',pl:'波旁岛（留尼汪）',d:'约 1810 年，留尼汪的种植者注意到一些更矮小的波旁树，果实和种子都是尖的——因此得名“尖身波旁”。长期以来人们以为它是与岛上原生咖啡的杂交，但关于其起源的研究认定它只是波旁的一个自然突变，基因几乎完全相同。它的名字来自与月桂树的相似。它的咖啡因含量约为普通阿拉比卡的一半——这也让它更容易受虫害，因为咖啡因本是天然的驱虫物质。树形如圣诞树，高约两米，叶片小，果实脆弱。19 世纪末几近灭绝，后来重新回到视野，并支撑了 2018 年世界手冲大赛的夺冠方案。'},
  fmission:{n:'法国传教团',alt:'French Mission',yl:'约 1897 年',pl:'东非（法国传教团）',d:'这是约 1897 年由法国传教士带到东非种植的波旁的称呼。因此它不是一个独立品种，而是在肯尼亚、坦桑尼亚和卢旺达适应下来的波旁种群。肯尼亚的各个选系都出自它：K7 直接从中选出，SL34 也是在法国传教团群体中选育的——尽管世界咖啡研究组织把它的遗传特征归到该群的铁皮卡一侧。这个名字在非洲市场上仍在流通，坦桑尼亚和巴布亚新几内亚的 Arusha 也源于此。'},
  boujaune:{n:'黄波旁',alt:'Bourbon Amarelo',yl:'1930 年',pl:'巴西圣保罗州佩德内拉斯',d:'1930 年在圣保罗州佩德内拉斯发现。有两种说法并存，至今仍有争议：博图卡图的黄波旁与红波旁自然杂交，或者只是红波旁的一个突变。它的果实成熟时呈金黄色而非红色。它是最早因杯中表现而获得认可的品种之一——甜润、body 细致、层次丰富——产量也明显高于老品种：巴西的产量在 1949 至 1951 年间增长了两倍，随后在更高产、更抗病的品种面前退场。坎皮纳斯农学院 2005 年重新开展相关研究。在 2017 年巴西卓越杯上，一支黄波旁获得 92.33 分，以每磅 126 美元成交，相当于当日期货价的一百倍。',yun:'在云南与卡蒂姆并种，还有铁皮卡和帕卡马拉，出现在追求杯中品质而非产量的地块。Yunma 的黄波旁就是这个品种，来自保山潞江坝的高晟庄园。'},
  k7:{n:'K7',yl:'1936 年',pl:'肯尼亚穆霍罗尼 Legelet 庄园',d:'由种植者 R. H. Walker 从法国传教团群体中选出的肯尼亚选系，随后由斯科特农业实验室经五代选育，于 1936 年推出。它完全是依据杯测结果挑选出来的。树形高大，产量中等，高海拔表现良好，第三年初产。它如今在世界咖啡研究组织的目录中与卡杜拉、波旁一起作为产量参照，并在肯尼亚和坦桑尼亚的育种中被大量使用：Ruiru 11 和 Batian 的亲本里都有它。'},
  pache:{n:'帕切',alt:'Pache comum',yl:'1949 年',pl:'危地马拉圣罗莎 Santa Cruz Naranjo，Brito 农场',d:'铁皮卡的自然突变，源于单个矮化基因：树形紧凑，可以更密植，产量更高。1949 年在 Santa Cruz Naranjo 的 Brito 农场发现，随后以集团选择法固定——留下一批表现优异的个体，混合其种子，再重复这一过程。第四年初产。与卡杜拉杂交后得到 Pache Colis，果实更大，叶面更粗糙。'},
  jarc:{n:'74110 · 74112',alt:'吉马选系',yl:'“74”系列，自 1970 年代起推广',pl:'埃塞俄比亚吉马农业研究中心',d:'埃塞俄比亚批次标签上的“heirloom”背后，其实也有正式命名和登记的品种。74 系列的编号出自吉马农业研究中心（JARC），该中心在埃塞俄比亚森林中选出抗咖啡浆果病的个体。连同 74158，它们是西达莫最常见的三个品种：豆粒小到中等，杯中酸质与 body 平衡。JARC 发表的研究至今仍以 74110 作为比较处理法的参照品种。'},
  t5296:{n:'T5296',yl:'约 1970 年代',pl:'葡萄牙 CIFC → 哥斯达黎加 CATIE',d:'帝汶杂交种 832/2 × 薇拉莎奇：整个莎奇姆家族的母系。矮化，豆粒大，产量中等，高海拔杯中潜力良好，对叶锈病中度抗性，第三年初产。它的缺点众所周知：这个选系并不整齐，植株在世代之间不稳定——因此世界咖啡研究组织不建议用于生产种植，却认为它对育种至关重要。它需要高施肥量，也是 F1 杂交种 Centroamericano 和 Mundo Maya 的亲本。'},
  t8667:{n:'T8667',yl:'1978 年 CATIE 收到 F5 后代',pl:'葡萄牙 CIFC → 哥斯达黎加 CATIE',d:'帝汶杂交种 832/1 × 卡杜拉，再经系谱选择：这是中美洲育种史上最重要的卡蒂姆选系。它的起点是 PROMECAFE——1978 年由美国国际开发署与巴西坎皮纳斯农学院共同成立的区域联盟，用以应对叶锈病的到来；同年 CATIE 从 CIFC 收到 F5 后代。矮化，新叶铜色，产量高，对叶锈病中度抗性，第三年初产，适应最炎热的产区和酸性土壤。它在高海拔的杯中潜力被评为低：这是整个家族的局限。'},
  vcol:{n:'哥伦比亚品种',alt:'Variedad Colombia',yl:'1982 年',pl:'哥伦比亚 Cenicafé',d:'Cenicafé 于 1968 年启动抗叶锈病育种计划，以卡杜拉和帝汶杂交种为起点，这是该计划的第一个品种。1982 年推出，比叶锈病首次抵达哥伦比亚早一年。此后 Cenicafé 继续寻求更好的结果——更高产量、更强抗性、更大豆粒、接近卡杜拉的杯中表现，以及更长寿命：经过二十三年，这成了卡斯蒂罗。'},
  ruiru11:{n:'Ruiru 11',yl:'1985 年',pl:'肯尼亚 Ruiru 研究站',d:'1968 年一场咖啡浆果病疫情让肯尼亚损失了一半产量。Ruiru 研究站启动密集育种计划，并于 1985 年推出一个复合杂交品种：以卡蒂姆为母本，与来自 K7、SL28、N39 和苏丹罗米的复合选系杂交。矮化，产量极高，第二年即初产，高海拔杯中潜力良好——但杯中表现被认为不及 K7、SL28 和 SL34。正是这个品种让肯尼亚得以密植并减少损失。'},
  cr95:{n:'哥斯达黎加 95',alt:'Costa Rica 95',yl:'1990 年代（推广年份未查到）',pl:'哥斯达黎加 ICAFE',d:'与 T8667 相同的杂交组合——帝汶杂交种 832/1 × 卡杜拉——由哥斯达黎加咖啡研究院逐代选育。矮化，产量高，高海拔杯中潜力被评为低。它说明了行业的一个习惯：同一个杂交组合，由两个机构分别选育，就成了两个名字的品种。'},
  obata:{n:'红欧巴塔',alt:'Obatã Vermelho',yl:'2000 年在巴西推广',pl:'巴西坎皮纳斯农学院（IAC）',d:'帝汶杂交种 832/2 × 薇拉莎奇 CIFC 971/10，由圣保罗州坎皮纳斯农学院逐代选育。2000 年在巴西推出，随后由 ICAFE 引入哥斯达黎加，2014 年商业推广。矮化，产量高，高海拔杯中潜力良好。它是世界咖啡研究组织用来与野生阿拉比卡杂交、创造 F1 杂交种的三个莎奇姆之一。'},
  iapar59:{n:'IAPAR 59',yl:'1990 年代（推广年份未查到）',pl:'巴西巴拉那农学院（IAPAR）',d:'与 T5296 相同的杂交组合——帝汶杂交种 832/2 × 薇拉莎奇——但这次由巴拉那农学院选育。矮化，新叶浅铜色，产量中等，抗叶锈病并抗部分线虫，第三年初产；高海拔杯中潜力被评为低。与欧巴塔和 Marsellesa 一样，它也是世界咖啡研究组织 F1 杂交种的亲本。'},
  batian:{n:'Batian',yl:'2010 年',pl:'肯尼亚 Ruiru 咖啡研究站',d:'2010 年在肯尼亚推出，通过在部分 Ruiru 11 后代父本的 F5 世代中进行单株选择而得。这是一个复合品种：三个纯系混合，其亲本汇集了 SL28、SL34、苏丹罗米、N39、K7、SL4 和帝汶杂交种。树形高大，产量高，第二年即初产，尤其是高海拔杯中潜力很好——对一个同时抗叶锈病和咖啡浆果病的品种来说，这相当少见。'},
  chiroso:{n:'奇罗索',alt:'Caturra Chiroso',yl:'2012 年哥伦比亚卓越杯上被发现',pl:'哥伦比亚安蒂奥基亚省 Urrao',d:'主要种植在安蒂奥基亚省西南部的 Urrao。起初人们以为它是卡杜拉的突变，豆形细长，因此最早叫“Caturra Chiroso”——chiroso 在哥伦比亚乡间口语里意为“略微拉长的”。基因检测却把它归入埃塞俄比亚地方种，也就是在波旁-铁皮卡群之外；这些研究尚未得到科学验证，也没有人知道这个品种是如何从埃塞俄比亚到哥伦比亚的。Urrao 有两种树并存，一种果实深红，另一种偏黄且叶形不同。它的轨迹和 Sidra、粉红波旁一样：先在比赛中被发现，然后为了杯中表现而被种下。'},
  ceni1:{n:'Cenicafé 1',yl:'约 2016 年 · 二十年工作',pl:'哥伦比亚 Cenicafé',d:'卡杜拉 × 帝汶杂交种 1343，从 116 个高代后代中筛选而来：二十年育种，为哥伦比亚种植者提供一棵外形像卡杜拉却抗叶锈病的树——同时也抗咖啡浆果病，而这种病还没有抵达哥伦比亚。产量与卡斯蒂罗相当，豆粒大，据哥伦比亚咖啡生产者协会称杯测可达精品级。全日照下每公顷可种 10 000 株，遮荫下 5 000 至 7 000 株。'},
  cifc7963:{n:'卡蒂姆 CIFC 7963',alt:'Catimor CIFC 7963',yl:'自 1980 年代起在云南推广',pl:'葡萄牙 CIFC → 云南',d:'数十个卡蒂姆选系中的一个，却是亚洲种植面积最大的之一。编号来自葡萄牙 CIFC 的种质收集，这个家族的所有选系都出自那里。',yun:'实际上，它就是云南的品种。2011 年，它一己覆盖了全省 43 000 公顷中的约 90%。推广它的德宏研究所称，其选育或引进的品种——包括 CIFC 7963——覆盖了全省八成以上的面积：这是该所自己的说法，而非独立数据。因此，世界上几乎所有在售的“云南小粒咖啡”背后，都是这一个选系——以及随之而来的单一化，而这正是今天云南各研究所试图松开的局面。'},
  sidra:{n:'西德拉',alt:'Sidra',yl:'厄瓜多尔，约 1990–2000 年代（来历存疑）',pl:'厄瓜多尔皮钦查 → 哥伦比亚',d:'通常的说法是：它是雀巢在厄瓜多尔的研究站培育的铁皮卡 × 波旁杂交种。但烘焙商公布的基因检测结果更指向埃塞俄比亚地方种，世界咖啡研究组织（WCR）也认为这个名字下可能是几个不同的品种。比赛中的常客。'},
  pink:{n:'粉波旁',alt:'Pink Bourbon',yl:'哥伦比亚乌伊拉，约 2010 年代',pl:'哥伦比亚乌伊拉',d:'果实呈粉色，起初被认为是红波旁与黄波旁的自然杂交。两次基因检测（2017 年，以及 2023 年由 RD2 Vision 完成）结论一致：它是埃塞俄比亚地方种，与波旁无关。名字却沿用了下来。'},
  mmaya:{n:'玛雅世界',alt:'Mundo Maya · H16',yl:'约 2010 年代',pl:'CIRAD 与 ECOM（尼加拉瓜）',d:'F1 杂交种：莎奇摩 T5296 × 埃塞俄比亚种质 ET01，出自 CIRAD 及其合作伙伴（CATIE、Icafé、ECOM）在 1990–2013 年间的育种项目。在已发表的试验中，它与 Centroamericano 一样，产量超过拉丁美洲种植最广的品种。以无性繁殖方式扩繁。'},
  dr132:{n:'德热132',alt:'De-Re 132',yl:'德宏热作所选育（未查到确切年份）',pl:'云南德宏瑞丽',d:'由云南省德宏热带农业科学研究所（瑞丽）选育：从种质圃中发现的一株结金黄色果实的特殊单株出发。其确切系谱未在公开资料中发表。它是“德热”系列的代表：据该所介绍，共选育 16 个品种，其中 8 个通过国家审定，包括德热3号和德热4号。',yun:'少数诞生于云南的咖啡品种之一。该所拥有中国最大的咖啡种质资源圃（1150 余份）。该所称，其选育或推广的品种（包括卡蒂姆 CIFC 7963）占全省种植面积 80% 以上——这是研究所自己的说法，并非独立统计。德宏主要种植卡蒂姆、德热和瑰夏。'},
  steno:{n:'狭叶咖啡',alt:'Coffea stenophylla',yl:'2018 年重新发现 · 2021 年发表研究',pl:'塞拉利昂、几内亚、科特迪瓦',d:'20 世纪初以前曾在西非栽培，随后被弃种；1954 年后在塞拉利昂再无记录。2018 年，Aaron Davis（英国邱园）团队在野外重新找到它。它的生长地年均温为 24.9 °C，比阿拉比卡最多高 6.8 °C，品鉴小组认为其风味接近阿拉比卡。果实为黑色。属受威胁物种，尚未规模化种植。'},
  wcrf1:{n:'WCR F1 杂交种',alt:'4 个入围品系',yl:'2016 年杂交 · 2024–2030 年田间试验',pl:'世界咖啡研究组织（中美洲）',d:'2016 年，世界咖啡研究组织用其种质库中的 8 份野生阿拉比卡与三个莎奇摩品种（Obatã、Marsellesa、IAPAR 59）以及瑰夏杂交，得到 46 个 F1 杂交种。第一阶段试验于 2022 年结束，选出 4 个入围品系。自 2024 年起，它们被种在合作农户的田里，在真实条件下测试，预计 2030 年左右决定是否推广。目前尚无商品名。'},
  exc:{n:'Excelsa 咖啡',alt:'Coffea dewevrei',yl:'2025 年起成为独立物种',pl:'中非 · 在印度、乌干达、东南亚种植',d:'长期被视为利比里卡的一个变种。2025 年邱园发表的基因组研究确认它是独立物种。它比利比里卡产量更高，因耐热、耐旱而受到关注；印度已有少数庄园将其做成精品咖啡。'},
  innov:{alt:'新品系',yl:'2022 年启动 · 目标 2030 年推出首批品种',pl:'世界咖啡研究组织网络，9 个国家',d:'五十年来首个全球性的阿拉比卡育种项目，2022 年与九个国家共同启动：哥斯达黎加、印度、印度尼西亚、肯尼亚、墨西哥、秘鲁、卢旺达、乌干达和美国。国际试验中表现最好的亲本被用于新的杂交（2023 年初播下约 1000 株），并借助基因组学进行筛选。目标：到 2030 年推出约一百个纯系品种，以及新的杂交种。罗布斯塔的类似网络也已宣布。',yun:'中国不在九个创始国之列：云南通过本省的研究机构推进品种多样化。'},
  libex:{n:'利比-埃克塞尔萨杂交种',alt:'Coffea × libex',yl:'2026 年提出命名',pl:'乌干达、印度、东南亚',d:'邱园团队于 2026 年为利比里卡 × Excelsa 杂交种提出的名称——两个物种种在一起时会自然杂交。设想是兼具 Excelsa 的高产和利比里卡的气候耐受性。仍处于研究阶段。'},
  eug:{yl:'亲本物种（年代更早）',pl:'东非',d:'二倍体物种，咖啡因含量低。它与罗布斯塔一起，是阿拉比卡的两个亲本。'},
  can:{alt:'罗布斯塔',yl:'亲本物种（年代更早）',pl:'中非与西非',d:'异花授粉的二倍体物种，遗传多样性远高于阿拉比卡，并抗叶锈病。罗布斯塔是阿拉比卡的两个亲本之一；数十万年后，它又通过蒂莫尔杂交种把抗病基因再次传给阿拉比卡。云南所有的卡蒂姆都带有这一印记。'},
  lib:{alt:'利比里卡',yl:'物种',pl:'西非',d:'第三个栽培咖啡物种。它把一个抗叶锈病基因传给了部分印度品系（S288）。'},
  cong:{yl:'物种',pl:'刚果盆地',d:'与罗布斯塔相近的物种，生长于刚果河岸。印度杂交种 CxR 的亲本。'},
  ara:{alt:'阿拉比卡',yl:'距今 35 万至 61 万年',pl:'埃塞俄比亚森林',d:'它源自 C. canephora 与 C. eugenioides 的自然杂交，从双亲各继承两套染色体（异源四倍体）。2024 年发表于《自然·遗传学》的基因组研究将这一事件定在距今 35 万至 61 万年之间，早于智人出现。此后数次种群瓶颈使其遗传多样性变窄，因此它对病害十分敏感。'},
  eth:{n:'埃塞俄比亚种群',alt:'野生种与地方种',yl:'距今约 3.05 万年',pl:'埃塞俄比亚西南部',d:'约 3.05 万年前，野生种群与后来栽培品种的祖先分离（Salojärvi 等，2024）。埃塞俄比亚的森林至今仍是阿拉比卡最大的多样性宝库：瑰夏、爪哇（Abyssinia 种群）和苏丹罗米都采集于此。'},
  yem:{n:'也门阿拉比卡',yl:'约 15 世纪',pl:'也门',d:'埃塞俄比亚之外第一个大规模种植区。2024 年发表的基因组将波旁、铁皮卡和印度栽培品种追溯到也门的共同起源。这一遗传瓶颈解释了为何大多数栽培品种彼此如此相似。'},
  ind:{n:'印度栽培品种',alt:'“七颗种子”',yl:'约 1600 年（传说）',pl:'印度巴巴布丹山',d:'据传，僧人巴巴·布丹约在 1600 年从也门带出七颗种子。这是印度阿拉比卡的起点，也是后来由荷兰人传播的铁皮卡系的源头。'},
  typ:{n:'铁皮卡',alt:'Typica',yl:'1696 – 1720',pl:'印度 → 爪哇 → 阿姆斯特丹 → 巴黎 → 加勒比',d:'17 世纪末，荷兰人把咖啡苗从印度带到爪哇，再送入阿姆斯特丹植物园。1714 年献给路易十四的一株咖啡树，成为加勒比和拉丁美洲咖啡树的源头。树形高大、产量低、极易感染叶锈病，但杯中干净细腻。',yun:'云南两大历史品种之一：1914 年从缅甸引入瑞丽，1950 年代种植于保山。在保山，“老品种”指的就是铁皮卡和波旁。'},
  bou:{n:'波旁',alt:'Bourbon',yl:'约 1708 – 1718',pl:'波旁岛（留尼汪）',d:'18 世纪初，法国人把也门的种子带到波旁岛，19 世纪再传入东非和巴西。产量高于铁皮卡，杯中圆润甜美，易感叶锈病。',yun:'与铁皮卡同为云南最早的品种（1914 年瑞丽，1950 年代保山）。关于朱苦拉当年种下的是哪个品种，各方说法不一。'},
  mar:{n:'象豆',alt:'Maragogipe',yl:'1870',pl:'巴西巴伊亚州马拉戈日皮',d:'铁皮卡的自然突变，豆粒巨大，产量低。帕卡马拉的亲本。'},
  cat:{n:'卡杜拉',alt:'Caturra',yl:'约 1915 – 1918',pl:'巴西米纳斯吉拉斯州',d:'波旁的矮化突变：植株紧凑、可密植、产量高。它成为中美洲集约化种植的基础，也是卡蒂姆和卡杜艾的亲本。',yun:'被列为云南可见的品种之一（Sucafina）。更重要的是，它是如今覆盖全省的卡蒂姆的母本。'},
  kent:{n:'肯特',alt:'Kent',yl:'约 1920 年代',pl:'印度南部',d:'与铁皮卡有亲缘关系的印度选育品种，长期以耐叶锈病著称。S795 的亲本。'},
  hdt:{n:'蒂莫尔杂交种',alt:'HdT',yl:'1927',pl:'帝汶岛',d:'1927 年在一片铁皮卡种植园中发现的一棵树：阿拉比卡 × 罗布斯塔的自发杂交种，几乎对叶锈病免疫。葡萄牙 CIFC 于 1958–59 年获得其种子。它是两个物种之间的遗传桥梁，也是大多数现代品种抗病基因的来源。'},
  java:{n:'爪哇',alt:'Abyssinia',yl:'19 世纪或 1928 年（说法不一）',pl:'埃塞俄比亚 → 爪哇 → 喀麦隆 → 哥斯达黎加（1991）',d:'长期被认为是铁皮卡，基因指纹显示它其实来自名为 Abyssinia 的埃塞俄比亚地方种群。在喀麦隆因部分耐咖啡浆果病而被选育，1991 年引入哥斯达黎加。花香风格接近瑰夏。'},
  sl28:{yl:'1931',pl:'肯尼亚斯科特农业实验室',d:'选自“坦噶尼喀抗旱”母树，遗传上与波旁相关。酸质明亮（黑醋栗、柑橘），是肯尼亚咖啡的标志。易感叶锈病。'},
  sl34:{yl:'1930 年代',pl:'肯尼亚（Loresho，Kabete）',d:'斯科特实验室的另一个选育品种，适应潮湿的高海拔地区。遗传上归属铁皮卡系。',yun:'Sucafina 将其列为中国常见的阿拉比卡品种之一。'},
  s288:{yl:'1930 年代（约）',pl:'印度（CCRI）',d:'选自阿拉比卡 × 利比里卡自然杂交种的印度品种，携带来自 C. liberica 的抗叶锈病基因。',yun:'从印度引入云南（据一份资料为 1963 年），1980 年代作为抗病品种推广，后被产量高得多的卡蒂姆取代。'},
  gesha:{n:'瑰夏',alt:'Geisha',yl:'1930 年代采集',pl:'埃塞俄比亚 Gesha → 肯尼亚、坦桑尼亚 → 哥斯达黎加 CATIE（1953）→ 巴拿马',d:'1930 年代采集的埃塞俄比亚地方种，保存在哥斯达黎加 CATIE，后种植于巴拿马。2004 年因翡翠庄园（Hacienda La Esmeralda）一举成名：茉莉与佛手柑香气，屡创价格纪录。',yun:'云南新浪潮的旗舰品种。在 Gems of Yunnan 2026 中，前 15 名有 13 支是瑰夏（包括“Huixun Geisha”和“瑰夏 1931”），冠军是临沧的一支水洗瑰夏（91.78 分）。'},
  rume:{n:'苏丹罗米',alt:'Rume Sudan',yl:'约 1940 年代（位置仅供参考）',pl:'博马高原（南苏丹）',d:'与埃塞俄比亚种群相近的半野生地方种，遗传多样性珍贵。F1 杂交种 Centroamericano（H1）的亲本。'},
  mnov:{n:'新世界',alt:'Mundo Novo',yl:'1940 年代',pl:'巴西圣保罗',d:'铁皮卡（“苏门答腊”）与红波旁的自然杂交种。生长旺盛、产量高，是巴西的支柱品种，也是卡杜艾的亲本。'},
  s795:{alt:'Jember',yl:'1940 年代',pl:'印度（CCRI）→ 印度尼西亚（1955）',d:'印度中央咖啡研究所培育的肯特 × S288 杂交种。在印度尼西亚被称为“Jember”，1955 年引入。'},
  pacas:{n:'帕卡斯',alt:'Pacas',yl:'1949',pl:'萨尔瓦多',d:'在帕卡斯家族农场发现的波旁矮化突变。'},
  vsar:{n:'薇拉莎奇',alt:'Villa Sarchi',yl:'约 1950 年代',pl:'哥斯达黎加萨尔奇',d:'波旁的矮化突变，适应高海拔和强风。莎奇摩家族的亲本。'},
  pcm:{n:'帕卡马拉',alt:'Pacamara',yl:'1958 年（杂交）',pl:'萨尔瓦多 ISIC',d:'萨尔瓦多咖啡研究所培育的帕卡斯 × 象豆杂交种：豆粒大，风味表现力极强，是比赛常客。',yun:'云南有种植，但处于边缘：见于试验地块和少数老牌精品庄园，并不进入生产性咖啡园。2020 年，全省第一家专营精品咖啡的出口商 Yunnan Coffee Traders 表示，在铁皮卡表现不佳的地方，他们的研究地块上种着帕卡马拉和波旁。在 Gems of Yunnan 2026 前十五名中没有它的身影，那个位置属于瑰夏。它何时进入云南，公开资料没有记载。Yunma 从西双版纳云岚庄园带回的批次正是这个品种，海拔 1600 至 1800 米——这座 1999 年创立的庄园是云南最早的精品庄园之一，种有二十多个品种。'},
  catimor:{n:'卡蒂姆',alt:'Catimor',yl:'1959',pl:'葡萄牙奥埃拉斯 CIFC',d:'红卡杜拉（CIFC 19/1）× 蒂莫尔杂交种（CIFC 832/1）。它不是单一品种，而是在各地选育出的一系列品系（T8667、Costa Rica 95、Lempira、Catisic、Oro Azteca……）。植株紧凑、产量高、抗叶锈病。其风味在低海拔地区一般被认为较平淡。',yun:'占云南产量的 95% 以上。1980 年代通过政府项目引入，1988 年起与雀巢合作大规模推广。2011 年，CIFC 7963 品系覆盖了 4.3 万公顷中的约 90%。它也能大放异彩：在 Gems of Yunnan 2026 中，保山 Tiantian Manor 的一支日晒卡蒂姆以 88.53 分位列第 12。'},
  sarch:{n:'莎奇摩',alt:'Sarchimor',yl:'1960 年代起（约）',pl:'CIFC → 拉丁美洲',d:'薇拉莎奇 × 蒂莫尔杂交种：卡蒂姆的“姊妹”家族，衍生出 T5296、Marsellesa、Obatã 和 Parainema。'},
  ctu:{n:'卡杜艾',alt:'Catuaí',yl:'1949 年杂交 · 1972 年推广',pl:'巴西坎皮纳斯 IAC',d:'新世界 × 黄卡杜拉。紧凑、高产、抗风：拉丁美洲种植最广的品种之一。'},
  castillo:{n:'卡斯蒂略',alt:'Castillo',yl:'2005',pl:'哥伦比亚 Cenicafé',d:'源自卡杜拉 × 蒂莫尔杂交种品系（Variedad Colombia），由 Cenicafé 培育。它在哥伦比亚已大面积取代铁皮卡和波旁。'},
  mars:{yl:'2000 年代（约）',pl:'ECOM / CIRAD（尼加拉瓜）',d:'新一代莎奇摩（HdT 832/2 × 薇拉莎奇 CIFC 971/10），抗叶锈病。Starmaya 的亲本。'},
  h1:{yl:'2010',pl:'CIRAD、PROMECAFE、CATIE（中美洲）',d:'F1 杂交种：莎奇摩 T5296 × 苏丹罗米。得益于杂种优势，产量比对照品种高 22% 至 47%。抗叶锈病，达到精品品质（尼加拉瓜卓越杯第 2 名）。以克隆方式繁殖。'},
  star:{yl:'2019 年（种子）',pl:'ECOM 与 CIRAD（尼加拉瓜）',d:'第一个可用种子繁殖的阿拉比卡 F1 杂交种，关键在于一个天然雄性不育的亲本与 Marsellesa 杂交。其种苗生产成本仅为组培繁殖的一半。'},
  erecta:{n:'直立型（Erecta）',yl:'20 世纪（位置仅供参考）',pl:'乌干达',d:'直立株型。这是乌干达罗布斯塔的一种形态类型，并非严格意义上的品种。其无性系产量高。'},
  nganda:{n:'开张型（Nganda）',yl:'20 世纪（位置仅供参考）',pl:'乌干达',d:'开张株型：乌干达的另一种主要类型。在育种中配合力更好（一般配合力较高）。'},
  bp534:{yl:'20 世纪（日期未核实）',pl:'印度尼西亚爪哇',d:'世界咖啡研究组织（WCR）收录的印度尼西亚罗布斯塔无性系。'},
  sln:{yl:'20 世纪（日期未核实）',pl:'印度（CCRI）',d:'印度中央咖啡研究所选育的罗布斯塔品系。'},
  cxr:{yl:'20 世纪（日期未核实）',pl:'印度（CCRI）',d:'种间杂交种 C. congensis × C. canephora：并非纯正的罗布斯塔。'},
  kr:{yl:'2000 – 2010 年代',pl:'乌干达（NaCORI）',d:'抗咖啡枯萎病的品种。据世界咖啡研究组织（WCR）称，可使农户收入最多提高 250%。'}
 }};
const EVENTS_L={
 en:[['Zhukula, Yunnan’s first coffee','A French missionary, Alfred Liétard (Tian Deneng), planted coffee trees around his church in Zhukula (Binchuan, Dali). Depending on the source, the date is 1892, 1902 or 1904. Around twenty century-old trees still stand there.'],
  ['Robusta reaches Hainan','Outside Yunnan: Robusta was brought from Malaya to Hainan Island. Yunnan, for its part, would remain Arabica country.'],
  ['Ruili: Typica & Bourbon from Burma','Jingpo border officials introduced Typica and Bourbon from Burma to the village of Nongxianshan (Ruili, Dehong).'],
  ['Baoshan scales up','In the 1950s, the Lujiang valley (Baoshan) became the first structured growing area, with about 4,000 ha of Typica and Bourbon.'],
  ['S288 arrives from India','A first rust-resistant variety is introduced to Yunnan.'],
  ['The Catimor turning point','After a public programme in the 1980s (S288 and Catimor), Nestlé partnered with the Yunnan government to plant Catimor across the province. 1988 is the reference year: the Chinese government, the World Bank and the UNDP jointly launched the programme that established modern coffee farming in Yunnan. Today 98% of China’s coffee comes from here.'],
  ['Hogood, the instant-coffee plant','Hogood Coffee is founded in Dehong and becomes China’s largest instant-coffee maker. It takes advantage of relaxed land-use rules in Yunnan to consolidate plots under contract: it supplies the seedlings, farmers harvest, it buys the beans back. This is the model that made Yunnan a volume supplier before it was a terroir.'],
  ['The first specialty lots','Specialty production starts around 2009 around a handful of early adopters, among them Hu Xixiang at Mangzhang Farms (Menglian, Pu’er), supported by professionals from abroad. In 2013, Yunnan Coffee Traders becomes the province’s first dedicated specialty exporter.'],
  ['43,000 ha, 90% Catimor','The CIFC 7963 line dominates. The province produced 53,240 t of coffee in 2011.'],
  ['Starbucks sets up in Pu’er','The Yunnan Farmer Support Center opens. In 2014, Starbucks bought more than half of the Chinese coffee imported into the United States over the first nine months of the year.'],
  ['A coffee exchange at Pu’er','The Yunnan Coffee Exchange opens in January 2016. That same year about half the crop is exported, earning US$280 million — almost entirely commercial-grade green beans bound for Europe. In 2018, Chongqing becomes the country’s largest trading hub.'],
  ['China, portrait country of the SCA expo','The Specialty Coffee Association picks China as the portrait country of its expo, the largest in the world. At the time, specialty coffee still accounts for less than 2% of Chinese volumes. Between 2006 and 2017, domestic consumption grew by an average of 22% a year.'],
  ['> 95% Catimor, and Ethiopian resources','Catimor exceeds 95% of production. The Yunnan Academy of Agricultural Sciences has gathered more than 6,000 genetic resources from Ethiopia to diversify varieties.'],
  ['The Ruili gene bank','The Ministry of Agriculture’s coffee germplasm nursery, run by the Dehong institute in Ruili, passed 800 accessions at the end of 2023; it now holds more than 1,150, China’s largest collection. The local De-Re (德热) series comes from here.'],
  ['146,000 t, 31.6% premium','Yunnan’s output grew 13%. According to the Coffee Association of Yunnan, 31.6% of beans are graded premium and 80% are processed locally.'],
  ['China’s top exporter','Buoyed by record world prices, Yunnan exported 860 million yuan of coffee, more than 40% of China’s coffee exports. Dehong adopted a 2025 – 2027 quality action plan.'],
  ['Gems of Yunnan, pilot edition','144 coffees from seven regions competed.'],
  ['Gems of Yunnan 2026','169 coffees, 30 of them above 87 pts. Geisha dominates the ranking; a Catimor finished 12th (88.53).']],
 zh:[['朱苦拉：云南第一棵咖啡','法国传教士田德能（Alfred Liétard）在大理宾川朱苦拉的教堂周围种下咖啡树。各方资料记载的时间分别为 1892、1902 或 1904 年。村里至今仍有约二十棵百年老树。'],
  ['罗布斯塔传入海南','云南以外：罗布斯塔从马来亚被带到海南岛。而云南则始终是阿拉比卡的产区。'],
  ['瑞丽：铁皮卡与波旁从缅甸传入','景颇族边境官员将铁皮卡和波旁从缅甸引入德宏瑞丽的 Nongxianshan 村。'],
  ['保山走向规模化','1950 年代，保山潞江坝成为第一个成规模的产区，种植约 4000 公顷铁皮卡和波旁。'],
  ['S288 从印度引入','第一个抗叶锈病品种被引入云南。'],
  ['卡蒂姆的转折','在 1980 年代的公共项目（S288 和卡蒂姆）之后，雀巢与云南省政府合作，在全省推广卡蒂姆种植。1988 年是关键年份：中国政府、世界银行和联合国开发计划署共同启动了在云南建立现代咖啡产业的项目。如今中国 98% 的咖啡产自这里。'],
  ['后谷，速溶咖啡厂','后谷咖啡在德宏成立，成为中国最大的速溶咖啡生产商。它利用云南宽松的土地使用政策，通过订单农业整合地块：公司提供咖啡苗，农户采收，再由公司收购生豆。正是这一模式让云南先成为产量供应地，而不是风土产区。'],
  ['最早的精品批次','精品咖啡的生产大约从 2009 年开始，围绕少数先行者展开，其中包括孟连（普洱）Mangzhang Farms 的胡习香，并得到外国专业人士的协助。2013 年，Yunnan Coffee Traders 成为全省第一家专营精品咖啡的出口商。'],
  ['4.3 万公顷，90% 为卡蒂姆','CIFC 7963 品系占主导。2011 年全省咖啡产量为 53,240 吨。'],
  ['星巴克进驻普洱','云南咖啡种植者支持中心成立。2014 年前九个月，美国从中国进口的咖啡有一半以上由星巴克采购。'],
  ['普洱的咖啡交易中心','云南咖啡交易中心于 2016 年 1 月启用。同年约有一半的收成出口，创汇 2.8 亿美元——几乎全是运往欧洲的商业级生豆。2018 年，重庆成为全国最大的咖啡交易枢纽。'],
  ['中国成为 SCA 展会主题国','精品咖啡协会选择中国作为其展会（全球规模最大）的主题国。当时，精品咖啡在中国的产量中仍占不到 2%。2006 至 2017 年间，中国国内消费量年均增长 22%。'],
  ['卡蒂姆超过 95%，并引入埃塞俄比亚种质','卡蒂姆占产量的 95% 以上。云南省农业科学院已收集 6000 多份来自埃塞俄比亚的种质资源，用于品种多样化。'],
  ['瑞丽咖啡基因库','由德宏热带农业科学研究所管理的农业农村部瑞丽咖啡种质资源圃，到 2023 年底已收集 800 多份资源，如今超过 1150 份，是中国最大的咖啡种质库。本地“德热”系列品种即出自这里。'],
  ['14.6 万吨，精品率 31.6%','云南咖啡产量增长 13%。据云南省咖啡行业协会，精品率达 31.6%，精深加工率达 80%。'],
  ['全国第一大咖啡出口省','在国际咖啡价格创纪录的带动下，云南咖啡出口额达 8.6 亿元，占全国咖啡出口的 40% 以上。德宏发布 2025–2027 年咖啡产业高质量发展三年行动计划。'],
  ['Gems of Yunnan 试办届','来自七个产区的 144 支咖啡参赛。'],
  ['Gems of Yunnan 2026','169 支咖啡参赛，其中 30 支超过 87 分。瑰夏占据榜单主导，一支卡蒂姆位列第 12（88.53 分）。']]};
const REGIONS_L={
 en:{puer:['Pu’er','China’s largest growing area: about 60% of national production according to Wikipedia. Home to Starbucks’ Farmer Support Center (2012). At GoY 2026, two lots from Menglian and Lancang grow at 1,780 – 2,000 m.','Menglian is one of the province’s three main growing areas, with Baoshan and Dehong. It is there, at Mangzhang Farms, that the first specialty lots began around 2009, and it was at Pu’er that the Yunnan Coffee Exchange opened in January 2016. The area bridges Yunnan’s two faces: the volume that leaves for export, and the handful of farms aiming at the cup.'],
  baoshan:['Baoshan','Lujiang valley, along the Nu (Salween). The first area to scale up in the 1950s. It placed 7 of the top 15 lots at GoY 2026, including the only Catimor in the top 15.','The Lujiang valley follows the Nu (Salween): a warm valley floor, slopes that climb fast, and China’s oldest organised plantations — around 4,000 ha as early as the 1950s, in Typica and Bourbon. It is one of the province’s three main growing areas, and by far the most consistent in competition: seven of the top fifteen lots at Gems of Yunnan 2026, including the only Catimor near the top. It is also where Yunma’s coffees come from, at Gaosheng Manor.'],
  lincang:['Lincang','Crossed by the Tropic of Cancer. Won lot no. 1 at GoY 2026 (washed Geisha, 91.78) and no. 3 (Songfeng cooperative).','The Tropic of Cancer runs through the region: at this latitude altitude makes up for the season, and the placed lots grow around 1,600 – 1,900 m. It took both first and third place at Gems of Yunnan 2026, both washed Geishas — proof that the new wave is not playing out only in the south.'],
  dehong:['Dehong','Burmese border. Ruili was the gateway for Typica and Bourbon in 1914. Also high-altitude lots, such as Xiazhai (1,800 m) at GoY 2026. The Ruili institute keeps China’s largest coffee gene bank and bred the De-Re series.','The historic gateway: it was at Nongxianshan, near Ruili, that Typica and Bourbon crossed the Burmese border in 1914. It is also the region of volume: Hogood Coffee, founded in Dehong in 2007, built the instant-coffee supply chain here on plots consolidated under contract. And it is where diversification comes from, with the Ruili gene bank — more than 1,150 accessions, China’s largest coffee collection — and the local De-Re series. Dehong has adopted a 2025 – 2027 quality plan.'],
  xsbn:['Xishuangbanna','The far south of the province, around 22°N. A washed Geisha from Menghai took 2nd place at GoY 2026.','The far south of the province, around 22°N: the lowest latitude of coffee-growing Yunnan, so the hottest, where altitude becomes decisive. Menghai placed the second lot at Gems of Yunnan 2026, a washed Geisha at 1,650 m.'],
  nujiang:['Nujiang','Salween gorges. Varieties with little-documented local names are grown here, such as “Wangjin Yunka” (11th at GoY 2026).','The Salween gorges, at the northern edge of the coffee zone, around 26°N: the climatic limit of Arabica in Yunnan, where the relief creates very tight microclimates. Varieties with little-documented local names are grown here, such as “Wangjin Yunka”, eleventh at Gems of Yunnan 2026 — a reminder that the province’s orchard has not been fully mapped.'],
  dali:['Dali · Binchuan','The village of Zhukula, the historic cradle of coffee in Yunnan (1892 or 1904 depending on the source). Around twenty century-old trees still live there.','Zhukula, above Binchuan: this is where the French missionary Alfred Liétard planted Yunnan’s first coffee trees, on a date the sources put at 1892, 1902 or 1904. Around twenty century-old trees still live there. The region barely produces any more, but it holds the starting point: all Chinese coffee descends, symbolically, from that church.']},
 zh:{puer:['普洱','中国最大的咖啡产区：据维基百科约占全国产量的 60%。星巴克咖啡种植者支持中心（2012）所在地。在 GoY 2026 中，孟连和澜沧的两支咖啡生长于海拔 1780–2000 米。','孟连与保山、德宏并列为全省三大产区之一。最早的精品批次正是约 2009 年从孟连的 Mangzhang Farms 开始的，而云南咖啡交易中心也于 2016 年 1 月在普洱启用。这个产区连接着云南的两副面孔：出口的大宗产量，以及少数追求杯中品质的庄园。'],
  baoshan:['保山','怒江沿岸的潞江坝。1950 年代最早实现规模化的产区。在 GoY 2026 前 15 名中占 7 席，其中包括前 15 名中唯一的卡蒂姆。','潞江坝沿怒江（萨尔温江）展开：谷底炎热，山坡陡升，拥有中国最早成规模的种植园——1950 年代便已有约 4 000 公顷的铁皮卡和波旁。它是全省三大产区之一，也是比赛中最稳定的产区：Gems of Yunnan 2026 前十五名中占七席，包括榜单前列唯一的卡蒂姆。Yunma 的咖啡也来自这里的高晟庄园。'],
  lincang:['临沧','北回归线穿境而过。夺得 GoY 2026 第 1 名（水洗瑰夏，91.78 分）和第 3 名（Songfeng 合作社）。','北回归线穿过该产区：在这个纬度，海拔弥补了季节，入榜批次种植在约 1 600 – 1 900 米。它在 Gems of Yunnan 2026 中同时拿下第一和第三名，两支都是水洗瑰夏——说明新浪潮并不只发生在南部。'],
  dehong:['德宏','中缅边境。1914 年，铁皮卡和波旁经瑞丽传入。也有高海拔批次，如 GoY 2026 中的 Xiazhai（1800 米）。瑞丽的研究所拥有中国最大的咖啡种质库，并选育出“德热”系列。','历史上的入口：1914 年，铁皮卡和波旁正是在瑞丽附近的弄贤山越过中缅边境。这里也是产量的产区：2007 年在德宏成立的后谷咖啡，在订单整合的地块上建起了速溶咖啡的产业链。多样化同样从这里出发：瑞丽的种质库收藏逾 1 150 份资源，为中国最大的咖啡种质收集，并培育出本地的“德热”系列。德宏已制定 2025 – 2027 年质量行动计划。'],
  xsbn:['西双版纳','全省最南端，约北纬 22°。勐海的一支水洗瑰夏获得 GoY 2026 第 2 名。','全省最南端，约北纬 22°：云南咖啡区纬度最低、因而最炎热的地方，海拔在这里成为决定性因素。勐海在 Gems of Yunnan 2026 中获得第二名，是一支海拔 1 650 米的水洗瑰夏。'],
  nujiang:['怒江','怒江峡谷。这里种植一些记载很少的本地命名品种，如“Wangjin Yunka”（GoY 2026 第 11 名）。','怒江峡谷位于咖啡区北缘，约北纬 26°：这是阿拉比卡在云南的气候极限，地形造就了极为紧凑的小气候。这里种植一些记载很少的本地命名品种，如 Gems of Yunnan 2026 第十一名的“Wangjin Yunka”——提醒我们全省的咖啡版图尚未完全绘出。'],
  dali:['大理 · 宾川','朱苦拉村，云南咖啡的历史发源地（据不同资料为 1892 或 1904 年）。村中至今仍有约二十棵百年咖啡树。','宾川之上的朱苦拉：法国传教士田德能（Alfred Liétard）在这里种下云南第一批咖啡树，年份在不同资料中为 1892、1902 或 1904 年。村中至今仍有约二十棵百年咖啡树。该地区几乎已不再产出，但它保留着起点：所有中国咖啡在象征意义上都源自那座教堂。']}};

/* Clair ou sombre sur une couleur donnée : on prend celui des deux qui
   contraste le plus, par la luminance relative. */
function surFond(hex){
  const v=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255)
    .map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);
  const L=.2126*v[0]+.7152*v[1]+.0722*v[2];
  return (1.05/(L+.05))>=((L+.05)/.05)?'#fbfaf7':'#1c1c1a';
}

const LEG={fr:['Fleur','Coupe du fruit','Grain, face plane et face bombée','Feuille et nervation','','cm','','Pl.'],
 en:['Flower','Fruit section','Bean, flat and rounded faces','Leaf and venation','','cm','','Pl.'],

/* ---------- primitives ---------- */
function leaf(cx,cy,len,wid,ang,R,o){
  const n=40,ph=R()*6,bend=o.bend,wav=o.wav;
  const ss=(a,b,x)=>{const q=Math.max(0,Math.min(1,(x-a)/(b-a)));return q*q*(3-2*q)};
  const w=t=>wid*Math.pow(Math.sin(Math.PI*Math.pow(t,.92)),.78)*(1-.42*ss(.7,1,t))*(1+wav*Math.sin(t*Math.PI*9+ph));
  const m=t=>bend*len*.085*Math.sin(Math.PI*t);
  const top=[],bot=[],rib=[];
  for(let i=0;i<=n;i++){const t=i/n,x=t*len;top.push(rot([x,m(t)-w(t)],ang,cx,cy));bot.push(rot([x,m(t)+w(t)*.94],ang,cx,cy));rib.push(rot([x,m(t)],ang,cx,cy))}
  const ribR=rib.slice().reverse();
  const id='bl'+(GU++);
  const out=P(top.concat(bot.slice().reverse()))+'Z';
  let wash=`<path d="${P(top.concat(ribR))}Z" fill="${o.col[0]}"/><path d="${P(bot.concat(ribR))}Z" fill="${o.col[1]}"/>`;
  /* reflet brillant */
  const gl=[];for(let i=5;i<=27;i++){const t=i/n;gl.push(rot([t*len,m(t)-w(t)*.45],ang,cx,cy))}
  wash+=`<path d="${P(gl)}" stroke="${mixc(o.col[0],'#fffbe8',.45)}" stroke-width="${f(wid*.22)}" stroke-linecap="round" opacity=".5" fill="none"/>`;
  let ink=`<clipPath id="${id}"><path d="${P(bot.concat(ribR))}Z"/></clipPath>`;
  /* hachures de gravure sur la moitié ombrée */
  let h='';for(let t=.05;t<.96;t+=.026){const t2=Math.min(.99,t+.06),a=rot([t*len,m(t)+.6],ang,cx,cy),b=rot([t2*len,m(t2)+w(t2)],ang,cx,cy);h+=`M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}`}
  ink+=`<path d="${h}" clip-path="url(#${id})" stroke="${INK}" stroke-width=".26" opacity=".32" fill="none"/>`;
  /* nervures */
  let v='';const nv=o.veins;for(let i=1;i<=nv;i++){const t0=.05+i/(nv+1)*.88,t1=Math.min(.97,t0+.12);for(const sg of[-1,1]){const a=rot([t0*len,m(t0)],ang,cx,cy),c=rot([(t0+.045)*len,m(t0)+sg*w(t0)*.5],ang,cx,cy),b=rot([t1*len,m(t1)+sg*w(t1)*.84],ang,cx,cy);v+=`M${f(a[0])} ${f(a[1])}Q${f(c[0])} ${f(c[1])} ${f(b[0])} ${f(b[1])}`}}
  ink+=`<path d="${v}" stroke="${INK}" stroke-width=".38" opacity=".7" fill="none"/>`;
  const pe=rot([-len*.07,0],ang,cx,cy);
  ink+=`<path d="${out}" stroke="${INK}" stroke-width=".62" stroke-linejoin="round" fill="none"/><path d="${P(rib.slice(0,n-1))}M${f(cx)} ${f(cy)}L${f(pe[0])} ${f(pe[1])}" stroke="${INK}" stroke-width=".7" fill="none"/>`;
  /* rouille : pustules orangées */
  if(o.rust){for(let k=0;k<o.rust;k++){const t=.25+R()*.55,sg=R()<.6?-1:1,p=rot([t*len,m(t)+sg*w(t)*(.25+R()*.45)],ang,cx,cy),r=1.4+R()*2.2;
    wash+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r*1.5)}" fill="#d6b45a" opacity=".55"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r)}" fill="#c47a2a" opacity=".85"/>`;
    let d='';for(let j=0;j<10;j++){const a=R()*6.28,q=R()*r;d+=`M${f(p[0]+Math.cos(a)*q)} ${f(p[1]+Math.sin(a)*q)}h.3`}ink+=`<path d="${d}" stroke="${INK}" stroke-width=".45" stroke-linecap="round" opacity=".6"/>`}}
  return{wash,ink}}

function cherry(x,y,r,e,a,col,o){
  const g=o.grad(col);
  let wash=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(r)}" ry="${f(r*e)}" transform="rotate(${f(a*57.3)} ${f(x)} ${f(y)})" fill="url(#${g})"/>`;
  const hl=rot([-r*.35,-r*e*.38],a,x,y);wash+=`<ellipse cx="${f(hl[0])}" cy="${f(hl[1])}" rx="${f(r*.22)}" ry="${f(r*.14)}" fill="#fff" opacity=".55" transform="rotate(${f(a*57.3-30)} ${f(hl[0])} ${f(hl[1])})"/>`;
  const tp=rot([0,r*e*.86],a,x,y);
  let ink=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(r)}" ry="${f(r*e)}" transform="rotate(${f(a*57.3)} ${f(x)} ${f(y)})" stroke="${INK}" stroke-width=".5" fill="none"/>`;
  ink+=`<circle cx="${f(tp[0])}" cy="${f(tp[1])}" r="${f(Math.max(.7,r*.2))}" fill="${mixc(col,'#1d1712',.5)}" stroke="${INK}" stroke-width=".35"/>`;
  /* ombre propre : quelques traits courbes */
  const sh=[];for(let i=0;i<=8;i++){const t=-.2+i/8*1.6;sh.push(rot([Math.cos(t)*r*.82,Math.sin(t)*r*e*.82],a,x,y))}
  ink+=`<path d="${P(sh)}" stroke="${INK}" stroke-width=".3" opacity=".45" fill="none"/>`;
  let d='';const nd=Math.round(r*r*.9);for(let i=0;i<nd;i++){const t=o.R()*1.9-.3,q=.45+o.R()*.5,p=rot([Math.cos(t)*r*q,Math.sin(t)*r*e*q],a,x,y);d+=`M${f(p[0])} ${f(p[1])}h.25`}
  ink+=`<path d="${d}" stroke="${INK}" stroke-width=".42" stroke-linecap="round" opacity=".5"/>`;
  return{wash,ink}}

function flower(x,y,s,a,k,n,R){
  let p='';for(let i=0;i<n;i++){const t=i/n*Math.PI*2+R()*.15;const c=[Math.cos(t)*s*.55,Math.sin(t)*s*.55];p+=`<ellipse cx="${f(c[0])}" cy="${f(c[1])}" rx="${f(s*.52)}" ry="${f(s*.17)}" transform="rotate(${f(t*57.3)} ${f(c[0])} ${f(c[1])})" fill="#fbf7ee" stroke="${INK}" stroke-width=".4"/>`}
  let st='';for(let i=0;i<n;i++){const t=(i+.5)/n*Math.PI*2;st+=`M0 0L${f(Math.cos(t)*s*.42)} ${f(Math.sin(t)*s*.42)}`}
  return `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(a*57.3)}) scale(1 ${f(k)})">${p}<path d="${st}" stroke="${INK}" stroke-width=".35"/><circle r="${f(s*.13)}" fill="#e7dcb8" stroke="${INK}" stroke-width=".35"/></g>`}
function bud(x,y,s,a){return `<ellipse cx="${f(x)}" cy="${f(y)}" rx="${f(s*.18)}" ry="${f(s*.5)}" transform="rotate(${f(a*57.3)} ${f(x)} ${f(y)})" fill="#f3f0dc" stroke="${INK}" stroke-width=".4"/>`}

/* ---------- figures annexes ---------- */
function figSection(x,y,tr,col){
  const R=Math.min(22,12+6*tr.fs),e=Math.min(1.3,tr.fe);let s='';
  s+=`<ellipse cx="${x}" cy="${y}" rx="${f(R)}" ry="${f(R*e)}" fill="${col}"/>`;
  s+=`<ellipse cx="${x}" cy="${y}" rx="${f(R-1.8)}" ry="${f(R*e-1.8)}" fill="#efe2c2"/>`;
  const bw=R*.5,bh=R*e*.78;
  for(const sg of[-1,1]){s+=`<path d="M${f(x+sg*.7)} ${f(y-bh)}A${f(bw)} ${f(bh)} 0 0 ${sg>0?1:0} ${f(x+sg*.7)} ${f(y+bh)}Z" fill="#cdc59b" stroke="${INK}" stroke-width=".45"/>`;
    s+=`<path d="M${f(x+sg*(bw*.45+.7))} ${f(y-bh*.75)}Q${f(x+sg*(bw*.62+.7))} ${f(y)} ${f(x+sg*(bw*.45+.7))} ${f(y+bh*.75)}" stroke="${INK}" stroke-width=".3" fill="none" opacity=".6"/>`;
    s+=`<path d="M${f(x+sg*(bw+1.5))} ${f(y-bh*.9)}A${f(bw+1.4)} ${f(bh+1)} 0 0 ${sg>0?1:0} ${f(x+sg*(bw+1.5))} ${f(y+bh*.9)}" stroke="${INK}" stroke-width=".3" fill="none" stroke-dasharray="1 1.2"/>`}
  let h='';for(let i=0;i<24;i++){const t=i/24*Math.PI*2;h+=`M${f(x+Math.cos(t)*(R-3.2))} ${f(y+Math.sin(t)*(R*e-3.2))}L${f(x+Math.cos(t)*(R-1.9))} ${f(y+Math.sin(t)*(R*e-1.9))}`}
  s+=`<path d="${h}" stroke="${INK}" stroke-width=".25" opacity=".5"/><ellipse cx="${x}" cy="${y}" rx="${f(R)}" ry="${f(R*e)}" stroke="${INK}" stroke-width=".55" fill="none"/>`;
  return s}
function figBeans(x,y,tr){
  const b=Math.min(9.5,6.6*tr.bean),e=1.3*Math.min(1.25,tr.fe/1.1);let s='';
  const c='#b7b38a';
  s+=`<ellipse cx="${f(x-b-3)}" cy="${y}" rx="${f(b)}" ry="${f(b*e)}" fill="${c}" stroke="${INK}" stroke-width=".5"/>`;
  s+=`<path d="M${f(x-b-3)} ${f(y-b*e*.82)}C${f(x-b-1.2)} ${f(y-b*e*.3)} ${f(x-b-4.8)} ${f(y+b*e*.3)} ${f(x-b-3)} ${f(y+b*e*.82)}" stroke="${INK}" stroke-width=".55" fill="none"/>`;
  s+=`<ellipse cx="${f(x+b+3)}" cy="${y}" rx="${f(b)}" ry="${f(b*e)}" fill="${mixc(c,'#ffffff',.18)}" stroke="${INK}" stroke-width=".5"/>`;
  let h='';for(let i=0;i<8;i++){const t=.15+i/7*1.1,xx=x+b+3+Math.sin(t)*b*.92,hh=b*e*Math.cos(t)*.92;h+=`M${f(xx)} ${f(y-hh)}L${f(xx)} ${f(y+hh)}`}
  s+=`<path d="${h}" stroke="${INK}" stroke-width=".28" opacity=".55"/>`;
  return s}
/* Figure 4 — une feuille détachée.
   La vignette précédente (silhouette de l'arbre et bonhomme bâton) jurait
   avec le reste de la planche : un gribouillis au milieu d'une gravure. La
   feuille, elle, sort de la même primitive que le rameau, et dit tout
   autant de la variété — longueur, largeur, ondulation du limbe, nombre de
   nervures, teinte du revers. */
function figLeaf(x,y,tr,R,L){
  const sc=Math.min(1.25,tr.L),ln=72*sc,wd=ln*tr.wr*.64;
  const g=leaf(x-ln*.46,y-6,ln,wd,.2,R,{bend:.5,wav:tr.wav||0,col:LEAF[tr.lf],
    veins:tr.lf==='rob'||tr.lf==='lib'?11:9,rust:0,uid:0});
  const cm=Math.round(12*sc*(tr.lf==='lib'?1.6:1));
  const lab=`<text x="${f(x)}" y="${f(y+32)}" font-size="5" text-anchor="middle" fill="${INK}" opacity=".8">≈ ${cm} ${L.t[5]}</text>`;
  return{wash:g.wash,ink:g.ink+lab}}

/* ---------- planche complète ---------- */
const cache={};
function plate(n,lang){
  const ck=n.id+'|'+lang;if(cache[ck])return cache[ck];
  const tr=Object.assign({},D,T[n.id]||{});const t=LEG[lang]||LEG.fr;
  const seed=[...n.id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,17);const R=rng(seed);
  const pid='b'+n.id;let uid=0;const grads={};let defs='';
  const grad=col=>{if(grads[col])return grads[col];const id=pid+'g'+Object.keys(grads).length;grads[col]=id;
    defs+=`<radialGradient id="${id}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="${mixc(col,'#fff4e0',.42)}"/><stop offset=".55" stop-color="${col}"/><stop offset="1" stop-color="${mixc(col,'#120c08',.45)}"/></radialGradient>`;return id};
  const O={uid:0};const nextId=()=>pid+'k'+(uid++);
  let W1='',I1='',W2='',I2='',W3='',CI='';const lcol=LEAF[tr.lf];
  /* rameau principal : courbe en S, entre-nœuds courts pour les variétés naines */
  const p0=[34,240],c1=[58,150],c2=[128,70],p3=[226,58];
  const bz=t=>{const u=1-t;return[u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]]};
  const tan=t=>{const a=bz(Math.max(0,t-.01)),b=bz(Math.min(1,t+.01));return Math.atan2(b[1]-a[1],b[0]-a[0])};
  const sw=t=>3.4-2.5*t;const L=[],Rt=[];
  for(let i=0;i<=40;i++){const t=i/40,p=bz(t),a=tan(t)+Math.PI/2,w=sw(t)/2;L.push([p[0]+Math.cos(a)*w,p[1]+Math.sin(a)*w]);Rt.push([p[0]-Math.cos(a)*w,p[1]-Math.sin(a)*w])}
  const stemD=P(L.concat(Rt.reverse()))+'Z';
  const sc=Math.min(1.22,tr.L),ln=62*sc,wd=ln*tr.wr*.56;
  const nN=Math.round(5/tr.inter);const nodes=[];for(let i=0;i<nN;i++)nodes.push(.1+.78*i/(nN-1));
  const leafO=(col,extra)=>Object.assign({bend:0,wav:tr.wav,col,veins:tr.lf==='rob'||tr.lf==='lib'?11:9,rust:0,uid:0},extra);
  const back=[],front=[];
  const under=1+Math.floor(R()*(nN-2));
  nodes.forEach((t,i)=>{const p=bz(t),a=tan(t),k=(1-.22*t)*(.88+R()*.22),al=(42+R()*30)*Math.PI/180;
    for(const sg of[-1,1]){let rust=0;if(tr.rust&&i===1&&sg>0)rust=tr.rust;
      const fore=(i%2===0)===(sg>0)?1:.8+R()*.1;
      const isU=i===under&&sg<0;const ucol=[mixc(lcol[0],'#e9e4c4',.42),mixc(lcol[1],'#e9e4c4',.38)];
      const o=leafO(isU?ucol:lcol,{bend:sg*(.15+R()*.75)*(isU?1.6:1),rust});o.uid=0;
      let la=a+sg*al;la=la+(Math.PI/2-la)*.18*(sg>0?1:.6);const g=leaf(p[0],p[1],ln*k*fore,wd*k*fore,la,R,Object.assign(o,{uid:0}));
      (sg<0?back:front).push(g)}});
  /* pousse terminale : jeunes feuilles (bronze ou vertes) */
  {const p=bz(1),a=tan(1),yc=YOUNG[tr.tip];for(const sg of[-1,1]){front.push(leaf(p[0],p[1],ln*.42,wd*.36,a+sg*.55,R,leafO(yc,{bend:sg*.3,veins:5})))}}
  const fix=s=>s;
  back.forEach(g=>{W1+=g.wash;I1+=fix(g.ink)});
  W1+=`<path d="${stemD}" fill="#8b7458"/>`;
  let lent='';for(let i=0;i<14;i++){const tt=.03+R()*.5,p=bz(tt);lent+=`M${f(p[0]-.8)} ${f(p[1])}h1.4`}
  I1+=`<path d="${stemD}" stroke="${INK}" stroke-width=".55" fill="none"/><path d="${lent}" stroke="${INK}" stroke-width=".35" opacity=".6"/>`;
  nodes.forEach(t=>{const p=bz(t);I1+=`<ellipse cx="${f(p[0])}" cy="${f(p[1])}" rx="${f(sw(t)*.62)}" ry="${f(sw(t)*.42)}" fill="#7a644b" stroke="${INK}" stroke-width=".4"/>`});
  front.forEach(g=>{W2+=g.wash;I2+=fix(g.ink)});
  /* glomérules de fruits sur le vieux bois, fleurs vers l’extrémité */
  const fr=tr.fr.map(k=>FR[k]);const r0=4.5*Math.min(1.45,tr.fs);let C=[];
  nodes.forEach((t,i)=>{if(t>.7)return;const p=bz(t),a=tan(t);const nc=tr.nc+Math.round(R()*2-1);
    for(let j=0;j<nc;j++){const dense=nc>8,ring=dense&&j>=7?1:0;const ang=dense?(j/(ring?nc-7:7))*Math.PI*2+ring*.4+(R()-.5)*.4:a+Math.PI/2*(j%2?1:-1)+(R()-.5)*1.3,d=dense?r0*(1.05+ring*.95)+R()*r0*.25:r0*(.8+R()*.9);
      const x=p[0]+Math.cos(ang)*d,y=p[1]+Math.sin(ang)*d;const q=R();
      const col=q<.12&&tr.fr[0]!=='black'?UNRIPE:q<.24?(tr.fr[0]==='black'?'#6a2a33':SEMI):fr[Math.floor(R()*fr.length)];
      C.push([y,x,r0*(.86+R()*.24),ang+Math.PI/2,col])}});
  C.sort((a,b)=>a[0]-b[0]).forEach(([y,x,r,a,col])=>{const c=cherry(x,y,r,tr.fe,a,col,{grad,R});W3+=c.wash;CI+=c.ink});
  let FL='';const fn=nodes.filter(t=>t>.7);
  fn.forEach((t,i)=>{if(i>=tr.flw)return;const p=bz(t),a=tan(t);for(let j=0;j<4;j++){const ang=a+(j%2?1:-1)*(1+R()*.8),d=5+R()*5,x=p[0]+Math.cos(ang)*d,y=p[1]+Math.sin(ang)*d;
    FL+=j===3?bud(x,y,7,ang+Math.PI/2):flower(x,y,6.2,R()*3,.55+R()*.4,tr.pet,R)}});
  /* figures numérotées */
  const fx=286,fy=50,col0=fr[0];
  const sec=figSection(354,fy+6,tr,col0);
  const fl=flower(fx+4,fy+6,17,.3,1,tr.pet,R);
  const bn=figBeans(320,128,tr);
  const hb=figLeaf(330,198,tr,R,{t,uid:0});
  const num=(x,y,k)=>`<text x="${x}" y="${y}" font-size="6.5" font-style="italic" fill="${INK}">${k}</text>`;
  /* papier, cadre, titres */
  const sci=n.g==='rob'&&n.id!=='can'?'Coffea canephora':tr.sp;
  const latin=/^Coffea|^C\. /.test(n.n)?n.n:`${sci} — ${n.n}`;
  const plN=NODES.indexOf(n)+1;
  defs+=`<filter id="${pid}w" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="${seed&255}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>`;
  defs+=`<filter id="${pid}p"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .42 0 0 0 0 .34 0 0 0 0 .24 0 0 0 .11 0"/></filter>`;

  d:'Troisième espèce cultivée. Elle a transmis à certaines lignées indiennes (S288) un gène de résistance à la rouille.',s:['wcr_cat']},
 {id:'cong',n:'Coffea congensis',g:'esp',y:-610000,yl:'espèce',pl:'Bassin du Congo',th:62,r:330,imp:1,
  d:'Espèce proche du Robusta, des berges du Congo. Parent de l’hybride indien CxR.',s:['cxr']},
 {id:'ara',n:'Coffea arabica',g:'orig',y:-350000,yl:'il y a 350 000 à 610 000 ans',pl:'Forêts d’Éthiopie',th:0,r:0,imp:3,p:[['can','origine'],['eug','origine']],
  d:'Né d’une hybridation naturelle entre C. canephora et C. eugenioides, il a hérité de deux jeux de chromosomes de chaque parent (allotétraploïde). L’étude génomique publiée dans Nature Genetics en 2024 situe l’événement entre 350 000 et 610 000 ans, avant l’apparition d’Homo sapiens. Plusieurs goulets d’étranglement ont ensuite réduit sa diversité génétique, d’où sa fragilité face aux maladies.',s:['natgen','sd','gcr']},
 {id:'eth',n:'Populations d’Éthiopie',alt:'sauvages & landraces',g:'eth',y:-30500,yl:'il y a ≈ 30 500 ans',pl:'Sud-ouest de l’Éthiopie',th:165,r:80,imp:2,p:[['ara','filiation']],
  d:'Vers 30 500 ans, les populations sauvages se séparent des ancêtres des variétés cultivées (Salojärvi et al., 2024). Les forêts éthiopiennes restent le grand réservoir de diversité de l’Arabica : c’est là qu’ont été collectés Gesha, Java (population Abyssinia) ou Rume Sudan.',s:['natgen']},
 {id:'yem',n:'Arabica du Yémen',g:'orig',y:1450,yl:'≈ XVe siècle',pl:'Yémen',th:225,r:70,imp:2,p:[['eth','introduction']],
  d:'Premier grand foyer de culture hors d’Éthiopie. Les génomes publiés en 2024 ramènent Bourbon, Typica et les cultivars indiens à une origine commune au Yémen. Ce goulet génétique explique pourquoi la plupart des variétés cultivées se ressemblent tant.',s:['gcr','natgen']},
 {id:'ind',n:'Cultivars indiens',alt:'les « sept graines »',g:'typ',y:1600,yl:'≈ 1600 (tradition)',pl:'Monts Baba Budan, Inde',th:200,r:130,imp:1,p:[['yem','introduction']],
  d:'Selon la tradition, le moine Baba Budan aurait sorti sept graines du Yémen vers 1600. C’est le point de départ des Arabica indiens, puis de la lignée Typica diffusée par les Hollandais.',s:['nm']},
 {id:'typ',n:'Typica',g:'typ',y:1700,yl:'1696 – 1720',pl:'Inde → Java → Amsterdam → Paris → Antilles',th:240,r:150,imp:3,p:[['ind','introduction']],
  d:'Les Hollandais emportent des plants d’Inde vers Java à la fin du XVIIe siècle, puis au jardin botanique d’Amsterdam. Un plant offert à Louis XIV en 1714 est à l’origine des caféiers des Antilles et d’Amérique latine. Grand arbre, faible rendement, très sensible à la rouille, mais une tasse fine et propre.',
  yun:'L’une des deux variétés historiques du Yunnan : plantée à Ruili dès 1914 depuis la Birmanie, puis à Baoshan dans les années 1950. À Baoshan, les « anciennes variétés » désignent Typica et Bourbon.',s:['wcr_cat','varzea','yex']},
 {id:'bou',n:'Bourbon',g:'bou',y:1715,yl:'≈ 1708 – 1718',pl:'Île Bourbon (La Réunion)',th:292,r:150,imp:3,p:[['yem','introduction']],
  d:'Graines rapportées du Yémen par les Français sur l’île Bourbon au début du XVIIIe siècle, puis diffusées en Afrique de l’Est et au Brésil au XIXe. Plus productif que Typica, tasse ronde et sucrée, sensible à la rouille.',
  yun:'Avec Typica, l’autre variété d’origine du Yunnan (Ruili 1914, Baoshan années 1950). Les sources ne s’accordent pas sur la variété plantée à Zhukula.',s:['wcr_cat','varzea']},
 {id:'mar',n:'Maragogipe',g:'typ',y:1870,yl:'1870',pl:'Maragogipe, Bahia (Brésil)',th:220,r:235,imp:1,p:[['typ','mutation']],
  d:'Mutation naturelle de Typica aux grains géants, au rendement faible. Parent du Pacamara.',s:['coffeehunter']},
 {id:'cat',n:'Caturra',g:'bou',y:1915,yl:'≈ 1915 – 1918',pl:'Minas Gerais (Brésil)',th:308,r:215,imp:3,p:[['bou','mutation']],
  d:'Mutation naine de Bourbon : plant compact, plantation dense, fort rendement. Elle devient la base de la caféiculture intensive d’Amérique centrale, et le parent des Catimor et du Catuaí.',
  yun:'Citée parmi les variétés présentes au Yunnan (Sucafina). Surtout, c’est la mère du Catimor qui couvre aujourd’hui la province.',s:['wcr_cat','sucafina','ozone_cat']},
 {id:'kent',n:'Kent',g:'typ',y:1920,yl:'≈ années 1920',pl:'Inde du Sud',th:200,r:215,imp:1,p:[['ind','selection']],
  d:'Sélection indienne apparentée à Typica, longtemps appréciée pour sa tolérance à la rouille. Parent de S795.',s:['wcr_cat','pue']},
 {id:'hdt',n:'Hybride de Timor',alt:'HdT',g:'intro',y:1927,yl:'1927',pl:'Île de Timor',th:12,r:200,imp:3,p:[['typ','origine'],['can','introgression']],
  d:'Arbre découvert en 1927 dans une plantation de Typica : un croisement spontané Arabica × Robusta, quasi immunisé contre la rouille. Le CIFC (Portugal) en reçoit des graines en 1958-59. C’est le pont génétique entre les deux espèces, et la source des gènes de résistance de la plupart des variétés modernes.',s:['wcr_t8667','ozone_cat']},
 {id:'java',n:'Java',alt:'Abyssinia',g:'eth',y:1928,yl:'XIXe s. ou 1928 (sources divergentes)',pl:'Éthiopie → Java → Cameroun → Costa Rica (1991)',th:183,r:195,imp:2,p:[['eth','selection']],
  d:'Longtemps prise pour un Typica, elle est en réalité issue d’une population de landrace éthiopienne appelée Abyssinia (empreinte génétique). Sélectionnée au Cameroun pour sa tolérance partielle à l’anthracnose des baies, introduite au Costa Rica en 1991. Profil floral proche du Gesha.',s:['sey','helena']},
 {id:'sl28',n:'SL28',g:'bou',y:1931,yl:'1931',pl:'Scott Agricultural Laboratories, Kenya',th:298,r:290,imp:2,p:[['bou','selection']],
  d:'Sélectionnée à partir de l’arbre « Tanganyika Drought Resistant », génétiquement liée à Bourbon. Acidité vive (cassis, agrumes), la signature des cafés kényans. Sensible à la rouille.',s:['wcr_cat']},
 {id:'sl34',n:'SL34',g:'typ',y:1935,yl:'années 1930',pl:'Kenya (Loresho, Kabete)',th:252,r:268,imp:1,p:[['typ','selection']],
  d:'Autre sélection des Scott Laboratories, adaptée aux zones d’altitude humides. Rattachée génétiquement au groupe Typica.',
  yun:'Citée par Sucafina parmi les Arabica courants en Chine.',s:['wcr_cat','sucafina']},
 {id:'s288',n:'S288',g:'intro',y:1935,yl:'années 1930 (≈)',pl:'Inde (CCRI)',th:128,r:235,imp:2,p:[['ind','selection'],['lib','introgression']],
  d:'Sélection indienne issue d’un hybride naturel Arabica × Liberica. Elle porte un gène de résistance à la rouille hérité de C. liberica.',
  yun:'Introduite au Yunnan depuis l’Inde (1963 selon une source), puis diffusée dans les années 1980 comme variété résistante. Le Catimor, bien plus productif, l’a ensuite supplantée.',s:['varzea','woc','pue']},
 {id:'gesha',n:'Gesha',alt:'Geisha',g:'eth',y:1936,yl:'collectée dans les années 1930',pl:'Gesha (Éthiopie) → Kenya, Tanzanie → CATIE, Costa Rica (1953) → Panama',th:165,r:250,imp:3,p:[['eth','selection']],
  d:'Landrace éthiopienne collectée dans les années 1930, conservée au CATIE (Costa Rica) puis plantée au Panama. Révélée en 2004 par la Hacienda La Esmeralda : notes de jasmin et de bergamote, prix records.',
  yun:'La variété phare de la nouvelle vague du Yunnan. Au Gems of Yunnan 2026, 13 des 15 premiers lots sont des Geisha (dont « Huixun Geisha » et « Geisha 1931 »), et la 1re place revient à un Geisha lavé de Lincang (91,78 pts).',s:['wcr_cat','ace']},
 {id:'rume',n:'Rume Sudan',g:'eth',y:1942,yl:'≈ années 1940 (position indicative)',pl:'Plateau de Boma (Soudan du Sud)',th:145,r:220,imp:1,p:[['eth','selection']],
  d:'Landrace semi-sauvage proche des populations éthiopiennes, précieuse pour sa diversité génétique. Parent de l’hybride F1 Centroamericano (H1).',s:['ozone_h1']},
 {id:'mnov',n:'Mundo Novo',g:'bou',y:1943,yl:'années 1940',pl:'São Paulo (Brésil)',th:265,r:230,imp:2,p:[['typ','origine'],['bou','origine']],
  d:'Croisement naturel entre un Typica (« Sumatra ») et un Bourbon rouge. Vigoureux et productif, c’est un pilier du Brésil et le parent du Catuaí.',s:['sm']},
 {id:'s795',n:'S795',alt:'Jember',g:'intro',y:1945,yl:'années 1940',pl:'Inde (CCRI) → Indonésie (1955)',th:118,r:300,imp:1,p:[['kent','croisement'],['s288','croisement']],
  d:'Croisement Kent × S288 du Central Coffee Research Institute indien. Connu sous le nom de « Jember » en Indonésie, où il arrive en 1955.',s:['pue']},
 {id:'pacas',n:'Pacas',g:'bou',y:1949,yl:'1949',pl:'El Salvador',th:320,r:250,imp:1,p:[['bou','mutation']],
  d:'Mutation naine de Bourbon repérée sur la ferme de la famille Pacas.',s:['coffeehunter']},
 {id:'vsar',n:'Villa Sarchi',g:'bou',y:1952,yl:'≈ années 1950',pl:'Sarchí (Costa Rica)',th:340,r:245,imp:1,p:[['bou','mutation']],
  d:'Mutation naine de Bourbon, adaptée à l’altitude et au vent. Parent de la famille Sarchimor.',s:['wcr_cat']},
 {id:'pcm',n:'Pacamara',g:'bou',y:1958,yl:'1958 (croisement)',pl:'ISIC, El Salvador',th:238,r:322,imp:2,p:[['pacas','croisement'],['mar','croisement']],
  d:'Croisement Pacas × Maragogipe créé par l’institut salvadorien de recherche sur le café : gros grains, tasse très expressive, habitué des compétitions. World Coffee Research la dit capable d’une qualité exceptionnelle en tasse, et prévient dans le même temps qu’elle n’est pas homogène : les plants ne se reproduisent pas à l’identique d’une génération à l’autre.',
  yun:'Présente au Yunnan, mais en marge : sur des parcelles d’essai et dans quelques anciennes fermes de spécialité, pas dans le verger de production. En 2020, Yunnan Coffee Traders — le premier exportateur de spécialité de la province — disait en cultiver sur ses parcelles de recherche, aux côtés de Bourbon, là où le Typica peinait. Elle n’apparaît dans aucun des quinze premiers lots du Gems of Yunnan 2026, où le Geisha tient ce rôle. La date de son arrivée dans la province n’est pas documentée en source ouverte. C’est la variété du lot que Yunma rapporte de Yun Lan Estate, à Xishuangbanna, entre 1 600 et 1 800 m — une ferme fondée en 1999, parmi les plus anciennes de la spécialité au Yunnan, qui cultive plus de vingt variétés.',s:['coffeehunter','wcr_pcm','pdg_chine']},
 {id:'catimor',n:'Catimor',g:'intro',y:1959,yl:'1959',pl:'CIFC, Oeiras (Portugal)',th:345,r:292,imp:3,p:[['cat','croisement'],['hdt','introgression']],
  d:'Caturra rouge (CIFC 19/1) × Hybride de Timor (CIFC 832/1). Ce n’est pas une variété mais une famille de lignées sélectionnées localement (T8667, Costa Rica 95, Lempira, Catisic, Oro Azteca…). Compact, très productif, résistant à la rouille. Sa tasse a la réputation d’être moyenne à basse altitude.',
  yun:'Plus de 95 % de la production du Yunnan. Introduit par un programme public dans les années 1980, il a été généralisé avec Nestlé à partir de 1988. En 2011, la lignée CIFC 7963 couvrait ≈ 90 % des 43 000 ha. Il peut aussi briller : au Gems of Yunnan 2026, un Catimor naturel de Baoshan (Tiantian Manor) se classe 12e avec 88,53 pts.',s:['wcr_t8667','ozone_cat','chinadaily','varzea','woc','ace']},
 {id:'sarch',n:'Sarchimor',g:'intro',y:1965,yl:'à partir des années 1960 (≈)',pl:'CIFC → Amérique latine',th:5,r:302,imp:2,p:[['vsar','croisement'],['hdt','introgression']],
  d:'Villa Sarchi × Hybride de Timor : la famille « sœur » du Catimor, d’où viennent T5296, Marsellesa, Obatã ou Parainema.',s:['coffeehunter','wcr_star']},
 {id:'ctu',n:'Catuaí',g:'bou',y:1972,yl:'croisé en 1949 · diffusé en 1972',pl:'IAC, Campinas (Brésil)',th:282,r:302,imp:2,p:[['mnov','croisement'],['cat','croisement','Caturra jaune']],
  d:'Mundo Novo × Caturra jaune. Compact, productif, résistant au vent : l’une des variétés les plus plantées d’Amérique latine.',s:['coffeehunter']},
 {id:'castillo',n:'Castillo',g:'intro',y:2005,yl:'2005',pl:'Cenicafé (Colombie)',th:333,r:345,imp:1,p:[['vcol','selection']],
  d:'Cinquième génération de sélection de la Variedad Colombia (Caturra × Hybride de Timor), développée par Cenicafé et diffusée après vingt-trois ans de travaux. Cenicafé en a tiré six formes régionales — El Rosario, Naranjal, Paraguaicito, La Trinidad, Pueblo Bello, Santa Bárbara — pour ne pas replanter tout le pays avec un seul profil génétique. Selon le centre, elle représente 45 % du café colombien. Elle a largement remplacé Typica et Bourbon en Colombie.',s:['bh','ozone_cat']},
 {id:'mars',n:'Marsellesa',g:'intro',y:2005,yl:'années 2000 (≈)',pl:'ECOM / CIRAD (Nicaragua)',th:18,r:338,imp:1,p:[['sarch','selection']],
  d:'Sarchimor de nouvelle génération (HdT 832/2 × Villa Sarchi CIFC 971/10), résistante à la rouille. Parent de Starmaya.',s:['wcr_star']},
 {id:'h1',n:'Centroamericano',alt:'H1',g:'f1',y:2010,yl:'2010',pl:'CIRAD, PROMECAFE, CATIE (Amérique centrale)',th:27,r:385,imp:2,p:[['sarch','croisement','T5296'],['rume','croisement']],
  d:'Hybride F1 : Sarchimor T5296 × Rume Sudan. Grâce à la vigueur hybride, il produit 22 à 47 % de plus que les variétés témoins. Résistant à la rouille, il atteint la qualité de spécialité (2e au Cup of Excellence Nicaragua). Il se multiplie par clonage.',s:['ozone_h1']},
 {id:'star',n:'Starmaya',g:'f1',y:2019,yl:'2019 (semences)',pl:'ECOM & CIRAD (Nicaragua)',th:38,r:365,imp:2,p:[['mars','croisement'],['eth','croisement','parent mâle-stérile']],
  d:'Premier hybride F1 d’Arabica multipliable par graines, grâce à un parent naturellement mâle-stérile croisé avec Marsellesa. Ses plants coûtent deux fois moins cher à produire qu’en multiplication in vitro.',s:['wcr_star','dcn']},
 {id:'erecta',n:'Type Erecta',g:'rob',y:1910,yl:'XXe s. (position indicative)',pl:'Ouganda',th:48,r:300,imp:1,p:[['can','selection']],
  d:'Port érigé. C’est un type morphologique du Robusta ougandais, pas une variété au sens strict. Ses clones donnent des rendements élevés.',s:['uganda']},
 {id:'nganda',n:'Type Nganda',g:'rob',y:1915,yl:'XXe s. (position indicative)',pl:'Ouganda',th:57,r:338,imp:1,p:[['can','selection']],
  d:'Port étalé : l’autre grand type ougandais. Il se combine mieux en sélection (meilleure aptitude générale à la combinaison).',s:['uganda']},
 {id:'bp534',n:'BP 534',g:'rob',y:1930,yl:'XXe s. (date non vérifiée)',pl:'Java (Indonésie)',th:68,r:300,imp:1,p:[['can','selection']],
  d:'Clone indonésien de Robusta référencé par World Coffee Research.',s:['wcr_rob','wcr_poster']},
 {id:'sln',n:'Sln.1R · Sln.2R',g:'rob',y:1960,yl:'XXe s. (date non vérifiée)',pl:'Inde (CCRI)',th:77,r:322,imp:1,p:[['can','selection']],
  d:'Sélections indiennes de Robusta du Central Coffee Research Institute.',s:['wcr_poster']},
 {id:'cxr',n:'CxR',alt:'Sln.3R',g:'rob',y:1970,yl:'XXe s. (date non vérifiée)',pl:'Inde (CCRI)',th:64,r:362,imp:1,p:[['can','croisement'],['cong','croisement']],
  d:'Hybride interspécifique C. congensis × C. canephora : ce n’est pas un Robusta pur.',s:['cxr']},
 {id:'kr',n:'KR1 – KR10',g:'rob',y:2010,yl:'années 2000 – 2010',pl:'Ouganda (NaCORI)',th:47,r:378,imp:1,p:[['can','selection']],
  d:'Variétés résistantes au flétrissement (Coffee Wilt Disease). Selon World Coffee Research, elles peuvent augmenter le revenu des producteurs jusqu’à 250 %.',s:['wcr_robh']},
 {id:'sidra',n:'Sidra',g:'eth',y:2000,yl:'Équateur, ≈ années 1990 – 2000 (récit débattu)',pl:'Pichincha (Équateur) → Colombie',th:152,r:335,imp:1,p:[['eth','introduction']],
  d:'Le récit courant en fait un croisement Typica × Bourbon né dans une station de recherche de Nestlé en Équateur. Les tests génétiques publiés par des torréfacteurs pointent plutôt vers une landrace éthiopienne, et World Coffee Research estime que le nom recouvre peut-être plusieurs variétés différentes. Une habituée des compétitions.',s:['ozsidra','sey2']},
 {id:'pink',n:'Pink Bourbon',g:'eth',y:2014,yl:'Huila (Colombie), ≈ années 2010',pl:'Huila (Colombie)',th:176,r:345,imp:2,p:[['eth','introduction']],
  d:'Cerises roses, d’abord prises pour un croisement spontané de Bourbon rouge et jaune. Deux analyses génétiques (2017, puis 2023 par RD2 Vision) concluent qu’il s’agit d’une landrace éthiopienne, sans lien avec Bourbon. Le nom est resté.',s:['ci_pink','sey2']},
 {id:'mmaya',n:'Mundo Maya',alt:'H16',g:'f1',y:2013,yl:'≈ années 2010',pl:'CIRAD & ECOM (Nicaragua)',th:13,r:410,imp:1,p:[['sarch','croisement','T5296'],['eth','croisement','ET01']],
  d:'Hybride F1 Sarchimor T5296 × accession éthiopienne ET01, issu du programme mené par le CIRAD et ses partenaires (CATIE, Icafé, ECOM) entre 1990 et 2013. Avec Centroamericano, il dépasse en rendement les variétés les plus plantées d’Amérique latine dans les essais publiés. Multiplication par clonage.',s:['euph','helena_f1']},
 {id:'dr132',n:'De-Re 132',alt:'德热132',g:'loc',y:2010,yl:'sélection de l’institut de Dehong (date non trouvée)',pl:'Ruili, Dehong (Yunnan)',th:356,r:405,imp:2,
  d:'Sélection de l’Institut de recherche en agriculture tropicale de Dehong (Ruili), partie d’un caféier isolé aux fruits jaune doré repéré dans sa collection. Sa généalogie exacte n’est pas publiée en source ouverte. C’est la figure de proue de la série De-Re (德热) : 16 variétés selon l’institut, dont 8 homologuées au niveau national, parmi lesquelles De-Re 3 et De-Re 4.',
  yun:'L’une des rares variétés nées au Yunnan. L’institut conserve la plus grande collection de caféiers de Chine (plus de 1 150 ressources). Il affirme que les variétés qu’il a sélectionnées ou diffusées, Catimor CIFC 7963 compris, couvrent plus de 80 % des surfaces de la province : c’est sa communication, pas un chiffre indépendant. À Dehong, on cultive surtout Catimor, De-Re et Geisha.',s:['qq_dr','napstic_dr','huanqiu_dr','dh_blog']},
 {id:'steno',n:'Coffea stenophylla',g:'esp',test:1,y:2021,yl:'retrouvée en 2018 · étude publiée en 2021',pl:'Sierra Leone, Guinée, Côte d’Ivoire',th:86,r:440,imp:2,
  d:'Cultivée en Afrique de l’Ouest jusqu’au début du XXe siècle puis abandonnée, plus observée en Sierra Leone depuis 1954. Retrouvée à l’état sauvage en 2018 par l’équipe d’Aaron Davis (Kew). Elle pousse à une température moyenne de 24,9 °C, jusqu’à 6,8 °C de plus que l’Arabica, et un jury de dégustation lui a trouvé un profil proche de l’Arabica. Fruits noirs. Espèce menacée, pas encore cultivée à grande échelle.',s:['kew_steno','phys_steno']},
 {id:'wcrf1',n:'F1 de WCR',alt:'4 finalistes',g:'f1',test:1,y:2024,yl:'croisés en 2016 · essais chez les producteurs 2024 – 2030',pl:'World Coffee Research (Amérique centrale)',th:32,r:440,imp:2,p:[['mars','croisement','et Obatã, IAPAR 59, Geisha'],['eth','croisement','8 Arabica sauvages']],
  d:'En 2016, World Coffee Research crée 46 hybrides F1 en croisant 8 Arabica sauvages de sa collection avec trois Sarchimor (Obatã, Marsellesa, IAPAR 59) et Geisha. Fin de la première phase d’essais en 2022 : quatre finalistes. Depuis 2024, ils sont plantés chez des producteurs partenaires, en conditions réelles. Décision de diffusion vers 2030. Ils n’ont pas encore de nom commercial.',s:['wcr_f1pre','wcr_f1_2017','wcr_ar22']},
 {id:'exc',n:'Coffea dewevrei',alt:'Excelsa',g:'esp',y:2025,yl:'espèce à part entière depuis 2025',pl:'Afrique centrale · cultivée en Inde, en Ouganda, en Asie du Sud-Est',th:113,r:410,imp:1,p:[['lib','filiation','séparée de Liberica']],
  d:'Longtemps considéré comme une variété de Liberica, l’Excelsa est reconnu comme espèce distincte par une étude génomique de Kew publiée en 2025. Plus productif que Liberica, il intéresse pour sa résistance à la chaleur et à la sécheresse ; quelques domaines indiens le travaillent déjà en café de spécialité.',s:['np_lib','mongabay']},
 {id:'innov',n:'Innovea',alt:'nouvelles lignées',g:'f1',test:1,y:2025,yl:'lancé en 2022 · premières variétés visées en 2030',pl:'Réseau de World Coffee Research, 9 pays',th:45,r:480,imp:2,p:[['wcrf1','croisement','meilleurs parents des essais']],
  d:'Premier programme mondial de sélection de l’Arabica depuis cinquante ans, lancé en 2022 avec neuf pays : Costa Rica, Inde, Indonésie, Kenya, Mexique, Pérou, Rwanda, Ouganda, États-Unis. Les meilleurs parents des essais internationaux servent à de nouveaux croisements (environ 1 000 plants semés début 2023), triés grâce à la génomique. Objectif : une centaine de lignées pures en 2030, et de nouveaux hybrides. Un réseau équivalent est annoncé pour le Robusta.',
  yun:'La Chine ne fait pas partie des neuf pays fondateurs : le Yunnan diversifie ses variétés par ses propres instituts.',s:['wcr_innov','wcr_f1pre','wcr_ar22']},
 {id:'libex',n:'Coffea × libex',alt:'Libex',g:'esp',test:1,y:2026,yl:'nom proposé en 2026',pl:'Ouganda, Inde, Asie du Sud-Est',th:100,r:485,imp:1,p:[['lib','croisement'],['exc','croisement']],
  d:'Nom proposé en 2026 par l’équipe de Kew pour les hybrides Liberica × Excelsa qui apparaissent d’eux-mêmes là où les deux espèces poussent côte à côte. L’idée : réunir la productivité de l’Excelsa et la tolérance climatique du Liberica. Encore au stade de la recherche.',s:['fc_libex','mongabay']},
 {id:'bmount',n:'Blue Mountain',alt:'PNG Gold, Boyo',g:'typ',y:1728,yl:'introduit en Jamaïque en 1728',pl:'Blue Mountains (Jamaïque)',th:228,r:196,imp:2,p:[['typ','mutation']],
  d:'Le café arrive en Jamaïque en 1728, et la lignée Typica qui s’y installe est devenue le Blue Mountain — décrit comme une mutation de Typica dotée d’une certaine résistance à l’anthracnose des baies. Le nom est d’abord une appellation : seule la récolte certifiée des paroisses de Saint Andrew, Saint Thomas, Portland et Saint Mary peut le porter, dans des montagnes qui montent à 2 256 m, sous un climat frais et brumeux. Plus de 80 % de la production part au Japon. La même lignée est cultivée au Kenya, à Hawaï, en Haïti, en Papouasie-Nouvelle-Guinée (sous le nom de PNG Gold) et au Cameroun (Boyo).',s:['wk_jbm','wk_list']},
 {id:'laurina',n:'Laurina',alt:'Bourbon pointu',g:'bou',y:1810,yl:'≈ 1810',pl:'Île Bourbon (La Réunion)',th:250,r:196,imp:2,p:[['bou','mutation']],
  d:'Vers 1810, les planteurs de La Réunion remarquent des Bourbon plus petits, aux cerises et aux graines pointues : d’où le surnom de « Bourbon pointu ». On l’a longtemps cru né d’un croisement avec les caféiers indigènes de l’île ; les travaux consacrés à son origine concluent à une simple mutation naturelle du Bourbon, génétiquement presque identique. Son nom vient de sa ressemblance avec le laurier. Elle contient environ la moitié de la caféine d’un Arabica ordinaire — ce qui la rend aussi plus vulnérable aux insectes, la caféine servant de répulsif naturel. Port en sapin de Noël, environ deux mètres, petites feuilles, cerises fragiles. Presque éteinte à la fin du XIXe siècle, elle est revenue depuis, et a porté la routine gagnante du World Brewers Cup 2018.',s:['pdg_laurina','wcr_cat']},
 {id:'fmission',n:'French Mission',g:'bou',y:1897,yl:'≈ 1897',pl:'Afrique de l’Est (missions françaises)',th:322,r:196,imp:2,p:[['bou','introduction']],
  d:'Nom donné au Bourbon planté en Afrique de l’Est par les missionnaires français vers 1897. Ce n’est donc pas une variété distincte, mais une population de Bourbon acclimatée au Kenya, en Tanzanie et au Rwanda. C’est d’elle que sortent les sélections kényanes : K7 en est tiré directement, et SL34 a été sélectionné dans du French Mission — même si World Coffee Research rattache sa signature génétique au versant Typica du groupe. Le nom circule encore sur les marchés africains, et on le retrouve derrière l’Arusha de Tanzanie et de Papouasie.',s:['wk_list','wcr_k7','wcr_cat']},
 {id:'boujaune',n:'Bourbon jaune',alt:'Bourbon Amarelo',g:'bou',y:1930,yl:'1930',pl:'Pederneiras, São Paulo (Brésil)',th:276,r:186,imp:3,p:[['bou','mutation']],
  d:'Repéré en 1930 à Pederneiras (São Paulo). Deux hypothèses coexistent et la question reste débattue : un croisement naturel entre les Bourbon jaune et rouge de Botucatu, ou une simple mutation du Bourbon rouge. Ses cerises mûrissent jaune d’or au lieu de rouge. C’est l’une des premières variétés reconnues pour sa tasse — douce, de corps délicat, complexe — avec un rendement nettement supérieur aux anciennes : sa production triple au Brésil entre 1949 et 1951, avant de reculer devant des variétés plus productives et plus résistantes. L’IAC a repris ses travaux en 2005. Au Cup of Excellence Brésil 2017, un lot a été noté 92,33 et vendu 126 $ la livre, cent fois le cours du jour.',
  yun:'Planté au Yunnan à côté du Catimor, avec Typica et Pacamara, dans les parcelles qui cherchent la tasse plutôt que le rendement. C’est la variété du Bourbon jaune de Yunma, qui vient de Gaosheng Manor, dans la vallée de Lujiang (Baoshan).',s:['pdg_bresil','wk_list','wcr_bou']},
 {id:'k7',n:'K7',g:'bou',y:1936,yl:'1936',pl:'Legelet Estate, Muhoroni (Kenya)',th:272,r:270,imp:1,p:[['fmission','selection']],
  d:'Sélection kényane tirée du French Mission par le planteur R. H. Walker, puis affinée sur cinq générations par les Scott Agricultural Laboratories et diffusée en 1936. Elle a été retenue sur la seule base des dégustations. Grand arbre, rendement moyen, bon potentiel en altitude, première récolte en troisième année. Elle sert aujourd’hui de repère de rendement dans le catalogue de World Coffee Research, aux côtés de Caturra et de Bourbon, et elle a beaucoup servi aux programmes kényans et tanzaniens : on la retrouve dans la parenté de Ruiru 11 et de Batian.',s:['wcr_k7','wk_list']},
 {id:'pache',n:'Pache',alt:'Pache comum',g:'typ',y:1949,yl:'1949',pl:'Finca Brito, Santa Cruz Naranjo, Santa Rosa (Guatemala)',th:214,r:268,imp:1,p:[['typ','mutation']],
  d:'Mutation naturelle de Typica due à un seul gène de nanisme : l’arbre reste compact, se plante plus dense et rend davantage. Repérée en 1949 sur la ferme Brito, à Santa Cruz Naranjo, puis fixée par sélection massale — on retient un groupe d’arbres performants, on mélange leurs graines, et on recommence. Première récolte en quatrième année. Croisée avec Caturra, elle a donné le Pache Colis, aux fruits plus gros et au feuillage rugueux.',s:['wcr_pache','wk_list']},
 {id:'jarc',n:'74110 · 74112',alt:'sélections de Jimma',g:'eth',y:1974,yl:'série « 74 », diffusée à partir des années 1970',pl:'Jimma Agricultural Research Center (Éthiopie)',th:158,r:300,imp:2,p:[['eth','selection']],
  d:'Derrière le mot « heirloom » des lots éthiopiens, il y a aussi des variétés nommées et homologuées. Les numéros de la série 74 sortent du centre de recherche agricole de Jimma (JARC), qui a sélectionné dans les forêts éthiopiennes des arbres résistants à l’anthracnose des baies. Avec 74158, ce sont les trois variétés les plus courantes du Sidama : grain petit à moyen, tasse équilibrée en acidité et en corps. Les travaux publiés par le JARC utilisent encore 74110 comme variété de référence pour comparer les méthodes de traitement.',s:['pdg_sidama','pmc_jarc']},
 {id:'t5296',n:'T5296',g:'intro',y:1978,yl:'années 1970 (≈)',pl:'CIFC (Portugal) → CATIE (Costa Rica)',th:358,r:255,imp:2,p:[['sarch','selection']],
  d:'Hybride de Timor 832/2 × Villa Sarchi : la lignée mère de toute la famille Sarchimor. Naine, gros grain, rendement moyen, bon potentiel en tasse en altitude, résistance intermédiaire à la rouille, première récolte en troisième année. Son défaut est connu : la lignée n’est pas uniforme, les plants ne se reproduisent pas à l’identique d’une génération à l’autre — raison pour laquelle World Coffee Research ne la recommande pas en plantation tout en la jugeant essentielle en sélection. Elle exige une forte fertilisation, et elle est le parent des hybrides F1 Centroamericano et Mundo Maya.',s:['wcr_t5296','wcr_cat']},
 {id:'t8667',n:'T8667',g:'intro',y:1978,yl:'descendance F5 reçue au CATIE en 1978',pl:'CIFC (Portugal) → CATIE (Costa Rica)',th:352,r:330,imp:2,p:[['catimor','selection']],
  d:'Hybride de Timor 832/1 × Caturra, puis sélection généalogique : c’est la lignée de Catimor la plus importante de l’histoire de la sélection en Amérique centrale. Elle naît avec PROMECAFE, le consortium régional fondé en 1978 par l’USAID et l’IAC de Campinas pour répondre à l’arrivée de la rouille ; la même année, le CATIE reçoit du CIFC la descendance F5. Port nain, bourgeons bronze, rendement élevé, résistance intermédiaire à la rouille, première récolte en troisième année, bonne adaptation aux zones chaudes et aux sols acides. Son potentiel en tasse en altitude est jugé faible : c’est la limite de toute la famille.',s:['wcr_t8667','wcr_cat']},
 {id:'vcol',n:'Variedad Colombia',alt:'Colombia',g:'intro',y:1982,yl:'1982',pl:'Cenicafé (Colombie)',th:325,r:315,imp:2,p:[['catimor','selection']],
  d:'Première variété issue du programme lancé par Cenicafé en 1968 pour obtenir des caféiers résistants à la rouille, en partant de Caturra et de l’Hybride de Timor. Diffusée en 1982, un an avant que la rouille n’atteigne la Colombie pour la première fois. Cenicafé a ensuite cherché mieux — plus de rendement, plus de résistance, de plus gros grains, une tasse proche de celle de Caturra, et de la longévité : après vingt-trois ans de travail, cela a donné le Castillo.',s:['pdg_castillo','bh']},
 {id:'ruiru11',n:'Ruiru 11',g:'f1',y:1985,yl:'1985',pl:'Station de recherche de Ruiru (Kenya)',th:290,r:335,imp:2,p:[['catimor','croisement','parent femelle'],['k7','croisement','avec SL28, N39, Rume Sudan…']],
  d:'En 1968, une épidémie d’anthracnose des baies fait perdre la moitié de la récolte kényane. La station de Ruiru lance un programme intensif de sélection et sort en 1985 un hybride composite : un Catimor comme parent femelle, croisé avec un mélange issu de K7, SL28, N39 et Rume Sudan. Naine, rendement très élevé, première récolte dès la deuxième année, bon potentiel en tasse en altitude — mais la réputation d’une tasse en retrait sur K7, SL28 et SL34. C’est le plant qui a permis au Kenya de replanter dense et de perdre moins.',s:['wcr_ruiru','wk_list']},
 {id:'cr95',n:'Costa Rica 95',g:'intro',y:1991,yl:'années 1990 (date de diffusion non trouvée)',pl:'ICAFE (Costa Rica)',th:341,r:355,imp:1,p:[['catimor','selection']],
  d:'Même croisement que T8667 — Hybride de Timor 832/1 × Caturra — sélectionné génération après génération par l’Institut du café du Costa Rica. Naine, rendement élevé, potentiel en tasse jugé faible en altitude. Elle montre une habitude de la filière : un même croisement, repris par deux instituts, donne deux variétés qui portent deux noms.',s:['wcr_cr95','wcr_t8667']},
 {id:'obata',n:'Obatã rouge',alt:'Obatã Vermelho',g:'intro',y:2000,yl:'diffusé au Brésil en 2000',pl:'IAC, Campinas (Brésil)',th:24,r:310,imp:1,p:[['sarch','selection']],
  d:'Hybride de Timor 832/2 × Villa Sarchi CIFC 971/10, sélectionné génération après génération par l’Institut agronomique de Campinas, dans l’État de São Paulo. Diffusé au Brésil en 2000, puis apporté au Costa Rica par l’ICAFE pour une diffusion commerciale en 2014. Nain, rendement élevé, bon potentiel en tasse en altitude. C’est l’un des trois Sarchimor que World Coffee Research a croisés avec des Arabica sauvages pour créer ses hybrides F1.',s:['wcr_obata','wcr_f1_2017']},
 {id:'iapar59',n:'IAPAR 59',g:'intro',y:1993,yl:'années 1990 (date de diffusion non trouvée)',pl:'IAPAR, Paraná (Brésil)',th:8,r:368,imp:1,p:[['sarch','selection']],
  d:'Même croisement que T5296 — Hybride de Timor 832/2 × Villa Sarchi — sélectionné cette fois par l’Institut agronomique du Paraná. Nain, bourgeons bronze clair, rendement moyen, résistant à la rouille et à certains nématodes, première récolte en troisième année ; potentiel en tasse jugé faible en altitude. Comme Obatã et Marsellesa, il sert de parent aux hybrides F1 de World Coffee Research.',s:['wcr_iapar','wcr_f1_2017']},
 {id:'batian',n:'Batian',g:'intro',y:2010,yl:'2010',pl:'Coffee Research Station, Ruiru (Kenya)',th:307,r:370,imp:1,p:[['ruiru11','selection'],['hdt','introgression']],
  d:'Diffusé au Kenya en 2010, obtenu par sélection d’arbres isolés dans les générations F5 du parent mâle de certaines descendances de Ruiru 11. Variété composite : trois lignées pures mélangées, dont la parenté réunit SL28, SL34, Rume Sudan, N39, K7, SL4 et l’Hybride de Timor. Grand arbre, rendement élevé, première récolte dès la deuxième année, et surtout un très bon potentiel en tasse en altitude — rare pour une variété résistante à la fois à la rouille et à l’anthracnose des baies.',s:['wcr_batian','wcr_cat']},
 {id:'chiroso',n:'Chiroso',alt:'Caturra Chiroso',g:'eth',y:2012,yl:'repéré au Cup of Excellence Colombie 2012',pl:'Urrao, Antioquia (Colombie)',th:190,r:300,imp:2,p:[['eth','introduction']],
  d:'Cultivé surtout à Urrao, dans le sud-ouest d’Antioquia. On l’a d’abord pris pour une mutation de Caturra aux grains allongés, d’où son premier nom de « Caturra Chiroso » — chiroso veut dire « un peu étiré » dans le parler rural colombien. Des tests génétiques le rattachent plutôt aux landraces éthiopiennes, donc en dehors du groupe Bourbon-Typica ; ces travaux n’ont pas encore été validés scientifiquement, et personne ne sait comment la variété est passée d’Éthiopie en Colombie. Deux types d’arbres coexistent à Urrao, l’un à cerises rouge sombre, l’autre à fruits plus jaunes, aux feuilles différentes. Même trajectoire que Sidra ou Pink Bourbon : repéré dans un concours, puis planté pour la tasse.',s:['pdg_chiroso','wk_list']},
 {id:'ceni1',n:'Cenicafé 1',g:'intro',y:2016,yl:'≈ 2016 · vingt ans de travaux',pl:'Cenicafé (Colombie)',th:318,r:365,imp:1,p:[['catimor','selection']],
  d:'Caturra × Hybride de Timor 1343, trié parmi 116 descendances avancées : vingt ans de sélection pour donner aux planteurs colombiens un arbre à l’allure de Caturra mais résistant à la rouille — et aussi à l’anthracnose des baies, qui n’est pas encore arrivée en Colombie. Rendement du niveau de Castillo, gros grain, notes de spécialité en dégustation selon la fédération colombienne. Il se plante jusqu’à 10 000 arbres par hectare en plein soleil, 5 000 à 7 000 sous ombrage.',s:['pdg_ceni1']},
 {id:'cifc7963',n:'Catimor CIFC 7963',alt:'卡蒂姆 7963',g:'intro',y:1988,yl:'diffusé au Yunnan à partir des années 1980',pl:'CIFC (Portugal) → Yunnan',th:334,r:392,imp:3,p:[['catimor','selection']],
  d:'Une lignée de Catimor parmi des dizaines, et pourtant l’une des plus plantées d’Asie. Le numéro est celui de la collection du CIFC, au Portugal, d’où sortent toutes les lignées de la famille.',
  yun:'C’est, concrètement, la variété du Yunnan. En 2011, elle couvrait à elle seule environ 90 % des 43 000 ha de la province. L’institut de Dehong, qui l’a diffusée, affirme que les variétés qu’il a sélectionnées ou introduites — CIFC 7963 comprise — couvrent plus de 80 % des surfaces : c’est sa communication, pas un chiffre indépendant. Derrière la quasi-totalité du « petit grain du Yunnan » vendu dans le monde, il y a donc cette seule lignée — et la monoculture qui va avec, que les instituts de la province cherchent aujourd’hui à desserrer.',s:['varzea','napstic_dr','chinadaily','ozone_cat']}

/* Axe Yunnan : événements */
const EVENTS=[
 {y:1892,t:'Zhukula, premier café du Yunnan',d:'Un missionnaire français, Alfred Liétard (Tian Deneng), plante des caféiers autour de son église à Zhukula (Binchuan, Dali). Selon les sources, la date est 1892, 1902 ou 1904. Une vingtaine d’arbres centenaires y subsistent.',reg:'dali',s:['zcd','woc','ubc','pang']},
 {y:1908,t:'Le Robusta arrive à Hainan',d:'Hors Yunnan : du Robusta est rapporté de Malaisie sur l’île de Hainan. Le Yunnan, lui, restera une terre d’Arabica.',s:['varzea']},
 {y:1914,t:'Ruili : Typica & Bourbon depuis la Birmanie',d:'Des responsables jingpo de la frontière introduisent Typica et Bourbon depuis la Birmanie au village de Nongxianshan (Ruili, Dehong).',reg:'dehong',s:['varzea']},
 {y:1955,t:'Baoshan passe à l’échelle',d:'Dans les années 1950, la vallée de Lujiang (Baoshan) devient le premier bassin structuré, avec environ 4 000 ha de Typica et de Bourbon.',reg:'baoshan',s:['varzea','yex']},
 {y:1963,t:'S288 arrive d’Inde',d:'Une première variété résistante à la rouille est introduite au Yunnan.',s:['varzea']},
 {y:1988,t:'Le tournant Catimor',d:'Après un programme public des années 1980 (S288 et Catimor), Nestlé s’associe au gouvernement du Yunnan pour planter du Catimor dans toute la province. 1988 est l’année de référence : le gouvernement chinois, la Banque mondiale et le PNUD lancent ensemble le programme qui installe la caféiculture moderne au Yunnan. Aujourd’hui, 98 % du café chinois en vient.',reg:'puer',s:['woc','wiki']},
 {y:2007,t:'Hogood, l’usine à soluble',d:'Fondation de Hogood Coffee à Dehong, qui devient le premier fabricant chinois de café soluble. L’entreprise profite de règles foncières assouplies au Yunnan pour regrouper les parcelles sous contrat : elle fournit les plants, les paysans récoltent, elle rachète les grains. C’est le modèle qui a fait du Yunnan un fournisseur de volume avant d’être un terroir.',reg:'dehong',s:['wiki']},
 {y:2009,t:'Les premiers lots de spécialité',d:'La production de spécialité démarre vers 2009 autour de quelques précurseurs, dont Hu Xixiang à Mangzhang Farms (Menglian, Pu’er), accompagnés par des professionnels étrangers. En 2013, Yunnan Coffee Traders devient le premier exportateur dédié au café de spécialité de la province.',reg:'puer',s:['wiki']},
 {y:2011,t:'43 000 ha, 90 % de Catimor',d:'La lignée CIFC 7963 domine. La province produit 53 240 t de café en 2011.',s:['varzea']},
 {y:2012,t:'Starbucks s’installe à Pu’er',d:'Ouverture du Yunnan Farmer Support Center. En 2014, Starbucks achète plus de la moitié du café chinois importé aux États-Unis sur les neuf premiers mois de l’année.',reg:'puer',s:['starbucks','wiki']},
 {y:2016,t:'Une bourse du café à Pu’er',d:'Le Yunnan Coffee Exchange ouvre en janvier 2016. La même année, environ la moitié de la récolte part à l’export et rapporte 280 millions de dollars — presque uniquement du grain vert de qualité commerciale, vers l’Europe. En 2018, Chongqing devient le premier pôle d’échange du pays.',reg:'puer',s:['wiki']},
 {y:2018,t:'La Chine, pays invité du salon SCA',d:'La Specialty Coffee Association choisit la Chine comme pays portrait de son salon, le plus grand du monde. À l’époque, le café de spécialité représente encore moins de 2 % des volumes chinois. Entre 2006 et 2017, la consommation intérieure a progressé de 22 % par an en moyenne.',s:['wiki']},
 {y:2022,t:'> 95 % de Catimor, et des ressources éthiopiennes',d:'Le Catimor dépasse 95 % de la production. L’Académie des sciences agricoles du Yunnan a rassemblé plus de 6 000 ressources génétiques venues d’Éthiopie pour diversifier les variétés.',s:['chinadaily','cd2']},
 {y:2023,t:'La banque de gènes de Ruili',d:'Le conservatoire de caféiers du ministère de l’Agriculture, tenu par l’institut de Dehong à Ruili, dépasse 800 ressources fin 2023 ; il en compte aujourd’hui plus de 1 150, la plus grande collection de Chine. C’est de là que sort la série locale De-Re (德热).',reg:'dehong',s:['napstic_dr','huanqiu_dr']},
 {y:2024,t:'146 000 t, dont 31,6 % premium',d:'La production du Yunnan progresse de 13 %. Selon l’association du café du Yunnan, 31,6 % des grains sont classés premium et 80 % sont transformés sur place.',s:['cd25']},
 {y:2025,t:'Premier exportateur de Chine',d:'Porté par des cours mondiaux record, le Yunnan exporte pour 860 millions de yuans de café, plus de 40 % des exportations chinoises. Dehong adopte un plan d’action 2025 – 2027 pour la qualité.',s:['cd26','dh_blog']},
 {y:2025,t:'Gems of Yunnan, édition pilote',d:'144 cafés de sept régions en compétition.',s:['ace']},
 {y:2026,t:'Gems of Yunnan 2026',d:'169 cafés, dont 30 au-dessus de 87 pts. Le Geisha domine le classement ; un Catimor finit 12e (88,53).',s:['ace']}
];

/* Terroirs (coordonnées approximatives des villes principales) */
const REGIONS=[
 {id:'puer',n:'Pu’er',zh:'普洱',lat:22.79,lon:100.97,d:'Premier bassin de Chine : environ 60 % de la production nationale selon Wikipédia. Siège du Farmer Support Center de Starbucks (2012). Au GoY 2026, deux lots de Menglian et Lancang poussent à 1 780 – 2 000 m.',d2:'Menglian est l’un des trois grands bassins de la province, avec Baoshan et Dehong. C’est là, à Mangzhang Farms, qu’ont commencé les premiers lots de spécialité vers 2009, et c’est à Pu’er qu’a ouvert le Yunnan Coffee Exchange, en janvier 2016. Le bassin fait le pont entre les deux visages du Yunnan : le volume qui part à l’export, et les quelques fermes qui visent la tasse.',s:['wiki','starbucks','ace']},
 {id:'baoshan',n:'Baoshan',zh:'保山',lat:25.11,lon:99.17,d:'Vallée de Lujiang, le long de la Nu (Salween). Premier bassin à passer à l’échelle dans les années 1950. Elle place 7 des 15 premiers lots du GoY 2026, dont le seul Catimor du top 15.',d2:'La vallée de Lujiang suit la Nu (Salween) : un fond de vallée chaud, des versants qui montent vite, et les plus anciennes plantations structurées de Chine — environ 4 000 ha dès les années 1950, en Typica et Bourbon. C’est l’un des trois grands bassins de la province, et de loin le plus régulier en compétition : sept des quinze premiers lots du Gems of Yunnan 2026, dont le seul Catimor du haut du classement. C’est aussi d’ici, à Gaosheng Manor, que viennent les cafés de Yunma.',s:['varzea','ace']},
 {id:'lincang',n:'Lincang',zh:'临沧',lat:23.88,lon:100.09,d:'Région traversée par le tropique du Cancer. Elle remporte le lot n°1 du GoY 2026 (Geisha lavé, 91,78) et le n°3 (coopérative Songfeng).',d2:'Le tropique du Cancer traverse la région : à cette latitude, l’altitude compense la saison, et les lots classés poussent vers 1 600 – 1 900 m. Elle place le premier et le troisième lot du Gems of Yunnan 2026, tous deux en Geisha lavé — la preuve que la nouvelle vague ne se joue pas seulement au sud.',s:['yex','ace']},
 {id:'dehong',n:'Dehong',zh:'德宏',lat:24.43,lon:98.58,d:'Frontière birmane. Ruili est la porte d’entrée de Typica et de Bourbon en 1914. On y trouve aussi des lots d’altitude, comme Xiazhai (1 800 m) au GoY 2026. L’institut de Ruili y conserve la plus grande banque de gènes de caféiers de Chine et a créé la série De-Re.',d2:'Porte d’entrée historique : c’est à Nongxianshan, près de Ruili, que Typica et Bourbon passent la frontière birmane en 1914. C’est aussi la région du volume : Hogood Coffee, fondé à Dehong en 2007, y a construit la filière du soluble sur des parcelles regroupées sous contrat. Et c’est de là que vient la diversification, avec le conservatoire de Ruili — plus de 1 150 ressources, la plus grande collection de caféiers de Chine — et la série locale De-Re. Dehong s’est donné un plan qualité 2025 – 2027.',s:['varzea','ace','huanqiu_dr']},
 {id:'xsbn',n:'Xishuangbanna',zh:'西双版纳',lat:22.0,lon:100.8,d:'Extrême sud de la province, vers 22°N. Un Geisha lavé de Menghai y obtient la 2e place du GoY 2026.',d2:'L’extrême sud de la province, vers 22°N : la latitude la plus basse du Yunnan caféier, donc la plus chaude, où l’altitude devient décisive. Menghai y place le deuxième lot du Gems of Yunnan 2026, un Geisha lavé à 1 650 m.',s:['ace']},

function vnoise(seed){const P=new Float32Array(512);let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<512;i++)P[i]=r();

function buildBG(){
