<!doctype html>
<!--
  La carte du relief, une page par langue.

  `outils/construire-carte.mjs` remplace chaque {{clé}} et dépose le résultat
  dans public/carte/<langue>/index.html. Tous les chemins sont relatifs : le
  dossier « carte » fonctionne à la racine du domaine comme dans un
  sous-dossier, et se redépose seul.
-->
<html lang="{{htmlLang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efebe2" />
    <title>{{titre}} — Yunma</title>
    <meta name="description" content="{{seo}}" />
    <!-- Hors index : la carte n'a pas de texte à offrir aux moteurs, et aucun
         lien du site n'y mène. On y entre par une adresse que l'on partage. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="stylesheet" href="../carte.css" />
  </head>

  <body>
    <main class="carte" data-carte data-langue="{{langue}}">
      <canvas class="carte__toile" data-toile></canvas>

      <header class="carte__tete">
        <h1 class="carte__titre">{{titre}}</h1>
        <p class="carte__sous">{{intro}}</p>
      </header>

      <!-- La légende tient en deux lignes : aucune couleur ne code l'altitude,
           il n'y a donc pas d'échelle à expliquer. L'équidistance se montre
           par trois traits, et l'orange dit ce qu'il désigne. -->
      <div class="carte__legende" data-legende>
        <p class="carte__cle">
          <span class="carte__traits" aria-hidden="true"><i></i><i></i><i></i></span>
          <span data-equidistance></span>
        </p>
        <p class="carte__cle">
          <span class="carte__traits carte__traits--forte" aria-hidden="true"><i></i></span>
          <span data-ceinture></span>
        </p>
        <p class="carte__cle">
          <span class="carte__pastille" aria-hidden="true"></span>
          <span data-fermes></span>
        </p>
      </div>

      <article class="carte__fiche" data-fiche hidden>
        <button class="carte__fermer" type="button" data-fermer>
          <svg viewBox="0 0 22 22" aria-hidden="true">
            <path d="M3 3l16 16M19 3L3 19" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <span class="visually-hidden">{{fermer}}</span>
        </button>
        <p class="carte__fiche-lieu" data-fiche-lieu></p>
        <h2 class="carte__fiche-nom" data-fiche-nom></h2>
        <p class="carte__fiche-alt" data-fiche-alt></p>
        <p class="carte__fiche-texte" data-fiche-texte></p>
        <ul class="carte__fiche-cafes" data-fiche-cafes></ul>
      </article>

      <div class="carte__pied">
        <button class="btn btn--ligne carte__survol" type="button" data-survol aria-pressed="false">{{survoler}}</button>
        <p class="carte__aide">{{aide}}</p>
        <a class="link carte__retour" href="../../{{langue}}/cafes/">{{retour}}<span class="arrow" aria-hidden="true">→</span></a>
        <p class="carte__source">{{source}}</p>
      </div>

      <div class="carte__panne" data-panne hidden>
        <div>
          <p class="lead">{{panne}}</p>
          <p><a class="link" href="../../{{langue}}/cafes/">{{retour}}<span class="arrow" aria-hidden="true">→</span></a></p>
        </div>
      </div>
    </main>

    <script type="application/json" data-carte-relief>{{reliefJson}}</script>
    <script type="application/json" data-carte-fermes>{{fermesJson}}</script>
    <script type="application/json" data-carte-textes>{{textesJson}}</script>
    <script src="../carte.js" type="module"></script>
  </body>
</html>
